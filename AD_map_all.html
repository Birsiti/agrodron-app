<!DOCTYPE html>
<!--
  AgroDrone.BY · Все поля на карте
  v1.0 · 2026-05-29
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Карта полей · AgroDrone.BY</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1b5935;--gm:#2a7a4a;--ga:#3aaa5e;
  --bg:#eef0f5;--card:#fff;--border:#e2e6ef;
  --t1:#1a1f2e;--t2:#5a6476;--t3:#9aa3b2;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);
  --r:14px;--rs:10px;--f:'Manrope',sans-serif;
  --red:#dc2626;--amber:#d97706;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:#000;color:var(--t1);max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.hdr{background:linear-gradient(135deg,var(--green),var(--gm));padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.back{font-size:24px;color:#fff;cursor:pointer;font-weight:300;line-height:1}
.hdr-title{font-size:15px;font-weight:800;color:#fff;flex:1}
.hdr-count{font-size:12px;color:rgba(255,255,255,.7);font-weight:600}

/* ФИЛЬТР */
.filter-bar{background:var(--card);padding:10px 12px;display:flex;gap:6px;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch}
.filter-bar::-webkit-scrollbar{display:none}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;font-family:var(--f);border:1.5px solid var(--border);background:#fff;color:var(--t2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s}
.chip.active{color:#fff;border-color:transparent}

/* КАРТА */
#map{flex:1;width:100%}

/* ЛЕГЕНДА */
.legend{position:absolute;bottom:16px;left:12px;background:rgba(255,255,255,.95);border-radius:var(--rs);padding:10px 12px;box-shadow:var(--sh);backdrop-filter:blur(8px);z-index:10}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2);font-weight:600;margin-bottom:4px}
.leg-item:last-child{margin-bottom:0}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ЗАГРУЗКА */
.loading-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:10px}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{color:#fff;font-size:13px;font-weight:600}

.map-wrap{flex:1;position:relative;display:flex;flex-direction:column}
</style>
</head>
<body>

<div class="hdr">
  <div class="back" onclick="goBack()">‹</div>
  <div class="hdr-title">🗺 Карта полей</div>
  <div class="hdr-count" id="count">Загрузка...</div>
</div>

<div class="filter-bar" id="filter-bar">
  <button class="chip active" style="background:var(--green)" data-status="all" onclick="filterMap('all',this)">Все</button>
  <button class="chip" data-status="новое" onclick="filterMap('новое',this)">🟡 Новое</button>
  <button class="chip" data-status="в работе" onclick="filterMap('в работе',this)">🟣 В работе</button>
  <button class="chip" data-status="частично" onclick="filterMap('частично',this)">🟠 Частично</button>
  <button class="chip" data-status="готово" onclick="filterMap('готово',this)">🟢 Готово</button>
</div>

<div class="map-wrap">
  <div id="map"></div>
  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-txt">Загружаю поля...</div>
  </div>
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#fbbf24"></div>Новое</div>
    <div class="leg-item"><div class="leg-dot" style="background:#8b5cf6"></div>В работе</div>
    <div class="leg-item"><div class="leg-dot" style="background:#f97316"></div>Частично</div>
    <div class="leg-item"><div class="leg-dot" style="background:#10b981"></div>Готово</div>
  </div>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
function goBack(){window.history.back();}

const STATUS_COLORS={
  'новое':'#fbbf24','подтверждено':'#3b82f6',
  'в работе':'#8b5cf6','в_работе':'#8b5cf6',
  'частично':'#f97316','готово':'#10b981','отклонено':'#9aa3b2'
};
const STATUS_CHIP_COLORS={
  'новое':'#d97706','подтверждено':'#2563eb',
  'в работе':'#7c3aed','частично':'#ea580c','готово':'#059669'
};

let gmap=null, allMarkers=[], allFields=[], currentFilter='all';

window.onMapsReady=function(){
  gmap=new google.maps.Map(document.getElementById('map'),{
    center:{lat:52.4,lng:26.5},zoom:8,
    mapTypeId:'hybrid',
    disableDefaultUI:true,
    zoomControl:true,
    gestureHandling:'greedy'
  });
  loadFields();
};

async function loadFields(){
  try{
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/ПОЛЯ КЛИЕНТОВ!A2:N500?key=${SHEETS_KEY}`;
    const r=await fetch(url);
    const d=await r.json();
    const rows=d.values||[];
    // A=ID B=ID клиента C=Район D=Название E=Координаты F=Культура G=Препарат H=Норма I=Площадь J=Статус
    allFields=rows.filter(r=>r[0]&&r[4]).map(r=>({
      id:r[0]||'',
      name:r[3]||'',
      coords:r[4]||'',
      crop:r[5]||'',
      ha:parseFloat(r[8])||0,
      status:(r[9]||'новое').toLowerCase().trim()
    }));
    document.getElementById('count').textContent=allFields.length+' полей';
    placeMarkers(allFields);
    document.getElementById('loading-overlay').style.display='none';
  }catch(e){
    console.error(e);
    document.getElementById('loading-overlay').innerHTML=
      '<div style="color:#fff;font-size:13px;text-align:center">❌ Ошибка загрузки</div>';
  }
}

function placeMarkers(fields){
  // Убираем старые
  allMarkers.forEach(m=>m.setMap(null));
  allMarkers=[];
  const bounds=new google.maps.LatLngBounds();
  let added=0;

  fields.forEach(f=>{
    const norm=f.coords.replace(/(\d),(\d)/g,'$1.$2');
    const [la,ln]=norm.split(',').map(s=>parseFloat(s.trim()));
    if(isNaN(la)||isNaN(ln)||la<51||la>56||ln<23||ln>33)return;

    const status=f.status.replace(/ /g,'_');
    const color=STATUS_COLORS[f.status]||STATUS_COLORS[status]||'#9aa3b2';

    const marker=new google.maps.Marker({
      position:{lat:la,lng:ln},map:gmap,title:f.name,
      icon:{
        path:google.maps.SymbolPath.CIRCLE,
        fillColor:color,fillOpacity:1,
        strokeColor:'#fff',strokeWeight:2,scale:9
      }
    });

    const iw=new google.maps.InfoWindow({content:`
      <div style="font-family:Manrope,sans-serif;padding:8px 4px;min-width:140px">
        <div style="font-weight:800;font-size:14px;margin-bottom:4px;color:#1a1f2e">${f.name||'—'}</div>
        <div style="font-size:12px;color:#5a6476;margin-bottom:6px">${f.crop||'—'} · ${f.ha} га</div>
        <div style="font-size:11px;font-weight:700;color:${color};background:${color}22;padding:3px 8px;border-radius:10px;display:inline-block">${f.status||'новое'}</div>
      </div>`
    });
    marker.addListener('click',()=>{
      allMarkers.forEach(m=>m._iw&&m._iw.close());
      iw.open(gmap,marker);
      marker._iw=iw;
    });

    allMarkers.push(marker);
    bounds.extend({lat:la,lng:ln});
    added++;
  });

  if(added>0)gmap.fitBounds(bounds,{top:20,right:20,bottom:20,left:20});
  document.getElementById('count').textContent=added+' полей';
}

function filterMap(status,el){
  currentFilter=status;
  document.querySelectorAll('.chip').forEach(c=>{
    c.classList.remove('active');
    c.style.background='';
    c.style.color='';
    c.style.borderColor='';
  });
  el.classList.add('active');
  if(status==='all'){
    el.style.background='var(--green)';
    el.style.color='#fff';
    el.style.borderColor='transparent';
    placeMarkers(allFields);
  } else {
    const col=STATUS_CHIP_COLORS[status]||'#1b5935';
    el.style.background=col;
    el.style.color='#fff';
    el.style.borderColor='transparent';
    placeMarkers(allFields.filter(f=>f.status===status||f.status===status.replace(/ /g,'_')));
  }
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjxpxSE5noJCigtTYP56_Q6O65awnflwg&callback=onMapsReady&loading=async" defer></script>
</body>
</html>
