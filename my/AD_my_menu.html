<!DOCTYPE html>
<!--
  AgroDrone.BY · Моё меню (Бруй Д.А.)
  v1.0 · 2026-06-21
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AgroDrone.BY · Моё меню</title>
<script src="../config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff5eb;--card:#fff;--orange:#d97706;--orange-dark:#b45309;
  --orange-light:#fed7aa;--orange-pale:#fff5eb;
  --green:#1b5935;--gm:#2a7a4a;--gl:#e8f4ed;--ga:#3aaa5e;
  --border:#f4dcc4;--t1:#1a1f2e;--t2:#5a6476;--t3:#9aa3b2;
  --sh:0 2px 8px rgba(217,119,6,.12),0 8px 24px rgba(217,119,6,.08);
  --r:16px;--rs:12px;--f:'Manrope',sans-serif;
  --red:#dc2626;--blue:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--t1);margin:0 auto;height:100%;display:flex;flex-direction:column}
.app-hdr{background:linear-gradient(135deg,var(--orange),var(--orange-dark));padding:16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 4px 16px rgba(217,119,6,.2)}
.brand{display:flex;align-items:center;gap:12px}
.brand-ico{width:42px;height:42px;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;backdrop-filter:blur(8px)}
.brand-ico svg{width:24px;height:24px}
.brand-name{font-size:19px;font-weight:800;color:#fff;line-height:1.1;letter-spacing:-.3px}
.brand-sub{font-size:11px;color:rgba(255,255,255,.75);font-weight:600;margin-top:2px}
.owner-chip{font-size:12px;font-weight:800;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(8px)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.menu-wrap{padding:12px 12px 32px}
.sep{font-size:11px;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:1px;padding:16px 4px 10px}
.mi{background:var(--card);border-radius:var(--rs);padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 1px 4px rgba(217,119,6,.08);margin-bottom:8px;transition:all .2s;border:2px solid transparent}
.mi:active{transform:scale(.98);border-color:var(--orange-light);background:var(--orange-pale)}
.mi-ico{font-size:26px;width:32px;text-align:center;flex-shrink:0}
.mi-info{flex:1}
.mi-title{font-size:15px;font-weight:800;color:var(--t1);letter-spacing:-.2px}
.mi-sub{font-size:12px;color:var(--t3);margin-top:3px}
.mi-arr{color:var(--orange);font-size:20px;margin-left:auto;font-weight:300}
</style>
</head>
<body>
<div class="app-hdr">
  <div class="brand">
    <div class="brand-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">AgroDrone<em>.BY</em></div>
      <div class="brand-sub">Личный кабинет</div>
    </div>
  </div>
  <div class="owner-chip">Бруй Д.А.</div>
</div>

<div class="scroll">
<div class="menu-wrap">

  <div class="sep">🚐 Транспорт</div>
  <div class="mi" onclick="goTo('AD_crafter.html')">
    <div class="mi-ico">🚌</div>
    <div class="mi-info">
      <div class="mi-title">VW Crafter</div>
      <div class="mi-sub">АР 4246-7 · Трекер расходов</div>
    </div>
    <div class="mi-arr">›</div>
  </div>

  <div class="sep">✏️ Редактирование</div>
  <div class="mi" onclick="goTo('AD_edit_trips.html')">
    <div class="mi-ico">📅</div>
    <div class="mi-info">
      <div class="mi-title">Командировки</div>
      <div class="mi-sub">Изменить даты выезда и возврата</div>
    </div>
    <div class="mi-arr">›</div>
  </div>
  <div class="mi" onclick="goTo('AD_edit_fields.html')">
    <div class="mi-ico">🌾</div>
    <div class="mi-info">
      <div class="mi-title">Поля агрономов</div>
      <div class="mi-sub">Статус, площадь, препарат, норма</div>
    </div>
    <div class="mi-arr">›</div>
  </div>

</div>
</div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
function goTo(f){window.location.href=f}
</script>
</body>
</html>
