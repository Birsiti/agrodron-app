<!DOCTYPE html>
<!--
  AgroDrone.BY · Моё меню (Бруй Д.А.)
  v1.0 · 2026-06-21
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AgroDrone.BY · Моё меню</title>
<script src="../config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1E8;--surface:#FFFFFF;--surface-2:#FBF8F1;--border:#E7E0D0;
  --t1:#1B2A1A;--t2:#57634F;--t3:#8E9884;
  --brand:#1F4D3B;--brand-2:#28624C;--brand-dark:#122A20;--brand-bg:#E6F0E8;
  --green:#0E8A57;--green-bg:#E7F8EE;
  --red:#C0392B;--red-bg:#FBEAE7;
  --blue:#2C6591;--blue-bg:#E9F1F7;
  --amber:#A9700F;--amber-bg:#FBF1DC;
  --radius-lg:22px;--radius:16px;--radius-sm:11px;
  --shadow-xs:0 1px 2px rgba(20,30,19,.05);
  --shadow-sm:0 2px 10px rgba(20,30,19,.06);
  --shadow-md:0 10px 28px rgba(20,30,19,.10);
  --shadow-lg:0 18px 44px rgba(18,42,32,.22);
  --ease:cubic-bezier(.32,.72,0,1);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--t1);margin:0 auto;max-width:480px;height:100%;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:var(--font)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app-hdr{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--brand-2) 0%,var(--brand) 46%,var(--brand-dark) 100%);border-radius:0 0 28px 28px;padding:20px 18px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:var(--shadow-lg)}
.app-hdr::before{content:'';position:absolute;top:-70px;right:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;position:relative}
.brand-ico{width:44px;height:44px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-ico svg{width:24px;height:24px}
.brand-name{font-size:19px;font-weight:800;color:#fff;line-height:1.1;letter-spacing:-.3px}
.brand-name em{font-style:normal;opacity:.7}
.brand-sub{font-size:11.5px;color:rgba(243,248,241,.68);font-weight:600;margin-top:3px}
.owner-chip{font-size:12px;font-weight:700;padding:7px 14px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);color:#fff;position:relative;flex-shrink:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.menu-wrap{padding:14px 12px 32px}
.sep{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;padding:16px 4px 9px}
.mi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:var(--shadow-sm);margin-bottom:8px;transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.mi:active{transform:scale(.985);box-shadow:var(--shadow-xs)}
.mi-ico{width:42px;height:42px;border-radius:12px;background:var(--brand-bg);font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mi-info{flex:1;min-width:0}
.mi-title{font-size:14.5px;font-weight:700;color:var(--t1);letter-spacing:-.1px}
.mi-sub{font-size:12px;color:var(--t3);margin-top:3px}
.mi-arr{color:var(--t3);font-size:19px;margin-left:auto;transition:transform .2s var(--ease)}
</style>
</head>
<body>
<div class="app-hdr">
  <div class="brand">
    <div class="brand-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">AgroDrone<em>.BY</em></div>
      <div class="brand-sub">Личный кабинет</div>
    </div>
  </div>
  <div class="owner-chip">Бруй Д.А.</div>
</div>

<div class="scroll">
<div class="menu-wrap">

  <div class="sep">Транспорт</div>
  <div class="mi" onclick="goTo('AD_crafter.html')">
    <div class="mi-ico">🚌</div>
    <div class="mi-info">
      <div class="mi-title">VW Crafter</div>
      <div class="mi-sub">АР 4246-7 · Трекер расходов</div>
    </div>
    <div class="mi-arr">›</div>
  </div>

  <div class="sep">Редактирование</div>
  <div class="mi" onclick="goTo('AD_edit_trips.html')">
    <div class="mi-ico">📅</div>
    <div class="mi-info">
      <div class="mi-title">Командировки</div>
      <div class="mi-sub">Изменить даты выезда и возврата</div>
    </div>
    <div class="mi-arr">›</div>
  </div>
  <div class="mi" onclick="goTo('AD_edit_fields.html')">
    <div class="mi-ico">🌾</div>
    <div class="mi-info">
      <div class="mi-title">Поля агрономов</div>
      <div class="mi-sub">Статус, площадь, препарат, норма</div>
    </div>
    <div class="mi-arr">›</div>
  </div>

</div>
</div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
function goTo(f){window.location.href=f}
</script>
</body>
</html>
