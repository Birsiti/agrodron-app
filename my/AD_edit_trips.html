<!DOCTYPE html>
<!--
  AgroDrone.BY · Редактор командировок
  v1.0 · 2026-06-21
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AgroDrone.BY · Командировки</title>
<script src="../config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1E8;--surface:#FFFFFF;--surface-2:#FBF8F1;--border:#E7E0D0;
  --t1:#1B2A1A;--t2:#57634F;--t3:#8E9884;
  --brand:#1F4D3B;--brand-2:#28624C;--brand-dark:#122A20;--brand-bg:#E6F0E8;
  --green:#0E8A57;--green-bg:#E7F8EE;
  --red:#C0392B;--red-bg:#FBEAE7;
  --blue:#2C6591;--blue-bg:#E9F1F7;
  --amber:#A9700F;--amber-bg:#FBF1DC;
  --radius-lg:22px;--radius:16px;--radius-sm:11px;
  --shadow-xs:0 1px 2px rgba(20,30,19,.05);
  --shadow-sm:0 2px 10px rgba(20,30,19,.06);
  --shadow-md:0 10px 28px rgba(20,30,19,.10);
  --ease:cubic-bezier(.32,.72,0,1);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--t1);max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:var(--font)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sub-hdr{background:var(--surface);padding:12px 16px 11px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.back-btn{width:32px;height:32px;border-radius:10px;background:var(--brand-bg);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--brand);line-height:1;flex-shrink:0;transition:transform .12s var(--ease)}
.back-btn:active{transform:scale(.9)}
.hdr-title{font-size:16px;font-weight:700;color:var(--t1);letter-spacing:-.1px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.wrap{padding:14px 12px 32px}

/* Фильтры */
.filters{display:flex;gap:8px;margin-bottom:14px}
.filter-btn{flex:1;padding:9px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--t2);cursor:pointer;text-align:center;transition:all .18s var(--ease)}
.filter-btn.active{border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:var(--shadow-xs)}

/* Карточка командировки */
.trip-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;margin-bottom:9px;box-shadow:var(--shadow-sm);cursor:pointer;border-left:4px solid var(--border);transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.trip-card.active{border-left-color:var(--amber)}
.trip-card.closed{border-left-color:var(--green)}
.trip-card:active{transform:scale(.985);box-shadow:var(--shadow-xs)}
.tc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px}
.tc-district{font-size:14.5px;font-weight:700;color:var(--t1)}
.tc-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;flex-shrink:0}
.badge-active{background:var(--amber-bg);color:var(--amber)}
.badge-closed{background:var(--green-bg);color:var(--green)}
.tc-dates{font-size:12px;color:var(--t2);display:flex;gap:16px;font-variant-numeric:tabular-nums}
.tc-op{font-size:11.5px;color:var(--t3);margin-top:5px}

/* Модалка */
.overlay{position:fixed;inset:0;background:rgba(18,30,17,.44);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-end;opacity:0;transition:opacity .22s var(--ease)}
.overlay.show{display:flex;opacity:1}
.modal{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 -12px 32px rgba(20,30,19,.14)}
.modal-title{font-size:16.5px;font-weight:700;color:var(--t1);margin-bottom:4px;letter-spacing:-.1px}
.modal-sub{font-size:12.5px;color:var(--t3);margin-bottom:20px}
.field-label{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;margin-top:14px}
.field-label:first-of-type{margin-top:0}
.inp{width:100%;padding:13px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;color:var(--t1);background:var(--bg);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(31,77,59,.12)}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.btn-cancel{flex:1;padding:13px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:600;color:var(--t2);cursor:pointer}
.btn-save{flex:2;padding:13px;border-radius:var(--radius-sm);border:none;background:linear-gradient(150deg,var(--brand-2),var(--brand-dark));color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);transition:opacity .15s,transform .1s}
.btn-save:active{opacity:.88;transform:scale(.98)}

.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:var(--radius);height:80px;margin-bottom:10px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{text-align:center;padding:44px 20px;color:var(--t3);font-size:13.5px;font-weight:500}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(6px);background:var(--brand-dark);color:#fff;padding:11px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);white-space:nowrap;box-shadow:var(--shadow-md)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="sub-hdr">
  <div class="back-btn" onclick="history.back()">‹</div>
  <div class="hdr-title">Командировки</div>
</div>
<div class="scroll">
<div class="wrap">

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">Все</button>
    <button class="filter-btn" onclick="setFilter('active',this)">Активные</button>
    <button class="filter-btn" onclick="setFilter('closed',this)">Завершённые</button>
  </div>

  <div id="skeleton">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
  <div id="list"></div>

</div>
</div>

<!-- Модалка редактирования -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title" id="m-title">Командировка</div>
    <div class="modal-sub" id="m-sub"></div>
    <div class="field-label">Дата выезда</div>
    <input class="inp" type="date" id="m-date-start">
    <div class="field-label">Дата возврата</div>
    <input class="inp" type="date" id="m-date-end">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-save" onclick="saveTrip()">Сохранить</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}

let allTrips=[];
let currentFilter='all';
let editingTrip=null;

function fmtDMY(val){
  if(!val)return'—';
  const s=String(val);
  if(s.includes('T')){const d=new Date(s);return`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`}
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[3]}.${m[2]}.${m[1]}`;
  return s;
}

function toISO(val){
  if(!val)return'';
  const s=String(val).trim();
  const m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if(m)return`${m[3]}-${m[2]}-${m[1]}`;
  if(s.match(/^\d{4}-\d{2}-\d{2}/))return s.slice(0,10);
  return'';
}

async function apiCall(action,data={}){
  try{
    const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action,data})});
    const d=await r.json();
    return{ok:d.ok,result:d.result?.result||d.result,error:d.error};
  }catch(e){return{ok:false,error:e.message}}
}

function showToast(msg,ok=true){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=ok?'#122A20':'rgba(192,57,43,.95)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList(){
  const list=document.getElementById('list');
  let trips=allTrips;
  if(currentFilter==='active') trips=trips.filter(t=>t.status==='активна'||t.status==='подготовка');
if(currentFilter==='closed') trips=trips.filter(t=>t.status==='закрыта');

  if(!trips.length){
    list.innerHTML='<div class="empty">Командировки не найдены</div>';
    return;
  }

  list.innerHTML=trips.map(t=>{
    const isActive=t.status==='активна'||t.status==='подготовка';
    return`
    <div class="trip-card ${isActive?'active':'closed'}" onclick="openModal(${JSON.stringify(t).replace(/"/g,'&quot;')})">
      <div class="tc-top">
        <div class="tc-district">${t.district||t.direction||'—'}</div>
        <span class="tc-badge ${isActive?'badge-active':'badge-closed'}">${isActive?'Активна':'Завершена'}</span>
      </div>
      <div class="tc-dates">
        <span>▶ ${fmtDMY(t.dateStart)||'—'}</span>
        <span>◀ ${fmtDMY(t.dateEnd||t.dateReturn)||'—'}</span>
      </div>
      <div class="tc-op">${t.operatorName||t.operator||''} · ID: ${t.id||t.tripId}</div>
    </div>`;
  }).join('');
}

function openModal(t){
  editingTrip=t;
  document.getElementById('m-title').textContent=t.district||t.direction||'Командировка';
  document.getElementById('m-sub').textContent=`ID: ${t.id||t.tripId} · ${t.operatorName||t.operator||''}`;
  document.getElementById('m-date-start').value=toISO(t.dateStart)||'';
  document.getElementById('m-date-end').value=toISO(t.dateEnd||t.dateReturn)||'';
  document.getElementById('overlay').classList.add('show');
}

function closeModal(e){
  if(e&&e.target!==document.getElementById('overlay'))return;
  document.getElementById('overlay').classList.remove('show');
  editingTrip=null;
}

async function saveTrip(){
  if(!editingTrip)return;
  const dateStart=document.getElementById('m-date-start').value;
  const dateEnd=document.getElementById('m-date-end').value;
  const btn=document.querySelector('.btn-save');
  btn.textContent='Сохраняем...';btn.disabled=true;

  const resp=await apiCall('updateTrip',{
    tripId:editingTrip.id||editingTrip.tripId,
    dateStart,
    dateEnd
  });

  btn.textContent='Сохранить';btn.disabled=false;

  if(resp.ok){
    // Обновляем локально
    const idx=allTrips.findIndex(t=>(t.id||t.tripId)===(editingTrip.id||editingTrip.tripId));
    if(idx>=0){allTrips[idx].dateStart=dateStart;allTrips[idx].dateEnd=dateEnd;allTrips[idx].dateReturn=dateEnd;}
    renderList();
    document.getElementById('overlay').classList.remove('show');
    showToast('✓ Сохранено');
  } else {
    showToast('Ошибка: '+(resp.error||'нет ответа'),false);
  }
}

async function load(){
  const resp=await apiCall('getAllTrips',{});
  document.getElementById('skeleton').style.display='none';
  if(resp.ok&&resp.result?.trips){
    allTrips=resp.result.trips;
    renderList();
  } else {
    document.getElementById('list').innerHTML='<div class="empty">Не удалось загрузить командировки</div>';
  }
}

window.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
