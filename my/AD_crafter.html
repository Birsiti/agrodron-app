<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}

const SCRIPT_URL = 'https://agrodrone-proxy.birsiti.workers.dev';
const SHEET_ID   = '1NzeC5jdm5osCHFQVSHKpUGMkWT2xI6xTjwl7LMRLHWU';
const SHEETS_KEY = 'AIzaSyAxiaO9KgDN277ibcLCfXHAc2VpSSeQMDg';
const PLATE_NORM = 'AP42467';

let allRecords   = [];
let currentRate  = 150;
let fuelPrice    = 2.70;
let activeFilter = 'all';
let openCardIdx  = null;
let editingId    = null;
let rateMode     = 'rate'; // 'rate' | 'fuel'
let selectedFuel = 'Бензин';
let selectedCat  = 'Питание';

document.addEventListener('DOMContentLoaded', () => {
  setDefaultDate();
  onTypeChange();
  loadAll();
});

function setDefaultDate() {
  document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
}

// ── Load ──────────────────────────────────────────────────
async function loadAll() {
  try {
    const [trips, manual, expenses] = await Promise.all([loadTrips(), loadManual(), loadExpenses()]);
    const sorted = [...trips, ...manual, ...expenses].sort((a,b)=>new Date(a.dateSort)-new Date(b.dateSort));
    let rate = currentRate;
    for (const r of sorted) {
      if (r.rate) { rate = r.rate; currentRate = rate; }
      r.rateUsed = rate;
      if (r.source==='авто' && r.type==='trip') r.amount = (r.nights||0)*rate;
      if (r.source==='ручной' && r.type==='trip' && r.days) r.amount = r.days*rate;
      if (r.type==='mileage') r.amount = rate*0.5;
    }
    allRecords = sorted.sort((a,b)=>new Date(b.dateSort)-new Date(a.dateSort));
    document.getElementById('rate-display').textContent = `Ставка: ${currentRate} BYN/сут`;
    document.getElementById('fuel-display').textContent = `Топливо: ${fuelPrice.toFixed(2)} BYN/л`;
    renderBalance();
    renderFeed();
  } catch(e) {
    document.getElementById('feed').innerHTML=`<div class="loader" style="color:#DC2626">Ошибка: ${e.message}</div>`;
  }
}

async function loadTrips() {
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/КОМАНДИРОВКИ?key=${SHEETS_KEY}`;
  const r=await fetch(url); const d=await r.json();
  const rows=d.values||[]; if(!rows.length) return [];
  const h=rows[0];
  const C={id:h.indexOf('ID'),dateFrom:h.indexOf('Дата откр.'),dateTo:h.indexOf('Дата закр.'),district:h.indexOf('Район'),car:h.indexOf('Авто'),note:h.indexOf('Примечание')};
  const results=[];
  for(let i=1;i<rows.length;i++){
    const row=rows[i]; if(!row[C.id]) continue;
    let carData={};
    try{carData=JSON.parse(row[C.car]||'{}');}catch(e){}
    const plate=String(carData.plate||'').replace(/\s/g,'');
    if(!plate.includes(PLATE_NORM)&&!plate.includes('AP4246-7')) continue;
    const dFrom=parseDate(row[C.dateFrom]); const dTo=parseDate(row[C.dateTo]);
    if(!dFrom) continue;
    const daysCount=daysBetween(dFrom,dTo||dFrom);
    const nights=Math.max(1,daysCount-1);
    const noteStr=String(row[C.note]||'');
    const kmMatch=noteStr.match(/Пробег[:\s]+(\d+)/i);
    results.push({type:'trip',dateSort:dFrom.toISOString(),dateDisp:fmtDisp(dFrom),
      desc:`${row[C.district]||'—'} · ${row[C.id]}`,
      km:kmMatch?parseInt(kmMatch[1]):null,nights,days:daysCount,amount:0,source:'авто',tripId:row[C.id]});
  }
  return results;
}

async function loadManual() {
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/КРАФТЕР?key=${SHEETS_KEY}`;
  try{
    const r=await fetch(url); const d=await r.json();
    const rows=d.values||[]; if(rows.length<2) return [];
    const h=rows[0];
    const C={id:h.indexOf('ID'),date:h.indexOf('Дата'),type:h.indexOf('Тип'),desc:h.indexOf('Описание'),km:h.indexOf('Км'),amount:h.indexOf('Сумма'),days:h.indexOf('Дни'),note:h.indexOf('Примечание'),rate:h.indexOf('Ставка')};
    return rows.slice(1).filter(r=>r[C.date]).map((row,i)=>{
      const d=parseDate(row[C.date]);
      const type=row[C.type]||'mileage';
      const amt=parseFloat(row[C.amount])||0;
      const rate=C.rate>=0?parseFloat(row[C.rate])||null:null;
      return{type,dateSort:d?d.toISOString():row[C.date],dateDisp:d?fmtDisp(d):row[C.date],
        desc:row[C.desc]||'',km:row[C.km]||null,days:parseInt(row[C.days])||null,
        amount:amt,rate,note:row[C.note]||'',source:'ручной',id:row[C.id]||''};
    });
  }catch(e){return[];}
}

async function loadExpenses() {
  // Тянем из РАСХОДЫ записи где Командировка ID начинается с CR-
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/РАСХОДЫ?key=${SHEETS_KEY}`;
  try{
    const r=await fetch(url); const d=await r.json();
    const rows=d.values||[]; if(rows.length<2) return [];
    const h=rows[0];
    const C={id:h.indexOf('ID'),tripId:h.indexOf('Командировка ID'),dayId:h.indexOf('День ID'),
      date:h.indexOf('Дата'),payType:h.indexOf('Тип оплаты'),cat:h.indexOf('Категория'),
      amount:h.indexOf('Сумма'),comment:h.indexOf('Комментарий')};
    return rows.slice(1).filter(row=>{
      const tid=String(row[C.tripId]||'');
      return tid.startsWith('CR-');
    }).map(row=>{
      const d=parseDate(row[C.date]);
      const cat=String(row[C.cat]||'');
      const isFuel=cat==='Бензин'||cat==='Дизель';
      const liters=null; // литры не хранятся в РАСХОДЫ напрямую — берём из комментария
      const commentStr=String(row[C.comment]||'');
      const litMatch=commentStr.match(/(\d+[\.,]\d*)\s*л/i);
      const litersVal=litMatch?parseFloat(litMatch[1].replace(',','.')):null;
      return{
        type:isFuel?'fuel':'expense',
        dateSort:d?d.toISOString():row[C.date],
        dateDisp:d?fmtDisp(d):String(row[C.date]||''),
        desc:cat+(commentStr?` · ${commentStr}`:''),
        amount:parseFloat(row[C.amount])||0,
        liters:litersVal,
        cat,
        note:commentStr,
        source:'расходы',
        id:String(row[C.id]||''),
        tripCrId:String(row[C.tripId]||'')
      };
    });
  }catch(e){return[];}
}

// ── Balance ───────────────────────────────────────────────
function renderBalance(){
  const trips    = allRecords.filter(r=>r.type==='trip');
  const repairs  = allRecords.filter(r=>r.type==='repair');
  const mileage  = allRecords.filter(r=>r.type==='mileage');
  const payments = allRecords.filter(r=>r.type==='payment');
  const fuels    = allRecords.filter(r=>r.type==='fuel');
  const expenses = allRecords.filter(r=>r.type==='expense');
  const totalNights=trips.reduce((s,r)=>s+(r.nights??r.days??0),0);
  const accrued=trips.reduce((s,r)=>s+(r.amount||0),0)+mileage.reduce((s,r)=>s+(r.amount||0),0);
  const repairCost=repairs.reduce((s,r)=>s+(r.amount||0),0);
  const fuelCost=fuels.reduce((s,r)=>s+(r.amount||0),0);
  const expCost=expenses.reduce((s,r)=>s+(r.amount||0),0);
  const totalPaid=payments.reduce((s,r)=>s+(r.amount||0),0);
  const balance=accrued-repairCost-fuelCost-expCost-totalPaid;
  const el=document.getElementById('bal-amount');
  el.textContent=(balance>=0?'+':'')+fmt(balance)+' BYN';
  el.className='balance-amount '+(balance>=0?'pos':'neg');
  document.getElementById('bb-accrued').textContent='+'+fmt(accrued);
  document.getElementById('bb-repair').textContent=repairCost>0?'−'+fmt(repairCost):'0';
  document.getElementById('bb-fuel').textContent=(fuelCost+expCost)>0?'−'+fmt(fuelCost+expCost):'0';
  document.getElementById('bb-paid').textContent=totalPaid>0?'−'+fmt(totalPaid):'0';
  document.getElementById('bb-days').textContent=totalNights;
}

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.f-chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  openCardIdx=null;
  renderFeed();
}

function renderFeed(){
  const records=activeFilter==='all'?allRecords:allRecords.filter(r=>r.type===activeFilter);
  document.getElementById('feed-count').textContent=records.length+' записей';
  const feed=document.getElementById('feed');
  if(!records.length){feed.innerHTML=`<div class="empty-feed"><div class="ico">📋</div><div class="txt">Нет записей</div></div>`;return;}

  const ICO={trip:'📅',mileage:'🛣',repair:'🔧',payment:'✅',fuel:'⛽',expense:'💸'};
  feed.innerHTML=records.map((r,idx)=>{
    const ico=ICO[r.type]||'📦';
    const isOpen=openCardIdx===idx;
    let amtHtml='';
    if(r.type==='trip')    amtHtml=`<div class="fc-amount pos">+${fmt(r.amount)}</div>`;
    if(r.type==='repair')  amtHtml=`<div class="fc-amount neg">−${fmt(r.amount)}</div>`;
    if(r.type==='payment') amtHtml=`<div class="fc-amount pay">−${fmt(r.amount)}</div>`;
    if(r.type==='mileage') amtHtml=`<div class="fc-amount pos">+${fmt(r.amount)}</div>`;
    if(r.type==='fuel')    amtHtml=`<div class="fc-amount fuel-c">−${fmt(r.amount)}</div>`;
    if(r.type==='expense') amtHtml=`<div class="fc-amount neg">−${fmt(r.amount)}</div>`;

    const meta=[];
    if(r.type==='trip'){const n=r.source==='ручной'?(r.days||0):(r.nights??0);if(n)meta.push(`${n} сут`);}
    if(r.km) meta.push(`${r.km} км`);
    if(r.type==='fuel'&&r.liters) meta.push(`${r.liters} л`);
    if(r.note&&r.type!=='fuel'&&r.type!=='expense') meta.push(r.note);

    const src=r.source==='авто'?'<div class="fc-source">из таблицы</div>':'';

    const detailRows=[];
    if(r.type==='trip'){
      detailRows.push(['Суток',r.source==='ручной'?(r.days||'—'):(r.nights??'—')]);
      detailRows.push(['Ставка',`${r.rateUsed||currentRate} BYN/сут`]);
      if(r.km) detailRows.push(['Пробег',`${r.km} км`]);
    }
    if(r.type==='mileage'){
      if(r.km) detailRows.push(['Пробег',`${r.km} км`]);
      detailRows.push(['Ставка выезда',`50% · ${fmt(r.amount)} BYN`]);
    }
    if(r.type==='fuel'){
      detailRows.push(['Топливо',r.cat||'—']);
      if(r.liters) detailRows.push(['Литры',`${r.liters} л`]);
      detailRows.push(['Сумма',`${fmt(r.amount)} BYN`]);
      if(r.note) detailRows.push(['Примечание',r.note]);
    }
    if(r.type==='expense'){
      detailRows.push(['Категория',r.cat||'—']);
      detailRows.push(['Сумма',`${fmt(r.amount)} BYN`]);
      if(r.note) detailRows.push(['Примечание',r.note]);
    }
    if(r.type==='repair'||r.type==='payment'){
      detailRows.push(['Сумма',`${fmt(r.amount)} BYN`]);
    }
    if(r.note&&r.type!=='fuel'&&r.type!=='expense') detailRows.push(['Примечание',r.note]);
    detailRows.push(['Источник',r.source==='авто'?'Таблица командировок':r.source==='расходы'?'Лист РАСХОДЫ':'Ручной ввод']);

    const detailHtml=detailRows.map(([l,v])=>`
      <div class="fc-detail-row"><span class="fc-detail-lbl">${l}</span><span class="fc-detail-val">${v}</span></div>`).join('');

    const canEdit=r.source==='ручной';
    const canDelete=r.source==='ручной'||r.source==='расходы';
    const actionsHtml=canDelete?`
      <div class="fc-detail-actions">
        ${canEdit?`<button class="btn-edit" onclick="editRecord(${idx},event)">Редактировать</button>`:''}
        <button class="btn-del" onclick="deleteRecord('${r.id}','${r.source}',event)">Удалить</button>
      </div>`:'';

    return`<div class="fc" onclick="toggleCard(${idx})">
      <div class="fc-main">
        <div class="fc-ico ${r.type}">${ico}</div>
        <div class="fc-body">
          <div class="fc-desc ${isOpen?'':'collapsed'}">${r.dateDisp} — ${r.desc}</div>
          ${meta.length?`<div class="fc-meta">${meta.join(' · ')}</div>`:''}
        </div>
        <div class="fc-right">${amtHtml}${src}</div>
        <span class="fc-arrow" style="transform:rotate(${isOpen?'90':'0'}deg)">›</span>
      </div>
      <div class="fc-detail ${isOpen?'open':''}">
        ${detailHtml}${actionsHtml}
      </div>
    </div>`;
  }).join('');
}

function toggleCard(idx){openCardIdx=openCardIdx===idx?null:idx;renderFeed();}

async function deleteRecord(id,source,e){
  e.stopPropagation();
  if(!id){showToast('Нет ID записи');return;}
  if(!confirm('Удалить запись?')) return;
  const action=source==='расходы'?'deleteExpenseRecord':'deleteCrafterRecord';
  try{
    const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action,data:{id}})});
    const d=await r.json();
    if((d.result?.result||d.result)?.ok||d.ok){showToast('Удалено ✓');openCardIdx=null;await loadAll();}
    else showToast('Ошибка удаления');
  }catch(e){showToast('Ошибка сети');}
}

function editRecord(idx,e){
  e.stopPropagation();
  const r=(activeFilter==='all'?allRecords:allRecords.filter(x=>x.type===activeFilter))[idx];
  if(!r||r.source!=='ручной') return;
  document.getElementById('fType').value=r.type;
  onTypeChange();
  document.getElementById('fDate').value=r.dateSort?.split('T')[0]||'';
  // заполняем нужные поля
  if(r.type==='trip'){
    document.getElementById('fDesc').value=r.desc||'';
    document.getElementById('fDays').value=r.days||'';
    document.getElementById('fAmount').value=r.amount||'';
  } else if(r.type==='mileage'){
    document.getElementById('fDescMileage').value=r.desc||'';
    document.getElementById('fKm').value=r.km||'';
  } else if(r.type==='repair'){
    document.getElementById('fRepairDesc').value=r.desc||'';
    document.getElementById('fRepairAmount').value=r.amount||'';
  } else if(r.type==='payment'){
    document.getElementById('fPayDesc').value=r.desc||'';
    document.getElementById('fPayAmount').value=r.amount||'';
  }
  editingId=r.id;
  document.querySelector('#sheet .sheet-title').textContent='Редактировать запись';
  openSheet();
}

// ── Ставка / Цена топлива ─────────────────────────────────
function openRateSheet(mode){
  rateMode=mode;
  if(mode==='rate'){
    document.getElementById('rateSheetTitle').textContent='Ставка суточных';
    document.getElementById('rateSheetSub').textContent='BYN за сутки командировки';
    document.getElementById('rateInput').value=currentRate;
  } else {
    document.getElementById('rateSheetTitle').textContent='Цена топлива';
    document.getElementById('rateSheetSub').textContent='BYN за литр (дефолт для расчёта)';
    document.getElementById('rateInput').value=fuelPrice;
  }
  document.getElementById('rate-overlay').classList.add('show');
  document.getElementById('rate-sheet').classList.add('show');
}
function closeRateSheet(){
  document.getElementById('rate-overlay').classList.remove('show');
  document.getElementById('rate-sheet').classList.remove('show');
}
function saveRateOrFuel(){
  const v=parseFloat(document.getElementById('rateInput').value);
  if(!v||v<=0){showToast('Введи корректное значение');return;}
  if(rateMode==='rate'){
    currentRate=v;
    document.getElementById('rate-display').textContent=`Ставка: ${currentRate} BYN/сут`;
    for(const r of allRecords){
      r.rateUsed=currentRate;
      if(r.type==='trip') r.amount=(r.nights||r.days||0)*currentRate;
      if(r.type==='mileage') r.amount=currentRate*0.5;
    }
  } else {
    fuelPrice=v;
    document.getElementById('fuel-display').textContent=`Топливо: ${fuelPrice.toFixed(2)} BYN/л`;
    calcFuel();
  }
  renderBalance();renderFeed();
  closeRateSheet();
  showToast(rateMode==='rate'?'Ставка обновлена ✓':'Цена топлива обновлена ✓');
}

// ── Форма ─────────────────────────────────────────────────
function openSheet(){document.getElementById('overlay').classList.add('show');document.getElementById('sheet').classList.add('show');}
function closeAll(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  editingId=null;
  document.querySelector('#sheet .sheet-title').textContent='Новая запись';
}

function selectFuel(f){
  selectedFuel=f;
  document.getElementById('fuel-benz').classList.toggle('active',f==='Бензин');
  document.getElementById('fuel-diez').classList.toggle('active',f==='Дизель');
  calcFuel();
}

function selectCat(c,btn){
  selectedCat=c;
  document.querySelectorAll('#exp-cats .cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function calcFuel(){
  const l=parseFloat(document.getElementById('fLiters').value)||0;
  const el=document.getElementById('fuel-calc-display');
  if(l>0){
    const sum=(l*fuelPrice).toFixed(2);
    el.textContent=`${l} л × ${fuelPrice.toFixed(2)} BYN/л = ${sum} BYN`;
    el.style.display='block';
  } else {el.style.display='none';}
}

function onTypeChange(){
  const type=document.getElementById('fType').value;
  ['g-trip-desc','g-mileage','g-fuel','g-expense','g-repair','g-payment'].forEach(id=>{
    document.getElementById(id).classList.remove('on');
  });
  document.getElementById('fNote').style.display='none';
  const map={trip:'g-trip-desc',mileage:'g-mileage',fuel:'g-fuel',expense:'g-expense',repair:'g-repair',payment:'g-payment'};
  if(map[type]) document.getElementById(map[type]).classList.add('on');
  if(type==='trip'){document.getElementById('fDays').value='1';calcTrip();}
}

function calcTrip(){
  const d=parseInt(document.getElementById('fDays').value)||1;
  document.getElementById('fAmount').value=(d*currentRate).toFixed(0);
}

async function saveRecord(){
  const type=document.getElementById('fType').value;
  const date=document.getElementById('fDate').value;
  if(!date){showToast('Укажи дату');return;}

  const btn=document.getElementById('btnSave');
  btn.disabled=true;btn.textContent='Сохраняю…';

  try{
    let ok=false;

    if(type==='fuel'){
      const liters=parseFloat(document.getElementById('fLiters').value)||0;
      if(!liters){showToast('Укажи литры');btn.disabled=false;btn.textContent='Сохранить';return;}
      const amount=(liters*fuelPrice).toFixed(2);
      const note=document.getElementById('fFuelNote').value.trim();
      // Генерируем CR-ID
      const crId='CR-'+date.replace(/-/g,'')+'-'+Date.now().toString().slice(-6);
      const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'add_expense',data:{
        tripId:crId, date, payType:'Нал', cat:selectedFuel,
        amount, comment:`${liters} л${note?' · '+note:''}`
      }})});
      const d2=await r.json();
      ok=(d2.result?.result||d2.result)?.ok||d2.ok||true;

    } else if(type==='expense'){
      const amount=parseFloat(document.getElementById('fExpAmount').value)||0;
      if(!amount){showToast('Укажи сумму');btn.disabled=false;btn.textContent='Сохранить';return;}
      const note=document.getElementById('fExpNote').value.trim();
      const crId='CR-'+date.replace(/-/g,'')+'-'+Date.now().toString().slice(-6);
      const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'add_expense',data:{
        tripId:crId, date, payType:'Нал', cat:selectedCat, amount, comment:note
      }})});
      const d2=await r.json();
      ok=(d2.result?.result||d2.result)?.ok||d2.ok||true;

    } else {
      // Остальные типы — в КРАФТЕР
      let desc='',amount='',km='',days='';
      if(type==='trip'){desc=document.getElementById('fDesc').value.trim();days=document.getElementById('fDays').value;amount=document.getElementById('fAmount').value;}
      else if(type==='mileage'){desc=document.getElementById('fDescMileage').value.trim();km=document.getElementById('fKm').value;}
      else if(type==='repair'){desc=document.getElementById('fRepairDesc').value.trim();amount=document.getElementById('fRepairAmount').value;}
      else if(type==='payment'){desc=document.getElementById('fPayDesc').value.trim();amount=document.getElementById('fPayAmount').value;}
      if(!desc){showToast('Заполни описание');btn.disabled=false;btn.textContent='Сохранить';return;}

      const action=editingId?'updateCrafterRecord':'addCrafterRecord';
      const payload=editingId
        ?{id:editingId,type,date,desc,km,amount,days,note:''}
        :{type,date,desc,km,amount,days,note:'',rate:''};
      const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action,data:payload})});
      const d2=await r.json();
      const res=d2.result?.result||d2.result||d2;
      ok=res.ok;
      if(!ok){showToast(res.error||'Ошибка');btn.disabled=false;btn.textContent='Сохранить';return;}
    }

    if(ok){showToast(editingId?'Обновлено ✓':'Сохранено ✓');closeAll();clearForm();await loadAll();}
  }catch(e){showToast('Ошибка сети');}
  finally{btn.disabled=false;btn.textContent='Сохранить';}
}

function clearForm(){
  ['fDesc','fKm','fAmount','fDays','fNote','fDescMileage','fLiters','fFuelNote','fExpAmount','fExpNote','fRepairDesc','fRepairAmount','fPayDesc','fPayAmount']
    .forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  editingId=null;
  document.querySelector('#sheet .sheet-title').textContent='Новая запись';
  document.getElementById('fuel-calc-display').style.display='none';
  setDefaultDate();onTypeChange();
}

function parseDate(val){
  if(!val) return null;
  if(val instanceof Date) return val;
  const m=String(val).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  const d=new Date(val);
  return isNaN(d)?null:d;
}
function daysBetween(d1,d2){return Math.round(Math.abs(d2-d1)/86400000)+1;}
function fmtDisp(d){return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'});}
function fmt(n){return Number(n).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:0});}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
