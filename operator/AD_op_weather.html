<!DOCTYPE html>
<!--
  AgroDrone.BY · Оператор — Погода
  v2.0 · 2026-05-24
  Файл: AD_op_weather.html
  Изменения v2.0:
  - Оранжевый дизайн
  - Встроенная погода на завтра + 3 дня через Open-Meteo API
  - Открытие на весь экран
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AgroDrone.BY · Погода</title>
<script src="../config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--t1);margin:0 auto;height:100%;display:flex;flex-direction:column}

.sub-hdr{
  background:linear-gradient(135deg,var(--orange),var(--orange-dark));
  padding:12px 16px 10px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
  box-shadow:0 4px 16px rgba(217,119,6,.2);
}
.back-btn{font-size:24px;cursor:pointer;color:#fff;line-height:1;padding-right:4px;font-weight:300}
.hdr-title{font-size:16px;font-weight:800;color:#fff}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{padding:12px 12px 32px}

.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:10px}
.card-title{font-size:11px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px}

.forecast-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.forecast-day{
  background:var(--orange-pale);
  border-radius:var(--rs);
  padding:12px 8px;
  text-align:center;
  border:1.5px solid var(--border);
}
.forecast-day.today{
  background:linear-gradient(135deg,var(--orange),var(--orange-dark));
  border-color:var(--orange);
}
.forecast-day.today .fd-date,
.forecast-day.today .fd-temp,
.forecast-day.today .fd-wind,
.forecast-day.today .fd-rain{color:#fff}
.fd-date{font-size:11px;font-weight:700;color:var(--orange);margin-bottom:6px}
.fd-ico{font-size:28px;margin-bottom:6px}
.fd-temp{font-size:15px;font-weight:800;color:var(--t1);margin-bottom:4px}
.fd-wind{font-size:11px;color:var(--t2);margin-bottom:2px}
.fd-rain{font-size:11px;color:var(--t3)}

.info-box{border-radius:var(--rs);padding:12px;background:var(--orange-pale);color:var(--orange);font-size:12px;font-weight:600;margin-bottom:8px;border:1.5px solid var(--orange-light)}

.city-btn{display:block;width:100%;padding:14px;border-radius:var(--rs);background:var(--orange-pale);color:var(--orange);border:1.5px solid var(--border);font-size:15px;font-weight:700;font-family:var(--f);cursor:pointer;margin-bottom:8px;text-align:center;transition:all .18s;text-decoration:none}
.city-btn:active{transform:scale(.98)}

.loading{text-align:center;padding:20px;color:var(--t3);font-size:13px}
</style>
</head>
<body>

<div class="sub-hdr">
  <div class="back-btn" onclick="window.location.href='AD_op_menu.html'">‹</div>
  <div class="hdr-title">Weather v2.0</div>
</div>

<div class="scroll">
<div class="wrap">

  <div class="info-box" id="trip-city-info">Загрузка погоды...</div>

  <!-- Прогноз на 4 дня -->
  <div class="card">
    <div class="card-title">🌤 Прогноз на ближайшие дни</div>
    <div class="forecast-grid" id="forecast-grid">
      <div class="loading">⏳ Загрузка...</div>
    </div>
  </div>

  <!-- Параметры для полётов -->
  <div class="card">
    <div class="card-title">✈️ Параметры для полётов</div>
    <div style="font-size:13px;color:var(--t2);line-height:1.8">
      ✅ <b>Ветер</b> до 7 м/с — норма<br>
      ⚠️ <b>Ветер</b> 7–10 м/с — ограничения<br>
      ❌ <b>Ветер</b> >10 м/с — запрет<br>
      ✅ <b>Видимость</b> от 1500 м<br>
      ❌ <b>Осадки</b> — запрет полётов<br>
      ❌ <b>Туман</b> — запрет полётов
    </div>
  </div>

  <!-- Подробный прогноз -->
  <div class="card">
    <div class="card-title">📊 Подробный прогноз</div>
    <a id="btn-trip-city" href="#" target="_blank" class="city-btn" style="display:none">🌐 Открыть gismeteo.by</a>
  </div>

</div>
</div>

<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
// Координаты городов РБ
const COORDS = {
  'Минск': [53.9, 27.57],
  'Ганцевичи': [52.76, 26.42],
  'Столбцы': [53.48, 26.74],
  'Любань': [52.8, 27.98],
  'Барановичи': [53.13, 26.02],
  'Слуцк': [53.03, 27.55],
  'Копыль': [53.15, 27.09]
};

function getWeatherIcon(code) {
  // WMO Weather codes
  if (code === 0) return '☀️';
  if (code <= 3) return '⛅';
  if (code <= 48) return '🌫';
  if (code <= 67) return '🌧';
  if (code <= 77) return '🌨';
  if (code <= 82) return '🌧';
  if (code <= 86) return '🌨';
  return '⛈';
}

async function loadForecast() {
  try {
    const trip = JSON.parse(localStorage.getItem('atk_trip')||'null');
    const city = trip ? trip.direction : 'Минск';
    const coords = COORDS[city] || COORDS['Минск'];
    
    document.getElementById('trip-city-info').textContent = '📍 ' + city;
    
    // Open-Meteo API (бесплатный)
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords[0]}&longitude=${coords[1]}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max,weathercode&timezone=Europe/Minsk&forecast_days=4`;
    
    const r = await fetch(url);
    const d = await r.json();
    
    const grid = document.getElementById('forecast-grid');
    grid.innerHTML = '';
    
    const days = ['Сегодня', 'Завтра', 'Послезавтра'];
    
    for (let i = 0; i < 4; i++) {
      const date = new Date(d.daily.time[i]);
      const dayName = i < 3 ? days[i] : date.toLocaleDateString('ru-RU', {day:'numeric',month:'short'});
      
      const tempMax = Math.round(d.daily.temperature_2m_max[i]);
      const tempMin = Math.round(d.daily.temperature_2m_min[i]);
      const wind = Math.round(d.daily.windspeed_10m_max[i]);
      const rain = d.daily.precipitation_sum[i];
      const icon = getWeatherIcon(d.daily.weathercode[i]);
      
      const card = document.createElement('div');
      card.className = 'forecast-day' + (i === 0 ? ' today' : '');
      card.innerHTML = `
        <div class="fd-date">${dayName}</div>
        <div class="fd-ico">${icon}</div>
        <div class="fd-temp">${tempMax}°/${tempMin}°</div>
        <div class="fd-wind">💨 ${wind} м/с</div>
        <div class="fd-rain">${rain > 0 ? '💧 '+rain+' мм' : '—'}</div>
      `;
      grid.appendChild(card);
    }
    
    // Кнопка gismeteo
    const btn = document.getElementById('btn-trip-city');
    btn.href = 'https://www.gismeteo.by/weather-' + city.toLowerCase() + '-4517/';
    btn.textContent = '🌐 Открыть gismeteo.by (' + city + ')';
    btn.style.display = 'block';
    
  } catch(e) {
    document.getElementById('forecast-grid').innerHTML = '<div class="loading">❌ Ошибка загрузки</div>';
  }
}

window.addEventListener('DOMContentLoaded', loadForecast);
</script>

</body>
</html>
