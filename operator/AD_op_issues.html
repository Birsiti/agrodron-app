<!DOCTYPE html>
<!--
  AgroDrone.BY · Оператор — Проблемы с техникой
  v1.4 · 2026-06-02 · Срочность — плитки с крупным эмодзи (Стоп больше не обрезается)
  Файл: AD_op_issues.html
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AgroDrone.BY · Техника</title>
<script src="../config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f5;--card:#fff;--green:#1b5935;--gm:#2a7a4a;--gl:#e8f4ed;--ga:#3aaa5e;
  --border:#e2e6ef;--t1:#1a1f2e;--t2:#5a6476;--t3:#9aa3b2;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);
  --r:14px;--rs:10px;--f:'Manrope',sans-serif;
  --amber:#d97706;--amber-light:#fef3c7;
  --red:#dc2626;--red-light:#fee2e2;
  --blue:#2563eb;--blue-light:#eff6ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--t1);max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.sub-hdr{background:var(--card);padding:12px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.back-btn{font-size:24px;cursor:pointer;color:var(--green);line-height:1;padding-right:4px;font-weight:300}
.hdr-title{font-size:16px;font-weight:800;color:var(--t1)}

.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:var(--green);border-bottom-color:var(--ga)}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen{display:none}.screen.active{display:block}
.wrap{padding:12px 12px 32px}

.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:10px}
.card-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px}
.fg{margin-bottom:12px}.fg:last-child{margin-bottom:0}
.fl{font-size:12px;font-weight:700;color:var(--t2);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:14px;font-family:var(--f);color:var(--t1);background:#fff;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--ga)}
textarea.fi{resize:none;min-height:100px}

.tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.tech-card{padding:14px;border-radius:var(--rs);border:2px solid var(--border);background:#fff;text-align:center;cursor:pointer;transition:all .18s}
.tech-card.selected{border-color:var(--red);background:var(--red-light)}
.tech-ico{font-size:26px;margin-bottom:6px}
.tech-name{font-size:12px;font-weight:700;color:var(--t2)}

.sev-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sev-btn{padding:14px 6px;border-radius:var(--rs);border:2px solid var(--border);background:#fff;text-align:center;cursor:pointer;transition:all .18s}
.sev-ico{font-size:24px;margin-bottom:6px;line-height:1}
.sev-name{font-size:12px;font-weight:700;color:var(--t2)}
.sev-btn.sel-low     {border-color:var(--amber);background:var(--amber-light)}
.sev-btn.sel-low      .sev-name{color:#92400e}
.sev-btn.sel-high    {border-color:#f97316;background:#ffedd5}
.sev-btn.sel-high     .sev-name{color:#ea580c}
.sev-btn.sel-critical{border-color:#dc2626;background:var(--red-light)}
.sev-btn.sel-critical .sev-name{color:#dc2626}

.issue-card{background:var(--card);border-radius:var(--rs);padding:14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid var(--border)}
.issue-card.открыта{border-left-color:var(--red)}
.issue-card.закрыта{border-left-color:var(--ga)}
.issue-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.issue-title{font-size:14px;font-weight:700;color:var(--t1);flex:1;margin-right:8px}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap}
.badge-open{background:var(--red-light);color:var(--red)}
.badge-resolved{background:var(--gl);color:var(--green)}
.issue-meta{font-size:12px;color:var(--t3);margin-bottom:8px}
.resolve-btn{background:var(--gl);color:var(--green);border:none;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--f)}

.photo-upload{border:2px dashed var(--border);border-radius:var(--rs);padding:20px;text-align:center;cursor:pointer;transition:all .18s;background:#fafbfc}
.photo-upload:active{background:var(--gl);border-color:var(--ga)}
.photo-ico{font-size:32px;margin-bottom:6px;opacity:.5}
.photo-txt{font-size:12px;color:var(--t3);font-weight:600}
#photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.preview-img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1.5px solid var(--border)}

.btn{width:100%;padding:14px;border-radius:var(--rs);border:none;font-size:15px;font-weight:700;font-family:var(--f);cursor:pointer;transition:all .18s;margin-bottom:8px;display:block;text-align:center}
.btn:active{transform:scale(.98)}.btn:last-child{margin-bottom:0}
.btn-red{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff}
.btn-outline{background:#fff;color:var(--t2);border:1.5px solid var(--border)}

.loading{text-align:center;padding:32px;color:var(--t3);font-size:13px;font-weight:600}
.empty{text-align:center;padding:48px 20px;color:var(--t3)}
.empty-ico{font-size:40px;margin-bottom:10px;opacity:.4}
.empty-t{font-size:14px;font-weight:700;color:var(--t2);margin-bottom:4px}
.empty-s{font-size:12px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(26,31,46,.95);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:999;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;max-width:90%}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="sub-hdr">
  <div class="back-btn" onclick="goMenu()">‹</div>
  <div class="hdr-title">Проблемы с техникой</div>
</div>

<div class="tabs">
  <div class="tab active" id="tab-new" onclick="showTab('new')">🔧 Новая</div>
  <div class="tab" id="tab-open" onclick="showTab('open')">⚠️ Открытые</div>
  <div class="tab" id="tab-all" onclick="showTab('all')">📋 Все</div>
</div>

<div class="scroll">

<!-- ══ НОВАЯ ══ -->
<div id="screen-new" class="screen active"><div class="wrap">
  <div class="card">
    <div class="card-title">Техника</div>
    <div class="tech-grid">
      <div class="tech-card selected" onclick="selectTech(this,'А60-ХМ')"><div class="tech-ico">🚁</div><div class="tech-name">А60-ХМ</div></div>
      <div class="tech-card" onclick="selectTech(this,'А70-ХМ')"><div class="tech-ico">🚁</div><div class="tech-name">А70-ХМ</div></div>
      <div class="tech-card" onclick="selectTech(this,'А1-Х')"><div class="tech-ico">🛸</div><div class="tech-name">А1-Х</div></div>
      <div class="tech-card" onclick="selectTech(this,'Ford Transit')"><div class="tech-ico">🚐</div><div class="tech-name">Ford Transit</div></div>
      <div class="tech-card" onclick="selectTech(this,'Генератор')"><div class="tech-ico">⚡</div><div class="tech-name">Генератор</div></div>
      <div class="tech-card" onclick="selectTech(this,'Насосная ст.')"><div class="tech-ico">💧</div><div class="tech-name">Насосная ст.</div></div>
      <div class="tech-card" onclick="selectTech(this,'Другое')"><div class="tech-ico">🔩</div><div class="tech-name">Другое</div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Срочность</div>
    <div class="sev-row">
      <div class="sev-btn sel-low" id="sev-low" onclick="selectSev('low')"><div class="sev-ico">⚠️</div><div class="sev-name">Некритично</div></div>
      <div class="sev-btn" id="sev-high" onclick="selectSev('high')"><div class="sev-ico">🔴</div><div class="sev-name">Серьёзно</div></div>
      <div class="sev-btn" id="sev-critical" onclick="selectSev('critical')"><div class="sev-ico">🆘</div><div class="sev-name">Стоп</div></div>
    </div>
  </div>
  <div class="card">
    <div class="fg">
      <label class="fl">Описание проблемы</label>
      <textarea class="fi" id="issue-desc" placeholder="Опишите что случилось, при каких обстоятельствах..."></textarea>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Фото (необязательно)</div>
    <input type="file" id="photo-input" accept="image/*" multiple style="display:none" onchange="previewPhotos(event)">
    <div class="photo-upload" onclick="document.getElementById('photo-input').click()">
      <div class="photo-ico">📷</div><div class="photo-txt">Нажмите для добавления фото</div>
    </div>
    <div id="photo-preview"></div>
  </div>
  <button class="btn btn-red" onclick="submitIssue()">🔧 Отправить сообщение о проблеме</button>
  <button class="btn btn-outline" onclick="goMenu()">Отмена</button>
</div></div>

<!-- ══ ОТКРЫТЫЕ ══ -->
<div id="screen-open" class="screen"><div class="wrap" id="open-list">
  <div class="loading">⏳ Загрузка...</div>
</div></div>

<!-- ══ ВСЕ ══ -->
<div id="screen-all" class="screen"><div class="wrap" id="all-list">
  <div class="loading">⏳ Загрузка...</div>
</div></div>

</div>
<div id="toast" class="toast"></div>

<script>
function getTrip(){ try{return JSON.parse(localStorage.getItem('atk_trip')||'null')}catch(e){return null} }
function goMenu(){ window.location.href='AD_op_menu.html'; }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

async function apiPost(action, data={}){
  const r = await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action,data})});
  return r.json();
}

let techName = 'А60-ХМ';
let severity  = 'low';

function showTab(name){
  ['new','open','all'].forEach(n=>{
    document.getElementById('screen-'+n).classList.toggle('active',n===name);
    document.getElementById('tab-'+n).classList.toggle('active',n===name);
  });
  if(name==='open') loadIssues('open');
  if(name==='all')  loadIssues('all');
}

function selectTech(el, name){
  document.querySelectorAll('.tech-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  techName = name;
}

function selectSev(sev){
  severity = sev;
  ['low','high','critical'].forEach(s=>{
    document.getElementById('sev-'+s).className='sev-btn'+(s===sev?' sel-'+s:'');
  });
}

function previewPhotos(e){
  const preview=document.getElementById('photo-preview');
  preview.innerHTML='';
  Array.from(e.target.files).forEach(file=>{
    const img=document.createElement('img');
    img.className='preview-img';
    img.src=URL.createObjectURL(file);
    preview.appendChild(img);
  });
}

async function submitIssue(){
  const desc=document.getElementById('issue-desc').value.trim();
  if(!desc){showToast('⚠️ Опишите проблему');return;}
  const trip=getTrip();
  const btn=document.querySelector('.btn-red');
  btn.disabled=true; btn.textContent='⏳ Отправка...';
  try{
    await apiPost('report_issue',{
      techName, severity, desc,
      tripId: trip ? (trip.tripId||trip.id) : '',
      operator: 'Бруй Д.А.'
    });
    document.getElementById('issue-desc').value='';
    document.getElementById('photo-preview').innerHTML='';
    const msg={low:'⚠️ Зафиксировано',high:'🔴 Сообщение отправлено механику',critical:'🆘 Срочно! РП уведомлён'}[severity];
    showToast(msg);
  } catch(e){
    showToast('❌ Ошибка отправки');
  }
  btn.disabled=false; btn.textContent='🔧 Отправить сообщение о проблеме';
}

async function loadIssues(mode){
  const wrap=document.getElementById(mode+'-list');
  wrap.innerHTML='<div class="loading">⏳ Загрузка...</div>';
  try{
    const json=await apiPost('get_issues',{});
    const issues=(json.result?.issues||[]);
    const filtered = mode==='open'
      ? issues.filter(i=>(i.status||'').toLowerCase()==='открыта')
      : issues;
    renderIssues(wrap, filtered, mode);
  } catch(e){
    wrap.innerHTML='<div class="empty"><div class="empty-ico">❌</div><div class="empty-t">Ошибка загрузки</div></div>';
  }
}

const sevIco={low:'⚠️',high:'🔴',critical:'🆘'};

function renderIssues(wrap, issues, mode){
  if(issues.length===0){
    wrap.innerHTML = mode==='open'
      ? '<div class="empty"><div class="empty-ico">✅</div><div class="empty-t">Открытых проблем нет</div><div class="empty-s">Всё работает</div></div>'
      : '<div class="empty"><div class="empty-ico">🔧</div><div class="empty-t">Нет записей</div></div>';
    return;
  }
  wrap.innerHTML = issues.slice().reverse().map(iss=>{
    const status=(iss.status||'открыта').toLowerCase();
    const isOpen=status==='открыта';
    const ico=sevIco[iss.severity]||'⚠️';
    return`<div class="issue-card ${status}">
      <div class="issue-top">
        <div class="issue-title">${ico} ${iss.techName||iss.bak||'—'}</div>
        <span class="badge ${isOpen?'badge-open':'badge-resolved'}">${isOpen?'Открыта':'Решено'}</span>
      </div>
      <div class="issue-meta">${iss.date||''}${iss.tripId?' · '+iss.tripId:''}</div>
      <div style="font-size:13px;color:var(--t2);margin-bottom:${isOpen?'10':'0'}px">${iss.desc||iss.description||'—'}</div>
      ${isOpen?`<button class="resolve-btn" onclick="resolveIssue('${iss.id}',this)">✓ Отметить решено</button>`:''}
    </div>`;
  }).join('');
}

async function resolveIssue(id, btn){
  btn.disabled=true; btn.textContent='⏳...';
  try{
    await apiPost('resolve_issue',{id});
    showToast('✅ Проблема закрыта');
    loadIssues('open');
  } catch(e){
    showToast('❌ Ошибка');
    btn.disabled=false; btn.textContent='✓ Отметить решено';
  }
}

window.addEventListener('DOMContentLoaded',()=>{
  apiPost('get_issues',{}).then(json=>{
    const open=(json.result?.issues||[]).filter(i=>(i.status||'').toLowerCase()==='открыта').length;
    if(open>0) showToast(`⚠️ Открытых проблем: ${open}`);
  }).catch(()=>{});
});
</script>
</body>
</html>
