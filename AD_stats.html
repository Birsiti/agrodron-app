<!DOCTYPE html>
<!--
  AgroDrone.BY · Статистика
  v3.2 · 2026-05-29
  Hero из v2.0, collapse операторы/ТО/командировки
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AgroDrone.BY · Статистика</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f5;--card:#fff;--green:#1b5935;--gm:#2a7a4a;--ga:#3aaa5e;
  --border:#e2e6ef;--t1:#1a1f2e;--t2:#5a6476;--t3:#9aa3b2;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);
  --r:14px;--rs:10px;--f:'Manrope',sans-serif;
  --amber:#d97706;--red:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--t1);max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.sub-hdr{background:var(--card);padding:12px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.back-btn{font-size:24px;cursor:pointer;color:var(--green);line-height:1;padding-right:4px;font-weight:300}
.hdr-title{font-size:16px;font-weight:800;color:var(--t1);flex:1}
.hdr-sub{font-size:11px;color:var(--t3)}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{padding:12px 12px 40px;display:flex;flex-direction:column;gap:10px}

/* HERO — из v2.0 (работающий) */
.hero{background:linear-gradient(135deg,var(--green),var(--gm));border-radius:var(--r);padding:18px;color:#fff}
.hero-title{font-size:10px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero-item .val{font-size:28px;font-weight:900;line-height:1;letter-spacing:-1px}
.hero-item .unit{font-size:11px;font-weight:500;opacity:.55;margin-left:2px}
.hero-item .lbl{font-size:10px;opacity:.5;margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.hero-divider{border:none;border-top:1px solid rgba(255,255,255,.15);margin:12px 0}
.hero-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12px;color:rgba(255,255,255,.6)}
.hero-bottom b{color:#fff}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}

/* BAR ROWS */
.bar-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.bar-row:last-child{border-bottom:none}
.bar-av{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;color:#fff}
.bar-info{flex:1;min-width:0}
.bar-name{font-size:13px;font-weight:700;color:var(--t1)}
.bar-sub{font-size:10px;color:var(--t3);margin-top:2px}
.bar-bg{height:4px;background:#f0f4f8;border-radius:2px;overflow:hidden;margin-top:5px}
.bar-fill{height:100%;border-radius:2px}
.bar-right{text-align:right;flex-shrink:0}
.bar-val{font-size:14px;font-weight:800;color:var(--t1)}

/* РАСХОДЫ */
.exp-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.exp-row:last-child{border-bottom:none}
.exp-info{flex:1;min-width:0}
.exp-name{font-size:13px;color:var(--t2);font-weight:600}
.exp-track{height:3px;background:#f0f4f8;border-radius:2px;margin-top:4px}
.exp-fill{height:100%;border-radius:2px;background:var(--amber)}
.exp-right{text-align:right;flex-shrink:0}
.exp-val{font-size:13px;font-weight:800;color:var(--t1)}
.exp-pct{font-size:10px;color:var(--t3);margin-top:2px}

/* ROWS */
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.rl{font-size:13px;color:var(--t2);flex:1}
.rv{font-size:13px;font-weight:700;color:var(--t1)}
.rv.red{color:var(--red)}.rv.green{color:var(--green)}

/* КОМАНДИРОВКИ */
.trip-item{padding:10px 0;border-bottom:1px solid var(--border)}
.trip-item:last-child{border-bottom:none}
.trip-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.trip-district{font-size:13px;font-weight:800;color:var(--t1)}
.trip-id{font-size:10px;color:var(--t3);margin-top:1px}
.trip-ha{font-size:15px;font-weight:900;color:var(--green)}
.trip-bal{font-size:10px;font-weight:700;text-align:right;margin-top:1px}
.trip-crew{font-size:10px;color:var(--t3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-meta{display:flex;gap:12px;font-size:10px;color:var(--t3);margin-top:3px}

/* ТЕХНИКА */
.ti-open{border-radius:var(--rs);border:1.5px solid #fca5a5;background:#fff7f7;padding:10px 12px;margin-bottom:6px}
.ti-closed{border-radius:var(--rs);background:#f8f9fa;border:1.5px solid var(--border);padding:10px 12px;margin-bottom:6px}
.ti-open:last-child,.ti-closed:last-child{margin-bottom:0}
.ti-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ti-badge-open{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;background:#fee2e2;color:var(--red);flex-shrink:0}
.ti-badge-done{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;background:#f0f4f8;color:var(--t3);flex-shrink:0}
.ti-bak{font-size:12px;font-weight:800;color:var(--t1)}
.ti-type{font-size:11px;color:var(--t2);font-weight:600;margin-left:auto}
.ti-desc{font-size:12px;color:var(--t2);line-height:1.4}
.ti-meta{display:flex;gap:10px;margin-top:4px;font-size:10px;color:var(--t3)}

/* COLLAPSE */
.collapse-btn{width:100%;padding:9px;border:1.5px dashed var(--border);border-radius:var(--rs);background:transparent;color:var(--t3);font-size:12px;font-weight:700;font-family:var(--f);cursor:pointer;margin-top:8px}
.collapse-btn:active{background:#f8f9fa}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10px;color:var(--t3);font-size:13px;font-weight:600}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--ga);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:20px;color:var(--t3);font-size:13px}
</style>
</head>
<body>

<div class="sub-hdr">
  <div class="back-btn" onclick="goBack()">‹</div>
  <div class="hdr-title">Статистика сезона</div>
  <div class="hdr-sub" id="upd-time"></div>
</div>

<div id="loading" class="loading">
  <div class="spinner"></div>
  Загружаю данные...
</div>

<div class="scroll" id="content" style="display:none">
<div class="wrap" id="root"></div>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
function goBack(){window.history.back();}

const OP_COLORS=['#3aaa5e','#2563eb','#d97706','#8b5cf6','#dc2626','#0891b2','#059669'];
const OP_NAMES={
  'Бруй Д.А.':'БД','Грибов К.М.':'ГК','Борисенок Л.И.':'БЛ',
  'Уманец А.И.':'УА','Бич Иван':'БИ','Ленский Александр':'ЛА','Василевски А.В.':'ВА'
};

function fmt(n,d=0){
  const v=Number(n||0);
  return isNaN(v)?'0':v.toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}

function fmtD(v){
  if(!v)return'—';
  if(typeof v==='number'){
    const d=new Date(Math.round((v-25569)*86400*1000));
    return String(d.getDate()).padStart(2,'0')+'.'+(String(d.getMonth()+1)).padStart(2,'0')+'.'+String(d.getFullYear()).slice(2);
  }
  const s=String(v).trim();
  const gm=s.match(/Date\((\d+),(\d+),(\d+)\)/);
  if(gm)return String(parseInt(gm[3])).padStart(2,'0')+'.'+String(parseInt(gm[2])+1).padStart(2,'0')+'.'+String(gm[1]).slice(2);
  const m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  if(m)return m[1]+'.'+m[2]+'.'+m[3].slice(2);
  return s;
}

async function loadSheet(sheet){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheet)}`;
  const res=await fetch(url);
  const txt=await res.text();
  const json=JSON.parse(txt.replace(/^[^(]+\(/,'').replace(/\);?$/,''));
  const rows=json.table.rows.map(r=>r.c.map(c=>c?.v??''));
  return{rows};
}

async function init(){
  try{
    const [obr,trips,expenses,ti]=await Promise.all([
      loadSheet('ОБРАБОТКИ'),
      loadSheet('КОМАНДИРОВКИ'),
      loadSheet('РАСХОДЫ'),
      loadSheet('ТЕХНИЧЕСКОЕ ОБСЛУЖИВАНИЕ')
    ]);

    // ── ОБРАБОТКИ ─────────────────────────────────────────
    let totalHa=0,obrCount=0,minHa=Infinity,maxHa=0;
    const opHa={};
    const regionObr={}; // га по районам ТОЛЬКО из обработок

    obr.rows.filter(r=>r[0]).forEach(r=>{
      const ha=parseFloat(r[7])||0;
      const ops=String(r[9]||'').trim();
      const region=String(r[3]||'').trim(); // НП из обработок
      totalHa+=ha; obrCount++;
      if(ha>0&&ha<minHa)minHa=ha;
      if(ha>maxHa)maxHa=ha;
      const tripRegion=String(r[15]||'').trim();
      const key=tripRegion||region;
      if(key)regionObr[key]=(regionObr[key]||0)+ha;
      if(ops){
        const list=ops.split(/[,;]+/).map(s=>s.trim()).filter(Boolean);
        list.forEach(op=>{opHa[op]=(opHa[op]||0)+ha/list.length;});
      }
    });
    if(minHa===Infinity)minHa=0;
    const avgHa=obrCount>0?totalHa/obrCount:0;

    // ── КОМАНДИРОВКИ ──────────────────────────────────────
    let tripCount=0,totalSpent=0,fieldDays=0;
    const regionTrips={}; // га по районам из командировок
    const closedTrips=[];

    trips.rows.filter(r=>r[0]).forEach(r=>{
      const status=String(r[10]||'');
      const district=String(r[3]||'').trim();
      const ha=parseFloat(r[9])||0;
      // районы берём из КОМАНДИРОВОК
      if(district)regionTrips[district]=(regionTrips[district]||0)+ha;
      if(status.includes('закрыта')){
        tripCount++;
        totalSpent+=parseFloat(r[7])||0;
        closedTrips.push(r);
        // дни в поле
        try{
          const parseD=v=>{
            if(!v)return null;
            const gm=String(v).match(/Date\((\d+),(\d+),(\d+)\)/);
            if(gm)return new Date(+gm[1],+gm[2],+gm[3]);
            const m=String(v).match(/(\d{2})\.(\d{2})\.(\d{4})/);
            if(m)return new Date(+m[3],+m[2]-1,+m[1]);
            return null;
          };
          const ds=parseD(r[1]),de=parseD(r[2]);
          if(ds&&de)fieldDays+=Math.max(1,Math.round((de-ds)/86400000)+1);
          else fieldDays+=1;
        }catch(e){fieldDays+=1;}
      }
    });

    // ── РАСХОДЫ ───────────────────────────────────────────
    const catTotals={};
    let totalExpenses=0;
    expenses.rows.filter(r=>r[0]).forEach(r=>{
      const cat=String(r[5]||'').replace(/[🍽⛽🏨🪣🔧📦🚐🔌]/g,'').trim();
      const sum=parseFloat(r[6])||0;
      totalExpenses+=sum;
      if(cat)catTotals[cat]=(catTotals[cat]||0)+sum;
    });
    const topCats=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);

    // ── ТЕХНИКА ───────────────────────────────────────────
    const tiAll=ti.rows.filter(r=>r[0]).map(r=>({
      bak:String(r[1]||''),date:r[2],type:String(r[3]||''),
      desc:String(r[4]||''),op:String(r[5]||''),
      status:String(r[7]||'').toLowerCase(),closedAt:r[8]
    }));
    const tiOpen=tiAll.filter(t=>t.status.includes('откр'));
    const tiClosed=tiAll.filter(t=>!t.status.includes('откр'));

    const topOps=Object.entries(opHa).sort((a,b)=>b[1]-a[1]);
    // Топ районов — из КОМАНДИРОВОК (район), га = га из обработок по этому НП
    // Но район командировки != НП обработки → берём сумму га по район из командировок
    const topRegions=Object.entries(regionTrips).sort((a,b)=>b[1]-a[1]);
    // Однако га командировки = суммарные га за выезд
    // Чтобы показать реальные обработанные га по районам — берём regionObr (из ОБРАБОТОК, поле НП)
    // НП "Шашки" и "Мальковичи" — это внутри района "Ганцевичи"
    // Поэтому районы = из КОМАНДИРОВОК, а га = сумма га закрытых командировок по этому району
    render({totalHa,obrCount,avgHa,minHa,maxHa,tripCount,fieldDays,totalSpent,totalExpenses,
  topOps,topRegions:Object.entries(regionObr).filter(([k])=>k).sort((a,b)=>b[1]-a[1]),topCats,
      closedTrips:[...closedTrips].reverse(),tiOpen,tiClosed});

    document.getElementById('upd-time').textContent=
      new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});

  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML=
      `<div style="color:var(--red);font-size:13px;text-align:center">❌ Ошибка<br><span style="font-size:11px;color:var(--t3)">${e.message}</span></div>`;
  }
}

// ── collapse: операторы ───────────────────────────────────
let _topOps=[],opsAll=false;
function renderOps(list,all){
  const max=list[0]?.[1]||1;
  const vis=all?list:list.slice(0,3);
  document.getElementById('ops-list').innerHTML=vis.map(([op,ha],i)=>{
    const idx=list.findIndex(x=>x[0]===op);
    const color=OP_COLORS[idx%OP_COLORS.length];
    const ini=OP_NAMES[op]||(op.split(/[\s.]+/).map(s=>s[0]).join('').slice(0,2).toUpperCase());
    const pct=Math.round(ha/max*100);
    return`<div class="bar-row">
      <div class="bar-av" style="background:${color}">${ini}</div>
      <div class="bar-info">
        <div class="bar-name">${op}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      </div>
      <div class="bar-right"><div class="bar-val">${fmt(ha,1)} га</div></div>
    </div>`;
  }).join('');
  document.getElementById('ops-btn').innerHTML=list.length>3
    ?`<button class="collapse-btn" onclick="toggleOps()">${all?'▲ Свернуть':'▼ Показать всех ('+list.length+')'}</button>`:'';
}
function toggleOps(){opsAll=!opsAll;renderOps(_topOps,opsAll);}

// ── collapse: командировки ────────────────────────────────
let _trips=[],tripsAll=false;
function renderTrips(list,all){
  const vis=all?list:list.slice(0,3);
  document.getElementById('trips-list').innerHTML=vis.map(r=>{
    const district=String(r[3]||'—');
    const id=String(r[0]);
    const ha=parseFloat(r[9])||0;
    const spent=parseFloat(r[7])||0;
    const advance=parseFloat(r[6])||0;
    const rent=parseFloat(r[15])||0;
    const beznal=parseFloat(r[14])||0;
    const totalSpent=spent+beznal+rent;
    const balance=advance-totalSpent;
    const crew=String(r[4]||'').trim();
    return`<div class="trip-item">
      <div class="trip-top">
        <div>
          <div class="trip-district">${district}</div>
          <div class="trip-id">${id} · ${fmtD(r[1])}→${fmtD(r[2])}</div>
        </div>
        <div style="text-align:right">
          <div class="trip-ha">${fmt(ha,1)} га</div>
          <div class="trip-bal" style="color:var(--t2);font-size:11px">расходы: ${fmt(totalSpent)} BYN</div>
        </div>
      </div>
      ${crew?`<div class="trip-crew">👥 ${crew}</div>`:''}
      <div class="trip-meta"><span>💰 ${fmt(advance)}</span><span>💵 ${fmt(spent)} BYN</span>${beznal>0?`<span>💳 ${fmt(beznal)} BYN</span>`:''} ${rent>0?`<span>🚐 ${fmt(rent)} BYN</span>`:''}</div>
    </div>`;
  }).join('');
  document.getElementById('trips-btn').innerHTML=list.length>3
    ?`<button class="collapse-btn" onclick="toggleTrips()">${all?'▲ Свернуть':'▼ Показать все ('+list.length+')'}</button>`:'';
}
function toggleTrips(){tripsAll=!tripsAll;renderTrips(_trips,tripsAll);}

// ── collapse: техника закрытые ────────────────────────────
let _tiClosed=[],tiAll2=false;
function renderTiClosed(list,all){
  const vis=all?list:list.slice(0,3);
  document.getElementById('ti-closed').innerHTML=vis.map(t=>`
    <div class="ti-closed">
      <div class="ti-top">
        <span class="ti-badge-done">✓ Закрыто</span>
        <span class="ti-bak">${t.bak}</span>
        <span class="ti-type">${t.type}</span>
      </div>
      <div class="ti-desc">${t.desc}</div>
      <div class="ti-meta"><span>📅 ${fmtD(t.date)}</span>${t.closedAt?`<span>→ ${fmtD(t.closedAt)}</span>`:''}</div>
    </div>`).join('');
  document.getElementById('ti-btn').innerHTML=list.length>3
    ?`<button class="collapse-btn" onclick="toggleTi()">${all?'▲ Свернуть':'▼ Показать все ('+list.length+')'}</button>`:'';
}
function toggleTi(){tiAll2=!tiAll2;renderTiClosed(_tiClosed,tiAll2);}

function render(d){
  _topOps=d.topOps;
  _trips=d.closedTrips;
  _tiClosed=d.tiClosed;

  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='flex';

  const maxReg=d.topRegions[0]?.[1]||1;
  const maxCat=d.topCats[0]?.[1]||1;

  document.getElementById('root').innerHTML=`

    <!-- HERO — v2.0 стиль, работающий -->
    <div class="hero">
      <div class="hero-title">Сезон 2026 — итого</div>
      <div class="hero-grid">
        <div class="hero-item">
          <div class="val">${fmt(d.totalHa,1)}<span class="unit">га</span></div>
          <div class="lbl">Обработано</div>
        </div>
        <div class="hero-item">
          <div class="val">${d.obrCount}<span class="unit">шт</span></div>
          <div class="lbl">Полей</div>
        </div>
        <div class="hero-item">
          <div class="val">${d.tripCount}<span class="unit">вып</span></div>
          <div class="lbl">Командировок</div>
        </div>
      </div>
      <hr class="hero-divider">
      <div class="hero-bottom">
        <span>Дней в поле: <b>${d.fieldDays}</b></span>
        <span>Мин: <b>${fmt(d.minHa,1)} га</b></span>
        <span>Макс: <b>${fmt(d.maxHa,1)} га</b></span>
      </div>
    </div>

    <!-- КНОПКА КАРТЫ -->
    <div onclick="window.location.href='AD_map_all.html'" style="background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);display:flex;align-items:center;gap:12px;cursor:pointer;active:opacity:.8">
      <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--gm));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">🗺</div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:800;color:var(--t1)">Все поля на карте</div>
        <div style="font-size:12px;color:var(--t3);margin-top:2px">Все клиенты · спутник · фильтр по статусу</div>
      </div>
      <div style="font-size:20px;color:var(--t3)">›</div>
    </div>
    
    <!-- ОПЕРАТОРЫ -->
    <div class="card">
      <div class="card-title">👥 Га по операторам</div>
      <div id="ops-list"></div>
      <div id="ops-btn"></div>
    </div>    <!-- РАЙОНЫ — га из КОМАНДИРОВОК -->
    <div class="card">
      <div class="card-title">📍 Топ районов</div>
      ${d.topRegions.length?d.topRegions.map(([reg,ha],i)=>{
        const pct=Math.round(ha/maxReg*100);
        return`<div class="bar-row">
          <div class="bar-av" style="background:var(--green);font-size:13px;font-weight:900">${i+1}</div>
          <div class="bar-info">
            <div class="bar-name">${reg}</div>
            <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:var(--ga)"></div></div>
          </div>
          <div class="bar-right"><div class="bar-val">${fmt(ha,1)} га</div></div>
        </div>`;
      }).join(''):`<div class="empty">Нет данных</div>`}
    </div>

    <!-- РАСХОДЫ -->
    <div class="card">
      <div class="card-title">💸 Расходы по категориям</div>
      ${d.topCats.length?d.topCats.map(([cat,sum])=>{
        const pct=Math.round(sum/maxCat*100);
        const pctT=d.totalExpenses>0?Math.round(sum/d.totalExpenses*100):0;
        return`<div class="exp-row">
          <div class="exp-info">
            <div class="exp-name">${cat||'Прочее'}</div>
            <div class="exp-track"><div class="exp-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="exp-right">
            <div class="exp-val">${fmt(sum)} BYN</div>
            <div class="exp-pct">${pctT}%</div>
          </div>
        </div>`;
      }).join(''):`<div class="empty">Нет данных</div>`}
      <div class="row" style="border-top:2px solid var(--border);margin-top:6px;padding-top:8px">
        <span class="rl" style="font-weight:700">Итого расходов</span>
        <span class="rv red">${fmt(d.totalExpenses)} BYN</span>
      </div>
    </div>

    <!-- ТЕХНИКА -->
    <div class="card">
      <div class="card-title">
        🔧 Техобслуживание
        <span style="font-size:11px;font-weight:700;color:${d.tiOpen.length?'var(--red)':'var(--t3)'}">${d.tiOpen.length?d.tiOpen.length+' открытых':'все закрыты'}</span>
      </div>
      ${d.tiOpen.length?d.tiOpen.map(t=>`
        <div class="ti-open">
          <div class="ti-top">
            <span class="ti-badge-open">⚠️ Открыто</span>
            <span class="ti-bak">${t.bak}</span>
            <span class="ti-type">${t.type}</span>
          </div>
          <div class="ti-desc">${t.desc}</div>
          <div class="ti-meta"><span>📅 ${fmtD(t.date)}</span>${t.op?`<span>👤 ${t.op}</span>`:''}</div>
        </div>`).join(''):''}
      ${d.tiClosed.length?`
        <div style="font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin:${d.tiOpen.length?'10px':0} 0 8px">Закрытые</div>
        <div id="ti-closed"></div>
        <div id="ti-btn"></div>
      `:''}
      ${!d.tiOpen.length&&!d.tiClosed.length?`<div class="empty">Нет записей</div>`:''}
    </div>

    <!-- КОМАНДИРОВКИ -->
    <div class="card">
      <div class="card-title">🚐 История командировок</div>
      <div id="trips-list"></div>
      <div id="trips-btn"></div>
    </div>

  `;

  renderOps(d.topOps,false);
  renderTrips(d.closedTrips,false);
  if(d.tiClosed.length)renderTiClosed(d.tiClosed,false);
}

init();
</script>
</body>
</html>
