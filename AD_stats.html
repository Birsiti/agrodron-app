<!DOCTYPE html>
<!--
  AgroDrone.BY · Статистика
  v3.1 · 2026-05-28
  Данные: ОБРАБОТКИ, КОМАНДИРОВКИ, РАСХОДЫ, ТЕХНИЧЕСКОЕ ОБСЛУЖИВАНИЕ
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AgroDrone.BY · Статистика</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f5;--card:#fff;--green:#1b5935;--gm:#2a7a4a;--ga:#3aaa5e;
  --border:#e2e6ef;--t1:#1a1f2e;--t2:#5a6476;--t3:#9aa3b2;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);
  --r:14px;--rs:10px;--f:'Manrope',sans-serif;
  --amber:#d97706;--red:#dc2626;--blue:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--t1);max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.sub-hdr{background:var(--card);padding:12px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.back-btn{font-size:24px;cursor:pointer;color:var(--green);line-height:1;padding-right:4px;font-weight:300}
.hdr-title{font-size:16px;font-weight:800;color:var(--t1);flex:1}
.hdr-sub{font-size:11px;color:var(--t3)}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{padding:12px 12px 40px;display:flex;flex-direction:column;gap:10px}

/* HERO */
.hero{background:linear-gradient(145deg,#1b5935 0%,#1e6b3f 55%,#2a7a4a 100%);border-radius:var(--r);padding:18px 18px 16px;color:#fff;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;right:-30px;bottom:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none}
.hero::after{content:'';position:absolute;right:30px;top:-40px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none}
.hero-label{font-size:10px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}

/* Большая цифра */
.hero-main{margin-bottom:14px}
.hero-main-val{font-size:52px;font-weight:900;line-height:1;letter-spacing:-2px;color:#fff}
.hero-main-unit{font-size:16px;font-weight:600;opacity:.6;margin-left:4px}
.hero-main-lbl{font-size:11px;color:rgba(255,255,255,.5);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

/* Сетка доп метрик */
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.hero-cell{background:rgba(255,255,255,.09);border-radius:10px;padding:10px 10px 8px}
.hero-cell-val{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.5px;line-height:1}
.hero-cell-unit{font-size:10px;opacity:.55;margin-left:2px}
.hero-cell-lbl{font-size:9px;color:rgba(255,255,255,.45);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}

/* Мин/макс */
.hero-divider{border:none;border-top:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.hero-minmax{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero-mm-item{background:rgba(255,255,255,.09);border-radius:10px;padding:10px 12px}
.hero-mm-val{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.5px}
.hero-mm-unit{font-size:10px;opacity:.55;margin-left:2px}
.hero-mm-lbl{font-size:9px;color:rgba(255,255,255,.45);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}

/* METRICS GRID */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--card);border-radius:var(--rs);padding:14px;box-shadow:var(--sh)}
.metric-ico{font-size:20px;margin-bottom:6px}
.metric-val{font-size:22px;font-weight:900;color:var(--t1);letter-spacing:-1px;line-height:1}
.metric-val span{font-size:11px;font-weight:500;color:var(--t3);margin-left:2px}
.metric-lbl{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}

/* BAR ROWS */
.bar-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.bar-row:last-child{border-bottom:none}
.bar-av{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;color:#fff;letter-spacing:-.3px}
.bar-info{flex:1;min-width:0}
.bar-name{font-size:13px;font-weight:700;color:var(--t1)}
.bar-sub{font-size:10px;color:var(--t3);margin-top:2px}
.bar-track{height:4px;background:#f0f4f8;border-radius:2px;overflow:hidden;margin-top:5px}
.bar-fill{height:100%;border-radius:2px;transition:width .5s ease}
.bar-right{text-align:right;flex-shrink:0}
.bar-val{font-size:14px;font-weight:800;color:var(--t1)}
.bar-val2{font-size:10px;color:var(--t3);margin-top:2px}

/* РАСХОДЫ */
.exp-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.exp-row:last-child{border-bottom:none}
.exp-info{flex:1;min-width:0}
.exp-name{font-size:13px;color:var(--t2);font-weight:600}
.exp-track{height:3px;background:#f0f4f8;border-radius:2px;margin-top:4px}
.exp-fill{height:100%;border-radius:2px;background:var(--amber)}
.exp-right{text-align:right;flex-shrink:0}
.exp-val{font-size:13px;font-weight:800;color:var(--t1)}
.exp-pct{font-size:10px;color:var(--t3);margin-top:2px}

/* ROWS */
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.rl{font-size:13px;color:var(--t2);flex:1}
.rv{font-size:13px;font-weight:700;color:var(--t1)}
.rv.red{color:var(--red)}.rv.green{color:var(--green)}

/* КОМАНДИРОВКИ */
.trip-item{padding:11px 0;border-bottom:1px solid var(--border)}
.trip-item:last-child{border-bottom:none}
.trip-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.trip-district{font-size:13px;font-weight:800;color:var(--t1)}
.trip-id{font-size:10px;color:var(--t3);margin-top:1px}
.trip-ha{font-size:15px;font-weight:900;color:var(--green)}
.trip-bal{font-size:10px;font-weight:700;text-align:right;margin-top:1px}
.trip-crew{font-size:10px;color:var(--t3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-meta{display:flex;gap:12px;font-size:10px;color:var(--t3);margin-top:3px}

/* ТЕХНИКА */
.ti-open{border-radius:var(--rs);border:1.5px solid #fca5a5;background:#fff7f7;padding:10px 12px;margin-bottom:6px}
.ti-closed{border-radius:var(--rs);background:#f8f9fa;border:1.5px solid var(--border);padding:10px 12px;margin-bottom:6px}
.ti-open:last-child,.ti-closed:last-child{margin-bottom:0}
.ti-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ti-badge-open{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;background:#fee2e2;color:var(--red);flex-shrink:0}
.ti-badge-done{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;background:#f0f4f8;color:var(--t3);flex-shrink:0}
.ti-bak{font-size:12px;font-weight:800;color:var(--t1)}
.ti-type{font-size:11px;color:var(--t2);font-weight:600;margin-left:auto}
.ti-desc{font-size:12px;color:var(--t2);line-height:1.4}
.ti-meta{display:flex;gap:10px;margin-top:4px;font-size:10px;color:var(--t3)}

/* COLLAPSE */
.collapse-btn{width:100%;padding:9px;border:1.5px dashed var(--border);border-radius:var(--rs);background:transparent;color:var(--t3);font-size:12px;font-weight:700;font-family:var(--f);cursor:pointer;margin-top:8px;transition:all .2s}
.collapse-btn:active{background:#f8f9fa}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10px;color:var(--t3);font-size:13px;font-weight:600}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--ga);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:20px;color:var(--t3);font-size:13px}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card,.hero,.metrics{animation:fadeIn .3s ease both}
.card:nth-child(2){animation-delay:.04s}
.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.12s}
</style>
</head>
<body>

<div class="sub-hdr">
  <div class="back-btn" onclick="goBack()">‹</div>
  <div class="hdr-title">Статистика сезона</div>
  <div class="hdr-sub" id="upd-time"></div>
</div>

<div id="loading" class="loading">
  <div class="spinner"></div>
  Загружаю данные...
</div>

<div class="scroll" id="content" style="display:none">
<div class="wrap" id="root"></div>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
function goBack(){window.history.back();}

const OP_COLORS=['#3aaa5e','#2563eb','#d97706','#8b5cf6','#dc2626','#0891b2','#059669'];
const OP_INITIALS={
  'Бруй Д.А.':'БД','Грибов К.М.':'ГК','Борисенок Л.И.':'БЛ',
  'Уманец А.И.':'УА','Бич Иван':'БИ','Ленский Александр':'ЛА','Василевски А.В.':'ВА'
};

function fmt(n,d=0){
  const v=Number(n||0);
  return isNaN(v)?'0':v.toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}

function fmtD(v){
  if(!v&&v!==0)return'—';
  if(typeof v==='number'){
    const d=new Date(Math.round((v-25569)*86400*1000));
    if(isNaN(d.getTime()))return'—';
    return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getFullYear()).slice(2);
  }
  const s=String(v).trim();
  const gm=s.match(/Date\((\d+),(\d+),(\d+)\)/);
  if(gm)return String(parseInt(gm[3])).padStart(2,'0')+'.'+String(parseInt(gm[2])+1).padStart(2,'0')+'.'+String(gm[1]).slice(2);
  const m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  if(m)return m[1]+'.'+m[2]+'.'+m[3].slice(2);
  const m2=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m2)return m2[3]+'.'+m2[2]+'.'+m2[1].slice(2);
  return s;
}

function parseDate(v){
  if(!v&&v!==0)return null;
  if(typeof v==='number'){
    const d=new Date(Math.round((v-25569)*86400*1000));
    return isNaN(d.getTime())?null:d;
  }
  const s=String(v).trim();
  const gm=s.match(/Date\((\d+),(\d+),(\d+)\)/);
  if(gm)return new Date(parseInt(gm[1]),parseInt(gm[2]),parseInt(gm[3]));
  const m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  if(m)return new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
  const m2=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m2)return new Date(parseInt(m2[1]),parseInt(m2[2])-1,parseInt(m2[3]));
  return null;
}

async function loadSheet(sheet){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheet)}`;
  const res=await fetch(url);
  const txt=await res.text();
  const json=JSON.parse(txt.replace(/^[^(]+\(/,'').replace(/\);?$/,''));
  const headers=json.table.cols.map(c=>c.label||'');
  const rows=json.table.rows.map(r=>r.c.map(c=>(!c||c.v===null||c.v===undefined)?'':c.v));
  return{headers,rows};
}

async function init(){
  try{
    const [obr,trips,expenses,ti]=await Promise.all([
      loadSheet('ОБРАБОТКИ'),
      loadSheet('КОМАНДИРОВКИ'),
      loadSheet('РАСХОДЫ'),
      loadSheet('ТЕХНИЧЕСКОЕ ОБСЛУЖИВАНИЕ')
    ]);

    // ── ОБРАБОТКИ ─────────────────────────────────────────
    // A=ID B=Дата C=ID_заявки D=НП E=Культура F=Препарат G=Норма H=Га факт I=Борт J=Операторы
    let totalHa=0, obrCount=0, minHa=Infinity, maxHa=0;
    const opHa={}, droneHa={};

    obr.rows.filter(r=>r[0]).forEach(r=>{
      const ha=parseFloat(r[7])||0;
      const ops=String(r[9]||'').trim();
      const drone=String(r[8]||'').trim();
      totalHa+=ha; obrCount++;
      if(ha>0&&ha<minHa) minHa=ha;
      if(ha>maxHa) maxHa=ha;
      if(ops){
        const list=ops.split(/[,;]+/).map(s=>s.trim()).filter(Boolean);
        list.forEach(op=>{opHa[op]=(opHa[op]||0)+ha/list.length;});
      }
      if(drone){
        drone.split(/[,]+/).map(s=>s.trim()).filter(Boolean).forEach(d=>{
          droneHa[d]=(droneHa[d]||0)+ha;
        });
      }
    });
    if(minHa===Infinity)minHa=0;

    // ── КОМАНДИРОВКИ ──────────────────────────────────────
    // A=ID B=Дата откр C=Дата закр D=Район E=Состав F=Техника
    // G=Аванс H=Потрачено I=Остаток J=Га K=Статус
    // N(13)=Нал O(14)=Безнал P(15)=Аренда Q(16)=Перенос
    let tripCount=0,totalSpent=0,totalNal=0,totalBeznal=0,totalRent=0,totalCarry=0,fieldDays=0;
    const regionHa={};
    const closedTrips=[];

    trips.rows.filter(r=>r[0]).forEach(r=>{
      const status=String(r[10]||'');
      const district=String(r[3]||'').trim();
      const ha=parseFloat(r[9])||0;
      if(district)regionHa[district]=(regionHa[district]||0)+ha;
      if(status.includes('закрыта')){
        tripCount++;
        totalSpent+=parseFloat(r[7])||0;
        totalNal+=parseFloat(r[13])||0;
        totalBeznal+=parseFloat(r[14])||0;
        totalRent+=parseFloat(r[15])||0;
        totalCarry+=parseFloat(r[16])||0;
        closedTrips.push(r);
        // дни в поле
        const ds=parseDate(r[1]),de=parseDate(r[2]);
        if(ds&&de){
          const diff=Math.round((de-ds)/(86400*1000));
          fieldDays+=Math.max(1,diff+1);
        } else fieldDays+=1;
      }
    });

    // ── РАСХОДЫ ───────────────────────────────────────────
    const catTotals={};
    let totalExpenses=0;
    expenses.rows.filter(r=>r[0]).forEach(r=>{
      const cat=String(r[5]||'').replace(/[\u{1F000}-\u{1FFFF}]/gu,'').replace(/[🍽⛽🏨🪣🔧📦🚐🔌]/g,'').trim();
      const sum=parseFloat(r[6])||0;
      totalExpenses+=sum;
      if(cat)catTotals[cat]=(catTotals[cat]||0)+sum;
    });
    const topCats=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);

    // ── ТО ────────────────────────────────────────────────
    const tiAll=ti.rows.filter(r=>r[0]).map(r=>({
      id:String(r[0]),bak:String(r[1]||''),date:r[2],
      type:String(r[3]||''),desc:String(r[4]||''),
      op:String(r[5]||''),urgency:String(r[6]||''),
      status:String(r[7]||'').toLowerCase(),closedAt:r[8]
    }));
    const tiOpen=tiAll.filter(t=>t.status.includes('откр'));
    const tiClosed=tiAll.filter(t=>!t.status.includes('откр'));

    const topOps=Object.entries(opHa).sort((a,b)=>b[1]-a[1]);
    const topDrones=Object.entries(droneHa).sort((a,b)=>b[1]-a[1]);
    const topRegions=Object.entries(regionHa).sort((a,b)=>b[1]-a[1]);
    const haPerDay=fieldDays>0?totalHa/fieldDays:0;

    render({totalHa,obrCount,minHa,maxHa,tripCount,fieldDays,haPerDay,
      totalSpent,totalNal,totalBeznal,totalRent,totalCarry,totalExpenses,
      topOps,topDrones,topRegions,topCats,closedTrips,tiOpen,tiClosed});

    document.getElementById('upd-time').textContent=
      new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});

  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML=
      `<div style="color:var(--red);font-size:13px;text-align:center">❌ Ошибка<br><span style="font-size:11px;color:var(--t3)">${e.message}</span></div>`;
  }
}

// ── Операторы (collapse) ──────────────────────────────────
let _topOps=[], opsShowAll=false;
function renderOps(topOps,showAll){
  const maxOp=topOps[0]?.[1]||1;
  const visible=showAll?topOps:topOps.slice(0,3);
  document.getElementById('ops-list').innerHTML=visible.map(([op,ha])=>{
    const idx=topOps.findIndex(x=>x[0]===op);
    const color=OP_COLORS[idx%OP_COLORS.length];
    const initials=OP_INITIALS[op]||(op.split(/[\s.]+/).map(s=>s[0]).join('').slice(0,2).toUpperCase());
    const pct=Math.round(ha/maxOp*100);
    return`<div class="bar-row">
      <div class="bar-av" style="background:${color}">${initials}</div>
      <div class="bar-info">
        <div class="bar-name">${op}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      </div>
      <div class="bar-right"><div class="bar-val">${fmt(ha,1)} га</div></div>
    </div>`;
  }).join('');
  document.getElementById('ops-btn-wrap').innerHTML=topOps.length>3
    ?`<button class="collapse-btn" onclick="toggleOps()">${showAll?'▲ Свернуть':'▼ Показать всех ('+topOps.length+')'}</button>`:'';
}
function toggleOps(){opsShowAll=!opsShowAll;renderOps(_topOps,opsShowAll);}

// ── Командировки (collapse) ───────────────────────────────
let _closedTrips=[], tripsShowAll=false;
function renderTrips(trips,showAll){
  const visible=showAll?trips:trips.slice(0,3);
  document.getElementById('trips-list').innerHTML=visible.map(r=>{
    const district=String(r[3]||'—');
    const id=String(r[0]);
    const ds=fmtD(r[1]),de=fmtD(r[2]);
    const ha=parseFloat(r[9])||0;
    const spent=parseFloat(r[7])||0;
    const advance=parseFloat(r[6])||0;
    const balance=advance-spent;
    const crew=String(r[4]||'').trim();
    return`<div class="trip-item">
      <div class="trip-top">
        <div>
          <div class="trip-district">${district}</div>
          <div class="trip-id">${id} · ${ds}→${de}</div>
        </div>
        <div style="text-align:right">
          <div class="trip-ha">${fmt(ha,1)} га</div>
          <div class="trip-bal" style="color:${balance>=0?'var(--green)':'var(--red)'}">${balance>=0?'+':''}${fmt(balance)} BYN</div>
        </div>
      </div>
      ${crew?`<div class="trip-crew">👥 ${crew}</div>`:''}
      <div class="trip-meta">
        <span>💰 ${fmt(advance)}</span>
        <span>💸 ${fmt(spent)} BYN</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('trips-btn-wrap').innerHTML=trips.length>3
    ?`<button class="collapse-btn" onclick="toggleTrips()">${showAll?'▲ Свернуть':'▼ Показать все ('+trips.length+')'}</button>`:'';
}
function toggleTrips(){tripsShowAll=!tripsShowAll;renderTrips(_closedTrips,tripsShowAll);}

// ── Техника (collapse) ────────────────────────────────────
let _tiClosed=[], tiShowAll=false;
function renderTiClosed(list,showAll){
  const visible=showAll?list:list.slice(0,3);
  document.getElementById('ti-closed-list').innerHTML=visible.map(t=>`
    <div class="ti-closed">
      <div class="ti-top">
        <span class="ti-badge-done">✓ Закрыто</span>
        <span class="ti-bak">${t.bak}</span>
        <span class="ti-type">${t.type}</span>
      </div>
      <div class="ti-desc">${t.desc}</div>
      <div class="ti-meta">
        <span>📅 ${fmtD(t.date)}</span>
        ${t.closedAt?`<span>→ ${fmtD(t.closedAt)}</span>`:''}
      </div>
    </div>`).join('');
  document.getElementById('ti-btn-wrap').innerHTML=list.length>3
    ?`<button class="collapse-btn" onclick="toggleTi()">${showAll?'▲ Свернуть':'▼ Показать все ('+list.length+')'}</button>`:'';
}
function toggleTi(){tiShowAll=!tiShowAll;renderTiClosed(_tiClosed,tiShowAll);}

function render(d){
  _topOps=d.topOps;
  _closedTrips=[...d.closedTrips].reverse();
  _tiClosed=d.tiClosed;

  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='flex';

  const maxDrone=d.topDrones[0]?.[1]||1;
  const maxReg=d.topRegions[0]?.[1]||1;
  const maxCat=d.topCats[0]?.[1]||1;

  document.getElementById('root').innerHTML=`

    <!-- HERO -->
    <div class="hero">
      <div class="hero-label">Сезон 2026</div>

      <div class="hero-main">
        <div><span class="hero-main-val">${fmt(d.totalHa,1)}</span><span class="hero-main-unit">га</span></div>
        <div class="hero-main-lbl">Обработано всего</div>
      </div>

      <div class="hero-grid">
        <div class="hero-cell">
          <div class="hero-cell-val">${d.obrCount}<span class="hero-cell-unit">шт</span></div>
          <div class="hero-cell-lbl">Полей</div>
        </div>
        <div class="hero-cell">
          <div class="hero-cell-val">${d.tripCount}<span class="hero-cell-unit">вып</span></div>
          <div class="hero-cell-lbl">Командировок</div>
        </div>
        <div class="hero-cell">
          <div class="hero-cell-val">${d.fieldDays}<span class="hero-cell-unit">дн</span></div>
          <div class="hero-cell-lbl">В поле</div>
        </div>
      </div>

      <hr class="hero-divider">

      <div class="hero-minmax">
        <div class="hero-mm-item">
          <div><span class="hero-mm-val">${fmt(d.minHa,1)}</span><span class="hero-mm-unit">га</span></div>
          <div class="hero-mm-lbl">Мин. поле</div>
        </div>
        <div class="hero-mm-item">
          <div><span class="hero-mm-val">${fmt(d.maxHa,1)}</span><span class="hero-mm-unit">га</span></div>
          <div class="hero-mm-lbl">Макс. поле</div>
        </div>
      </div>
    </div>

    <!-- ФИНАНСЫ -->
    <div class="metrics">
      <div class="metric">
        <div class="metric-ico">💵</div>
        <div class="metric-val">${fmt(d.totalNal)}<span>BYN</span></div>
        <div class="metric-lbl">Нал расходы</div>
      </div>
      <div class="metric">
        <div class="metric-ico">💳</div>
        <div class="metric-val">${fmt(d.totalBeznal)}<span>BYN</span></div>
        <div class="metric-lbl">Безнал АТК</div>
      </div>
      <div class="metric">
        <div class="metric-ico">🚐</div>
        <div class="metric-val">${fmt(d.totalRent)}<span>BYN</span></div>
        <div class="metric-lbl">Аренда авто</div>
      </div>
      <div class="metric">
        <div class="metric-ico">➡️</div>
        <div class="metric-val">${fmt(d.totalCarry)}<span>BYN</span></div>
        <div class="metric-lbl">Перенос нала</div>
      </div>
    </div>

    <!-- ОПЕРАТОРЫ -->
    <div class="card">
      <div class="card-title">👥 Га по операторам</div>
      <div id="ops-list"></div>
      <div id="ops-btn-wrap"></div>
    </div>

    <!-- БОРТЫ -->
    <div class="card">
      <div class="card-title">🚁 Борты</div>
      ${d.topDrones.length?d.topDrones.map(([drone,ha],i)=>{
        const color=OP_COLORS[i%OP_COLORS.length];
        const pct=Math.round(ha/maxDrone*100);
        const label=drone.replace('А','A').replace('-ХМ','').slice(0,5);
        return`<div class="bar-row">
          <div class="bar-av" style="background:${color};font-size:9px">${label}</div>
          <div class="bar-info">
            <div class="bar-name">${drone}</div>
            <div class="bar-sub">~${fmt(ha/12,0)} ч налёта</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
          </div>
          <div class="bar-right"><div class="bar-val">${fmt(ha,1)} га</div></div>
        </div>`;
      }).join(''):`<div class="empty">Нет данных</div>`}
    </div>

    <!-- РАЙОНЫ -->
    <div class="card">
      <div class="card-title">📍 Топ районов</div>
      ${d.topRegions.length?d.topRegions.map(([reg,ha],i)=>{
        const pct=Math.round(ha/maxReg*100);
        return`<div class="bar-row">
          <div class="bar-av" style="background:var(--green);font-size:13px;font-weight:900">${i+1}</div>
          <div class="bar-info">
            <div class="bar-name">${reg}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--ga)"></div></div>
          </div>
          <div class="bar-right"><div class="bar-val">${fmt(ha,1)} га</div></div>
        </div>`;
      }).join(''):`<div class="empty">Нет данных</div>`}
    </div>

    <!-- РАСХОДЫ -->
    <div class="card">
      <div class="card-title">💸 Расходы по категориям</div>
      ${d.topCats.length?d.topCats.map(([cat,sum])=>{
        const pct=Math.round(sum/maxCat*100);
        const pctTotal=d.totalExpenses>0?Math.round(sum/d.totalExpenses*100):0;
        return`<div class="exp-row">
          <div class="exp-info">
            <div class="exp-name">${cat||'Прочее'}</div>
            <div class="exp-track"><div class="exp-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="exp-right">
            <div class="exp-val">${fmt(sum)} BYN</div>
            <div class="exp-pct">${pctTotal}%</div>
          </div>
        </div>`;
      }).join(''):`<div class="empty">Нет данных</div>`}
      <div class="row" style="border-top:2px solid var(--border);margin-top:6px;padding-top:8px">
        <span class="rl" style="font-weight:700">Итого расходов</span>
        <span class="rv red">${fmt(d.totalExpenses)} BYN</span>
      </div>
    </div>

    <!-- ТЕХОБСЛУЖИВАНИЕ -->
    <div class="card">
      <div class="card-title">
        🔧 Техобслуживание
        <span style="font-size:11px;font-weight:700;color:${d.tiOpen.length?'var(--red)':'var(--t3)'}">${d.tiOpen.length?d.tiOpen.length+' открытых':'все закрыты'}</span>
      </div>
      ${d.tiOpen.length?d.tiOpen.map(t=>`
        <div class="ti-open">
          <div class="ti-top">
            <span class="ti-badge-open">⚠️ Открыто</span>
            <span class="ti-bak">${t.bak}</span>
            <span class="ti-type">${t.type}</span>
          </div>
          <div class="ti-desc">${t.desc}</div>
          <div class="ti-meta">
            <span>📅 ${fmtD(t.date)}</span>
            ${t.op?`<span>👤 ${t.op}</span>`:''}
          </div>
        </div>`).join(''):''}
      ${d.tiClosed.length?`
        <div style="font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin:${d.tiOpen.length?'10px':0} 0 8px">Закрытые</div>
        <div id="ti-closed-list"></div>
        <div id="ti-btn-wrap"></div>
      `:''}
      ${!d.tiOpen.length&&!d.tiClosed.length?`<div class="empty">Нет записей</div>`:''}
    </div>

    <!-- КОМАНДИРОВКИ -->
    <div class="card">
      <div class="card-title">🚐 История командировок</div>
      <div id="trips-list"></div>
      <div id="trips-btn-wrap"></div>
    </div>

  `;

  renderOps(d.topOps,false);
  renderTrips(_closedTrips,false);
  if(d.tiClosed.length)renderTiClosed(_tiClosed,false);
}

init();
</script>
</body>
</html>
