<!DOCTYPE html>
<!--
  AgroDrone.BY · Агроном — Кабинет
  v3.2 · 2026-05-23 · Новые ID, автозаполнение, кликабельные координаты
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Мои поля · AgroDrone.BY</title>
<script src="../config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f5;--card:#fff;--acc:#047857;--acm:#065f46;--acl:#d1fae5;--aca:#10b981;
  --border:#e2e6ef;--t1:#1a1f2e;--t2:#5a6476;--t3:#9aa3b2;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);
  --r:14px;--rs:10px;--f:'Manrope',sans-serif;--red:#dc2626;--orange:#f59e0b;--blue:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--t1);max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.app-hdr{background:linear-gradient(135deg,var(--acc),var(--acm));padding:14px 16px 16px;flex-shrink:0}
.hdr-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hdr-logo{font-size:20px;font-weight:800;color:#fff;flex:1}
.hdr-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;cursor:pointer;transition:background .2s}
.hdr-btn:active{background:rgba(255,255,255,.25)}
.hdr-info{background:rgba(255,255,255,.1);border-radius:var(--rs);padding:10px 12px}
.hdr-farm{font-size:14px;font-weight:700;color:#fff;margin-bottom:2px}
.hdr-city{font-size:12px;color:rgba(255,255,255,.8)}

.tabs{display:flex;gap:8px;padding:0 12px;margin-top:12px;background:var(--bg);flex-shrink:0;padding-top:8px;border-top:1px solid var(--border)}
.tab{flex:1;padding:10px;border-radius:var(--rs) var(--rs) 0 0;font-size:13px;font-weight:700;color:var(--t2);background:transparent;cursor:pointer;text-align:center;transition:all .2s;border:none}
.tab.active{background:#fff;color:var(--acc)}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(80px + env(safe-area-inset-bottom, 20px))}

.field-card{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh);position:relative}
.field-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.field-id{font-size:11px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.field-status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px}
.status-новое{background:#fef3c7;color:#92400e}
.status-подтверждено{background:#dbeafe;color:#1e40af}
.status-в.работе,.status-в_работе{background:#e0e7ff;color:#4338ca}
.status-частично{background:#fed7aa;color:#9a3412}
.status-готово{background:#d1fae5;color:#065f46}
.status-отклонено{background:#fee2e2;color:#991b1b}

.field-name{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:8px}
.field-details{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
.field-detail{font-size:13px;color:var(--t2);display:flex;align-items:center;gap:4px}
.field-coords{font-size:12px;color:var(--acc);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:4px 0}
.field-coords:active{opacity:.7}

.field-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.field-btn{padding:8px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:12px;font-weight:600;background:#fff;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:4px}
.field-btn:active{transform:scale(.96)}
.field-btn.btn-edit{color:var(--blue);border-color:#bfdbfe}
.field-btn.btn-edit:active{background:#eff6ff}
.field-btn.btn-copy{color:var(--t2);border-color:var(--border)}
.field-btn.btn-copy:active{background:var(--bg)}
.field-btn.btn-delete{color:var(--red);border-color:#fecaca}
.field-btn.btn-delete:active{background:#fee2e2}

.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom, 0px));right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acm));color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(4,120,87,.4);cursor:pointer;transition:transform .2s;z-index:100}
.fab:active{transform:scale(.9)}

.empty-state{text-align:center;padding:40px 20px;color:var(--t3)}
.empty-state-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-state-text{font-size:15px;font-weight:600;margin-bottom:6px}
.empty-state-hint{font-size:13px;color:var(--t3)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(26,31,46,.95);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;max-width:90%}
.toast.show{opacity:1}

.loading{text-align:center;padding:40px;color:var(--t3);font-size:14px}
</style>
</head>
<body>

<div class="app-hdr">
  <div class="hdr-top">
    <div class="hdr-logo">AgroDrone.BY</div>
    <div class="hdr-btn" onclick="window.location.reload()">⟳</div>
  </div>
  <div class="hdr-info">
    <div class="hdr-farm" id="farm-name">Загрузка...</div>
    <div class="hdr-city" id="farm-city">—</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('new')">Новые</button>
  <button class="tab" onclick="switchTab('confirmed')">Подтверждённые</button>
  <button class="tab" onclick="switchTab('all')">Все</button>
</div>

<div class="scroll" id="scroll-container">
  <div class="loading">Загрузка полей...</div>
</div>

<div class="fab" onclick="addField()">+</div>

<div class="toast" id="toast"></div>

<script>
let CLIENT_ID, CITY, FARM_NAME, allFields = [], currentTab = 'new';

async function init() {
  const urlParams = new URLSearchParams(window.location.search);
  let clientId = urlParams.get('clientId');
  
  // Миграция старых форматов ID
  if (clientId) {
    // agr-101-26 → AG101
    if (clientId.includes('agr-')) {
      const match = clientId.match(/agr-(\d+)-\d+/);
      if (match) clientId = 'AG' + match[1];
    }
    // agr101 → AG101
    else if (clientId.startsWith('agr') && !clientId.includes('-')) {
      const num = clientId.replace(/[^\d]/g, '');
      clientId = 'AG' + num;
    }
    
    sessionStorage.setItem('CLIENT_ID', clientId);
    CLIENT_ID = clientId;
  } else {
    CLIENT_ID = sessionStorage.getItem('CLIENT_ID');
  }
  
  if (!CLIENT_ID) {
    window.location.href = 'AD_agronom_register.html';
    return;
  }
  
  await loadClientData();
  await loadFields();
}

async function loadClientData() {
  try {
    const resp = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getClientData', clientId: CLIENT_ID })
    });
    const json = await resp.json();
    
    if (json.ok && json.result.success) {
      FARM_NAME = json.result.farmName || 'Хозяйство';
      CITY = json.result.city || 'Не указан';
      
      document.getElementById('farm-name').textContent = FARM_NAME;
      document.getElementById('farm-city').textContent = '📍 ' + CITY;
      
      sessionStorage.setItem('FARM_NAME', FARM_NAME);
      sessionStorage.setItem('CITY', CITY);
    }
  } catch(e) {
    console.error('Ошибка загрузки данных клиента:', e);
  }
}

async function loadFields() {
  try {
    const resp = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'get_client_fields', data: { clientId: CLIENT_ID } })
    });
    const json = await resp.json();
    
    if (json.ok && json.result.fields) {
      allFields = json.result.fields;
      sessionStorage.setItem('allFields', JSON.stringify(allFields));
      renderFields();
    } else {
      document.getElementById('scroll-container').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">🌾</div>
          <div class="empty-state-text">Пока нет полей</div>
          <div class="empty-state-hint">Нажмите + чтобы добавить первое поле</div>
        </div>
      `;
    }
  } catch(e) {
    console.error('Ошибка загрузки полей:', e);
    showToast('❌ Ошибка загрузки');
  }
}

function renderFields() {
  let fields = allFields;
  
  // Фильтрация по табу
  if (currentTab === 'new') {
    fields = allFields.filter(f => f.status === 'новое');
  } else if (currentTab === 'confirmed') {
    fields = allFields.filter(f => f.status === 'подтверждено' || f.status === 'в работе' || f.status === 'в_работе');
  }
  
  if (fields.length === 0) {
    const emptyText = currentTab === 'new' ? 'Нет новых полей' : currentTab === 'confirmed' ? 'Нет подтверждённых полей' : 'Нет полей';
    document.getElementById('scroll-container').innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🌾</div>
        <div class="empty-state-text">${emptyText}</div>
      </div>
    `;
    return;
  }
  
  const html = fields.map(f => {
    // Миграция отображения ID
    let displayId = f.id;
    if (f.id.startsWith('fld_')) {
      displayId = f.id.replace('fld_', 'FD').replace(/_/g, '-');
    } else if (f.id.startsWith('CL')) {
      displayId = f.id.replace('CL', 'FD');
    }
    
    const statusClass = (f.status || 'новое').toLowerCase().replace(/ /g, '_');
    const statusText = getStatusText(f.status);
    
    // Координаты для Google Maps
    const coords = f.coords || '';
    const coordsLink = coords ? `onclick="openMaps('${coords}')"` : '';
    
    return `
      <div class="field-card">
        <div class="field-header">
          <div class="field-id">${displayId}</div>
          <div class="field-status status-${statusClass}">${statusText}</div>
        </div>
        
        <div class="field-name">${f.name || 'Без названия'}</div>
        
        <div class="field-details">
          <div class="field-detail">🌾 ${f.crop || '—'}</div>
          <div class="field-detail">📦 ${f.prep || '—'}</div>
          ${f.norm ? `<div class="field-detail">💧 ${f.norm} л/га</div>` : ''}
          <div class="field-detail">📐 ${f.haPlan || 0} га</div>
        </div>
        
        ${coords ? `<div class="field-coords" ${coordsLink}>📍 Координаты (открыть карту)</div>` : ''}
        
        <div class="field-actions">
          <button class="field-btn btn-copy" onclick='copyField(${JSON.stringify(f).replace(/'/g, "&#39;")})'>📋 Копировать</button>
          <button class="field-btn btn-edit" onclick='editField(${JSON.stringify(f).replace(/'/g, "&#39;")})'>✏️ Править</button>
          <button class="field-btn btn-delete" onclick="deleteField('${f.id}', '${f.name}')">🗑 Удалить</button>
        </div>
      </div>
    `;
  }).join('');
  
  document.getElementById('scroll-container').innerHTML = html;
}

function getStatusText(status) {
  const map = {
    'новое': 'Новое',
    'подтверждено': 'Подтверждено',
    'в работе': 'В работе',
    'в_работе': 'В работе',
    'частично': 'Частично',
    'готово': 'Готово',
    'отклонено': 'Отклонено'
  };
  return map[status] || status;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderFields();
}

function openMaps(coords) {
  const [lat, lng] = coords.split(',').map(s => s.trim());
  window.open(`https://www.google.com/maps?q=${lat},${lng}`, '_blank');
}

function addField() {
  window.location.href = `AD_agronom_field_form.html?clientId=${CLIENT_ID}`;
}

function editField(field) {
  sessionStorage.setItem('editField', JSON.stringify(field));
  window.location.href = `AD_agronom_field_form.html?clientId=${CLIENT_ID}&mode=edit&id=${field.id}`;
}

function copyField(field) {
  sessionStorage.setItem('copyField', JSON.stringify(field));
  window.location.href = `AD_agronom_field_form.html?clientId=${CLIENT_ID}&mode=copy`;
}

async function deleteField(id, name) {
  if (!confirm(`Удалить поле "${name}"?`)) return;
  
  showToast('⏳ Удаляю...');
  
  try {
    const resp = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'delete_field', data: { id } })
    });
    const json = await resp.json();
    
    if (json.ok) {
      showToast('✅ Поле удалено');
      await loadFields();
    } else {
      showToast('❌ ' + (json.error || 'Ошибка удаления'));
    }
  } catch(e) {
    console.error(e);
    showToast('❌ Ошибка');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
