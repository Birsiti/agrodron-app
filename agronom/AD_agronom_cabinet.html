<!DOCTYPE html>
<!--
  AgroDrone.BY · Агроном — Кабинет
  v3.0 · 2026-05-21 · папка /agronom/
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AgroDrone.BY · Агроном</title>
<script src="../config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f5;--card:#fff;--acc:#047857;--acm:#065f46;--acl:#d1fae5;--aca:#10b981;
  --border:#e2e6ef;--t1:#1a1f2e;--t2:#5a6476;--t3:#9aa3b2;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);
  --r:14px;--rs:10px;--f:'Manrope',sans-serif;
  --amber:#d97706;--amber-light:#fef3c7;--red:#dc2626;--blue:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--t1);max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.app-hdr{background:linear-gradient(135deg,var(--acc),var(--acm));padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand-ico{width:40px;height:40px;background:rgba(255,255,255,.2);border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-ico svg{width:24px;height:24px}
.brand-name{font-size:18px;font-weight:800;color:#fff;line-height:1.1}
.brand-name em{font-style:normal;color:#d1fae5}
.brand-sub{font-size:11px;color:rgba(255,255,255,.8);font-weight:500;margin-top:2px}
.role-chip{font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.25);color:#fff}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(80px + env(safe-area-inset-bottom, 20px))}

.stats-banner{background:linear-gradient(135deg,var(--acc),var(--acm));border-radius:var(--rs);padding:14px;margin-bottom:8px;color:#fff}
.sb-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.sb-stat{background:rgba(255,255,255,.15);border-radius:8px;padding:8px;text-align:center}
.sb-val{font-size:16px;font-weight:800}
.sb-lbl{font-size:10px;opacity:.8;margin-top:2px}

.btn-add{background:linear-gradient(135deg,var(--acc),var(--acm));color:#fff;border:none;border-radius:var(--rs);padding:14px;font-family:var(--f);font-size:15px;font-weight:700;width:100%;cursor:pointer;margin-bottom:12px;transition:transform .2s}
.btn-add:active{transform:scale(.98)}

.field-card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:8px;border-left:4px solid var(--border);transition:all .2s}
.field-card.st-wait{border-left-color:#f59e0b}
.field-card.st-work{border-left-color:#2563eb}
.field-card.st-partial{border-left-color:#8b5cf6}
.field-card.st-done{border-left-color:var(--aca)}
.fc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.fc-name{font-size:15px;font-weight:800;color:var(--t1)}
.fc-meta{font-size:11px;color:var(--t3);margin-top:2px}
.fc-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.fc-badge.st-wait{background:#fef3c7;color:#92400e}
.fc-badge.st-work{background:#eff6ff;color:#1d4ed8}
.fc-badge.st-partial{background:#f5f3ff;color:#6d28d9}
.fc-badge.st-done{background:var(--acl);color:var(--acc)}
.fc-data{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:10px;border-top:1px solid var(--border);margin-top:6px}
.fc-d{display:flex;flex-direction:column;gap:2px}
.fc-dv{font-size:14px;font-weight:800;color:var(--t1)}
.fc-dl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.3px}
.fc-actions{display:flex;gap:6px;margin-top:10px}
.fc-btn{flex:1;padding:8px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;transition:all .2s}
.fc-btn:active{transform:scale(.98);border-color:var(--aca)}

.loading{text-align:center;padding:40px 20px;color:var(--t3)}
.loading-spinner{font-size:28px;animation:spin 1s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}

.empty{text-align:center;padding:40px 20px}
.empty-ico{font-size:40px;margin-bottom:10px;opacity:.4}
.empty-t{font-size:14px;font-weight:700;color:var(--t2);margin-bottom:4px}
.empty-s{font-size:12px;color:var(--t3)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(26,31,46,.95);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;max-width:90%}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="app-hdr">
  <div class="brand">
    <div class="brand-ico"><svg fill="#fff" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><circle cx="12" cy="12" r="3"/></svg></div>
    <div><div class="brand-name">Agro<em>Drone</em>.BY</div><div class="brand-sub" id="farm-name">—</div></div>
  </div>
  <div class="role-chip" id="client-id-badge">—</div>
</div>

<div class="scroll">
  <div class="stats-banner">
    <div style="font-size:13px;font-weight:800;opacity:.9">🗺️ Мои поля · Сезон 2026</div>
    <div class="sb-grid">
      <div class="sb-stat"><div class="sb-val" id="badge-wait">0</div><div class="sb-lbl">Ждёт</div></div>
      <div class="sb-stat"><div class="sb-val" id="badge-work">0</div><div class="sb-lbl">В работе</div></div>
      <div class="sb-stat"><div class="sb-val" id="badge-done">0</div><div class="sb-lbl">Готово</div></div>
    </div>
  </div>

  <button class="btn-add" onclick="addField()">➕ Добавить поле</button>

  <div id="fields-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let CLIENT_ID, CITY, allFields = [];

async function init() {
  const urlParams = new URLSearchParams(window.location.search);
  const clientId = urlParams.get('clientId');
  
  if (clientId) {
    sessionStorage.setItem('CLIENT_ID', clientId);
    CLIENT_ID = clientId;
  } else {
    CLIENT_ID = sessionStorage.getItem('CLIENT_ID');
  }
  
  if (!CLIENT_ID) {
    document.getElementById('fields-list').innerHTML = '<div class="empty"><div class="empty-ico">⚠️</div><div class="empty-t">Ошибка</div><div class="empty-s">clientId не найден</div></div>';
    return;
  }
  
  document.getElementById('client-id-badge').textContent = 'ID: ' + CLIENT_ID;
  
  await loadClientData();
  await loadFields();
}

async function loadClientData() {
  try {
    const resp = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'get_client_data', data: { clientId: CLIENT_ID } })
    });
    const json = await resp.json();
    if (json.ok && json.client) {
      document.getElementById('farm-name').textContent = json.client.farmName || 'Хозяйство';
      CITY = json.client.city || '';
      sessionStorage.setItem('CITY', CITY);
    }
  } catch(e) {
    console.error(e);
  }
}

async function loadFields() {
  document.getElementById('fields-list').innerHTML = '<div class="loading"><div class="loading-spinner">⏳</div>Загрузка полей...</div>';
  
  try {
    const resp = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'get_client_fields', data: { clientId: CLIENT_ID } })
    });
    const json = await resp.json();
    
    if (json.ok && json.fields) {
      allFields = json.fields;
      sessionStorage.setItem('allFields', JSON.stringify(allFields));
      renderFields();
    } else {
      document.getElementById('fields-list').innerHTML = '<div class="empty"><div class="empty-ico">📭</div><div class="empty-t">Нет полей</div><div class="empty-s">Добавьте первое поле</div></div>';
    }
  } catch(e) {
    console.error(e);
    document.getElementById('fields-list').innerHTML = '<div class="empty"><div class="empty-ico">⚠️</div><div class="empty-t">Ошибка загрузки</div></div>';
  }
}

function renderFields() {
  if (allFields.length === 0) {
    document.getElementById('fields-list').innerHTML = '<div class="empty"><div class="empty-ico">📭</div><div class="empty-t">Нет полей</div><div class="empty-s">Добавьте первое поле</div></div>';
    return;
  }
  
  const statusMap = { 'ждёт': 'wait', 'в работе': 'work', 'частично': 'partial', 'готово': 'done' };
  const cnt = { wait: 0, work: 0, partial: 0, done: 0 };
  
  const html = allFields.map(f => {
    const st = statusMap[f.status?.toLowerCase()] || 'wait';
    cnt[st]++;
    return `
      <div class="field-card st-${st}">
        <div class="fc-head">
          <div><div class="fc-name">${f.name || '—'}</div><div class="fc-meta">${f.crop || '—'}</div></div>
          <div class="fc-badge st-${st}">${f.status || 'Ждёт'}</div>
        </div>
        <div class="fc-data">
          <div class="fc-d"><div class="fc-dv">${f.haPlan || 0}</div><div class="fc-dl">План (га)</div></div>
          <div class="fc-d"><div class="fc-dv">${f.haFact || 0}</div><div class="fc-dl">Факт (га)</div></div>
          <div class="fc-d"><div class="fc-dv">${f.prep || '—'}</div><div class="fc-dl">Препарат</div></div>
        </div>
        <div class="fc-actions">
          <button class="fc-btn" onclick="editField('${f.id}')">✏️ Редактировать</button>
          <button class="fc-btn" onclick="copyField('${f.id}')">📋 Копировать</button>
        </div>
      </div>
    `;
  }).join('');
  
  document.getElementById('fields-list').innerHTML = html;
  document.getElementById('badge-wait').textContent = cnt.wait;
  document.getElementById('badge-work').textContent = cnt.work + cnt.partial;
  document.getElementById('badge-done').textContent = cnt.done;
}

function addField() {
  window.location.href = 'AD_agronom_field_form.html';
}

function editField(id) {
  const field = allFields.find(f => f.id === id);
  if (!field) return;
  sessionStorage.setItem('editField', JSON.stringify(field));
  window.location.href = 'AD_agronom_field_form.html?mode=edit&id=' + id;
}

function copyField(id) {
  const field = allFields.find(f => f.id === id);
  if (!field) return;
  sessionStorage.setItem('copyField', JSON.stringify(field));
  window.location.href = 'AD_agronom_field_form.html?mode=copy';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
