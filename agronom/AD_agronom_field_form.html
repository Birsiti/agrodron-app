<!DOCTYPE html>
<!--
  AgroDrone.BY · Агроном — Форма поля
  v3.2 · 2026-05-23 · Умное автозаполнение, подсказки, история
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Добавить поле · AgroDrone.BY</title>
<script src="../config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--t1);max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.app-hdr{background:linear-gradient(135deg,var(--acc),var(--acm));padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-back{font-size:24px;color:#fff;cursor:pointer}
.hdr-title{font-size:18px;font-weight:800;color:#fff;flex:1}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(80px + env(safe-area-inset-bottom, 20px))}

.frow{margin-bottom:12px;position:relative}
.frow label{font-size:12px;font-weight:700;color:var(--t2);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.frow input,.frow select,.frow textarea{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:var(--rs);padding:12px 14px;font-family:var(--f);font-size:14px;color:var(--t1);outline:none;transition:border-color .2s;-webkit-appearance:none}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--aca)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.hint{font-size:11px;color:var(--t3);margin-top:6px;display:flex;align-items:center;gap:4px}
.hint-link{color:var(--acc);cursor:pointer;font-weight:600}
.hint-link:active{opacity:.7}

.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--border);border-top:none;border-radius:0 0 var(--rs) var(--rs);max-height:200px;overflow-y:auto;z-index:100;display:none;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.autocomplete-list.show{display:block}
.autocomplete-item{padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.autocomplete-item:last-child{border-bottom:none}
.autocomplete-item:active{background:var(--acl)}
.autocomplete-item-main{font-weight:600;color:var(--t1);font-size:14px;margin-bottom:4px}
.autocomplete-item-sub{font-size:12px;color:var(--t3);line-height:1.4}
.autocomplete-badge{display:inline-block;background:var(--acl);color:var(--acc);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-left:6px}

.btn{width:100%;padding:14px;border:none;border-radius:var(--rs);font-family:var(--f);font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;margin-bottom:8px;display:block}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--acc),var(--acm));color:#fff}
.btn-danger{background:#fee2e2;color:var(--red);border:1.5px solid #fca5a5}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(26,31,46,.95);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;max-width:90%}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="app-hdr">
  <div class="hdr-back" onclick="goBack()">‹</div>
  <div class="hdr-title" id="page-title">Добавить поле</div>
</div>

<div class="scroll">
  <div class="frow">
    <label>Название поля *</label>
    <input type="text" id="f-name" placeholder="Например: Ур. Залежь, Поле №3" autocomplete="off" oninput="handleFieldNameInput(this.value)">
    <div class="autocomplete-list" id="name-suggestions"></div>
    <div class="hint">💡 Начните вводить — подтянутся данные из прошлых полей</div>
  </div>
  
  <div class="frow">
    <label>Культура *</label>
    <select id="f-crop">
      <option value="">Выберите культуру</option>
      <option>Кукуруза</option>
      <option>Пшеница</option>
      <option>Ячмень</option>
      <option>Рапс</option>
      <option>Соя</option>
      <option>Картофель</option>
      <option>Свёкла сахарная</option>
      <option>Подсолнечник</option>
      <option>Другое</option>
    </select>
  </div>
  
  <div class="frow">
    <label>Препарат *</label>
    <input type="text" id="f-prep" placeholder="Название препарата" autocomplete="off" oninput="handlePrepInput(this.value)">
    <div class="autocomplete-list" id="prep-suggestions"></div>
  </div>
  
  <div class="fgrid">
    <div class="frow">
      <label>Норма л/га</label>
      <input type="number" id="f-norm" step="0.1" placeholder="1.5">
    </div>
    <div class="frow">
      <label>Площадь га *</label>
      <input type="number" id="f-area" step="0.1" placeholder="85">
    </div>
  </div>
  
  <div class="frow">
    <label>Координаты *</label>
    <input type="text" id="f-coords" placeholder="Вставьте координаты или ссылку">
    <div class="hint">
      📍 <span class="hint-link" onclick="openYandexMaps()">Открыть Яндекс.Карты</span> · 
      <span class="hint-link" onclick="openGoogleMaps()">Google Maps</span>
    </div>
  </div>
  
  <button class="btn btn-primary" id="save-btn" onclick="saveField()">✓ Добавить поле</button>
  <button class="btn btn-danger" id="delete-btn" style="display:none" onclick="deleteField()">🗑 Удалить поле</button>
</div>

<div class="toast" id="toast"></div>

<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}

let CLIENT_ID, CITY, fieldHistory = {}, editMode = false, editId = null;

function init() {
  const urlParams = new URLSearchParams(window.location.search);
  let clientId = urlParams.get('clientId');
  
  // Миграция старых форматов ID
  if (clientId) {
    if (clientId.includes('agr-')) {
      const match = clientId.match(/agr-(\d+)-\d+/);
      if (match) clientId = 'AG' + match[1];
    } else if (clientId.startsWith('agr') && !clientId.includes('-')) {
      const num = clientId.replace(/[^\d]/g, '');
      clientId = 'AG' + num;
    }
    
    sessionStorage.setItem('CLIENT_ID', clientId);
    CLIENT_ID = clientId;
  } else {
    CLIENT_ID = sessionStorage.getItem('CLIENT_ID');
  }
  
  if (!CLIENT_ID) {
    showToast('❌ Ошибка: нет ID агронома');
    setTimeout(() => window.location.href = 'AD_agronom_register.html', 1500);
    return;
  }
  
  CITY = sessionStorage.getItem('CITY');
  
  const allFields = JSON.parse(sessionStorage.getItem('allFields') || '[]');
  buildFieldHistory(allFields);
  
  const mode = urlParams.get('mode');
  
  if (mode === 'edit') {
    editMode = true;
    editId = urlParams.get('id');
    const field = JSON.parse(sessionStorage.getItem('editField'));
    loadFieldData(field);
    document.getElementById('page-title').textContent = 'Редактировать поле';
    document.getElementById('save-btn').textContent = '✓ Сохранить изменения';
    document.getElementById('delete-btn').style.display = 'block';
  } else if (mode === 'copy') {
    const field = JSON.parse(sessionStorage.getItem('copyField'));
    loadFieldData(field, true);
    document.getElementById('page-title').textContent = 'Копировать поле';
  }
}

function buildFieldHistory(fields) {
  fieldHistory = { names: {}, preps: {} };
  
  fields.forEach(f => {
    // История по названиям полей
    if (f.name) {
      if (!fieldHistory.names[f.name]) fieldHistory.names[f.name] = [];
      fieldHistory.names[f.name].push({
        crop: f.crop,
        prep: f.prep,
        norm: f.norm,
        coords: f.coords,
        area: f.haPlan
      });
    }
    
    // История по препаратам
    if (f.prep) {
      if (!fieldHistory.preps[f.prep]) fieldHistory.preps[f.prep] = {norms: [], count: 0};
      fieldHistory.preps[f.prep].norms.push(parseFloat(f.norm) || 0);
      fieldHistory.preps[f.prep].count++;
      fieldHistory.preps[f.prep].crop = f.crop; // Последняя культура
    }
  });
}

function loadFieldData(field, isCopy = false) {
  document.getElementById('f-name').value = isCopy ? field.name + ' (копия)' : field.name;
  document.getElementById('f-crop').value = field.crop || '';
  document.getElementById('f-prep').value = field.prep || '';
  document.getElementById('f-norm').value = field.norm || '';
  document.getElementById('f-area').value = isCopy ? '' : (field.haPlan || '');
  document.getElementById('f-coords').value = field.coords || '';
}

function handleFieldNameInput(val) {
  const list = document.getElementById('name-suggestions');
  if (!val.trim()) {
    list.classList.remove('show');
    return;
  }
  
  const matches = Object.keys(fieldHistory.names)
    .filter(n => n.toLowerCase().includes(val.toLowerCase()))
    .slice(0, 5);
  
  if (matches.length === 0) {
    list.classList.remove('show');
    return;
  }
  
  list.innerHTML = matches.map(name => {
    const history = fieldHistory.names[name];
    const last = history[0];
    const useCount = history.length;
    
    return `
      <div class="autocomplete-item" onclick="selectFieldName('${name.replace(/'/g, "\\'")}')">
        <div class="autocomplete-item-main">
          ${name}
          <span class="autocomplete-badge">${useCount}×</span>
        </div>
        <div class="autocomplete-item-sub">
          ${last.crop || '—'} · ${last.prep || '—'} · ${last.norm || '—'} л/га · ${last.area || '—'} га
        </div>
      </div>
    `;
  }).join('');
  
  list.classList.add('show');
}

function selectFieldName(name) {
  document.getElementById('f-name').value = name;
  document.getElementById('name-suggestions').classList.remove('show');
  
  const history = fieldHistory.names[name];
  if (!history || history.length === 0) return;
  
  const last = history[0];
  
  if (last.crop) document.getElementById('f-crop').value = last.crop;
  if (last.prep) document.getElementById('f-prep').value = last.prep;
  if (last.norm) document.getElementById('f-norm').value = last.norm;
  if (last.coords) document.getElementById('f-coords').value = last.coords;
  
  showToast('✅ Данные подтянуты из истории');
}

function handlePrepInput(val) {
  const list = document.getElementById('prep-suggestions');
  if (!val.trim()) {
    list.classList.remove('show');
    return;
  }
  
  const matches = Object.keys(fieldHistory.preps)
    .filter(p => p.toLowerCase().includes(val.toLowerCase()))
    .slice(0, 5);
  
  if (matches.length === 0) {
    list.classList.remove('show');
    return;
  }
  
  list.innerHTML = matches.map(prep => {
    const data = fieldHistory.preps[prep];
    const norms = data.norms.filter(n => n > 0);
    const avgNorm = norms.length > 0 
      ? (norms.reduce((a,b) => a+b, 0) / norms.length).toFixed(1) 
      : '';
    
    return `
      <div class="autocomplete-item" onclick="selectPrep('${prep.replace(/'/g, "\\'")}', '${avgNorm}')">
        <div class="autocomplete-item-main">
          ${prep}
          <span class="autocomplete-badge">${data.count}×</span>
        </div>
        <div class="autocomplete-item-sub">
          Средняя норма: ${avgNorm || '—'} л/га · ${data.crop || '—'}
        </div>
      </div>
    `;
  }).join('');
  
  list.classList.add('show');
}

function selectPrep(prep, norm) {
  document.getElementById('f-prep').value = prep;
  if (norm) document.getElementById('f-norm').value = norm;
  document.getElementById('prep-suggestions').classList.remove('show');
  
  showToast('✅ Норма подставлена из истории');
}

async function saveField() {
  const name = document.getElementById('f-name').value.trim();
  const crop = document.getElementById('f-crop').value;
  const prep = document.getElementById('f-prep').value.trim();
  const norm = document.getElementById('f-norm').value;
  const area = document.getElementById('f-area').value;
  let coords = document.getElementById('f-coords').value.trim();

  if (!name) { showToast('⚠️ Укажите название поля'); return; }
  if (!crop) { showToast('⚠️ Выберите культуру'); return; }
  if (!prep) { showToast('⚠️ Укажите препарат'); return; }
  if (!area || parseFloat(area) <= 0) { showToast('⚠️ Укажите площадь'); return; }
  if (!coords) { showToast('⚠️ Укажите координаты'); return; }
  
  // Извлекаем координаты из ссылки Google Maps
  if (coords.includes('google.com/maps')) {
    const match = coords.match(/q=([\d.-]+),([\d.-]+)/);
    if (match) {
      coords = `${match[1]}, ${match[2]}`;
    }
  }

  const btn = document.getElementById('save-btn');
  btn.textContent = '⏳ Сохраняю...';
  btn.disabled = true;

  try {
    const action = editMode ? 'update_field' : 'add_field';
    const payload = editMode
      ? { id: editId, name, crop, prep, norm: norm.replace(',','.'), haPlan: parseFloat(area.replace(',','.')), coords, city: CITY }
      : { clientId: CLIENT_ID, city: CITY || 'Не указан', name, crop, prep, norm: norm.replace(',','.'), haPlan: parseFloat(area.replace(',','.')), coords };

    const resp = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action, data: payload })
    });
    const json = await resp.json();

    if (json.ok) {
      showToast(editMode ? '✅ Поле обновлено!' : '✅ Поле добавлено!');
      setTimeout(() => { window.location.href = 'AD_agronom_cabinet.html?clientId=' + CLIENT_ID; }, 800);
    } else {
      showToast('❌ ' + (json.error || 'Ошибка'));
    }
  } catch(e) {
    console.error(e);
    showToast('❌ Ошибка');
  } finally {
    btn.disabled = false;
    btn.textContent = editMode ? '✓ Сохранить изменения' : '✓ Добавить поле';
  }
}

async function deleteField() {
  if (!confirm('Удалить это поле?')) return;
  
  showToast('⏳ Удаляю...');
  
  try {
    const resp = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'delete_field', data: { id: editId } })
    });
    const json = await resp.json();
    
    if (json.ok) {
      showToast('✅ Поле удалено');
      setTimeout(() => { window.location.href = 'AD_agronom_cabinet.html?clientId=' + CLIENT_ID; }, 800);
    } else {
      showToast('❌ ' + (json.error || 'Ошибка удаления'));
    }
  } catch(e) {
    console.error(e);
    showToast('❌ Ошибка');
  }
}

function goBack() {
  window.location.href = 'AD_agronom_cabinet.html?clientId=' + CLIENT_ID;
}

function openYandexMaps() {
  window.open('https://yandex.ru/maps/', '_blank');
}

function openGoogleMaps() {
  window.open('https://www.google.com/maps/', '_blank');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.frow')) {
    document.querySelectorAll('.autocomplete-list').forEach(l => l.classList.remove('show'));
  }
});

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
