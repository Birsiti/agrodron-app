<!DOCTYPE html>
<!--
  AgroDrone.BY · Агроном — Регистрация
  v3.4 · 2026-05-24 · Fix: три способа получить telegramId
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Регистрация · AgroDrone.BY</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f5;--card:#fff;--acc:#047857;--acm:#065f46;--acl:#d1fae5;--aca:#10b981;
  --border:#e2e6ef;--t1:#1a1f2e;--t2:#5a6476;--t3:#9aa3b2;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);
  --r:14px;--rs:10px;--f:'Manrope',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--t1);max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.app-hdr{background:linear-gradient(135deg,var(--acc),var(--acm));padding:20px 16px 24px;flex-shrink:0;text-align:center}
.hdr-logo{font-size:28px;font-weight:800;color:#fff;margin-bottom:8px}
.hdr-subtitle{font-size:14px;color:rgba(255,255,255,.85)}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px calc(20px + env(safe-area-inset-bottom, 20px))}

.welcome{background:#fff;border-radius:var(--r);padding:20px;margin-bottom:20px;box-shadow:var(--sh);text-align:center}
.welcome-icon{font-size:48px;margin-bottom:12px}
.welcome-title{font-size:20px;font-weight:800;color:var(--t1);margin-bottom:8px}
.welcome-text{font-size:14px;color:var(--t2);line-height:1.6}

.form-card{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.form-title{font-size:16px;font-weight:800;color:var(--t1);margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--border)}

.frow{margin-bottom:16px}
.frow label{font-size:12px;font-weight:700;color:var(--t2);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.frow input,.frow select{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:var(--rs);padding:12px 14px;font-family:var(--f);font-size:14px;color:var(--t1);outline:none;transition:border-color .2s;-webkit-appearance:none}
.frow input:focus,.frow select:focus{border-color:var(--aca)}
.frow input::placeholder{color:var(--t3)}

.hint{font-size:11px;color:var(--t3);margin-top:6px;line-height:1.5}

.btn{width:100%;padding:14px;border:none;border-radius:var(--rs);font-family:var(--f);font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:20px}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--acc),var(--acm));color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(26,31,46,.95);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;max-width:90%}
.toast.show{opacity:1}

.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s}
.loading-overlay.show{opacity:1;pointer-events:all}
.loading-spinner{background:#fff;padding:24px 32px;border-radius:var(--r);text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.loading-spinner-icon{font-size:32px;margin-bottom:12px;animation:spin 1s linear infinite}
.loading-spinner-text{font-size:14px;font-weight:600;color:var(--t1)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="app-hdr">
  <div class="hdr-logo">🌾 AgroDrone.BY</div>
  <div class="hdr-subtitle">Обработка полей БЛА · v3.4</div>
  <div style="font-size:11px;color:rgba(255,255,255,.7);margin-top:4px" id="debug-url"></div>
</div>

<div class="scroll">
  <div class="welcome">
    <div class="welcome-icon">👋</div>
    <div class="welcome-title">Добро пожаловать!</div>
    <div class="welcome-text">
      Зарегистрируйтесь, чтобы добавлять свои поля и отслеживать их обработку в режиме реального времени.
    </div>
  </div>

  <div class="form-card">
    <div class="form-title">Регистрация агронома</div>
    
    <div class="frow">
      <label>Название хозяйства *</label>
      <input type="text" id="f-farm" placeholder="Например: СПК «Рассвет»" autocomplete="off">
    </div>
    
    <div class="frow">
      <label>ФИО агронома</label>
      <input type="text" id="f-name" placeholder="Иванов Иван Иванович" autocomplete="off">
    </div>
    
    <div class="frow">
      <label>Район / Населённый пункт *</label>
      <input type="text" id="f-city" placeholder="Например: Ганцевичи" autocomplete="off">
      <div class="hint">📍 Укажите районный центр или ближайший город</div>
    </div>
    
    <div class="frow">
      <label>Телефон *</label>
      <input type="tel" id="f-phone" placeholder="+375 29 123-45-67" value="+375 " autocomplete="off">
      <div class="hint">☎️ Для связи и идентификации в системе</div>
    </div>
    
    <button class="btn btn-primary" id="register-btn" onclick="register()">
      ✓ Зарегистрироваться
    </button>
  </div>
</div>

<div class="loading-overlay" id="loading">
  <div class="loading-spinner">
    <div class="loading-spinner-icon">⏳</div>
    <div class="loading-spinner-text">Регистрируем...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════
// TELEGRAM WEB APP
// ══════════════════════════════════
let tg = window.Telegram.WebApp;
let telegramId = null;
let telegramUsername = null;

// Инициализация Telegram WebApp
tg.ready();
tg.expand();

// Получение данных пользователя Telegram
try {
  const user = tg.initDataUnsafe?.user;
  if (user) {
    telegramId = user.id;
    telegramUsername = user.username || '';
  }
} catch(e) {}

// Фолбэк 1: парсим initData вручную
if (!telegramId && tg.initData) {
  try {
    const params = new URLSearchParams(tg.initData);
    const userStr = params.get('user');
    if (userStr) {
      const user = JSON.parse(decodeURIComponent(userStr));
      telegramId = user.id;
    }
  } catch(e) {}
}

// Фолбэк 2: читаем из URL ?telegram_id=
if (!telegramId) {
  const urlId = new URLSearchParams(window.location.search).get('telegram_id');
  if (urlId) telegramId = urlId;
}

// DEBUG
document.getElementById('debug-url').textContent =
  'URL: ' + window.location.search + ' | tgID: ' + (telegramId || 'null');

// ══════════════════════════════════
// INIT
// ══════════════════════════════════
function init() {
  // Автофокус на первое поле
  setTimeout(() => document.getElementById('f-farm').focus(), 300);
}

async function checkRegistration() {
  // Эта функция НЕ используется в новой логике
  // Проверка регистрации делается в Leadtex через HTTP-запрос
}

async function register() {
  const farm = document.getElementById('f-farm').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const city = document.getElementById('f-city').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  
  // Валидация
  if (!farm) {
    showToast('⚠️ Укажите название хозяйства');
    document.getElementById('f-farm').focus();
    return;
  }
  
  if (!city) {
    showToast('⚠️ Укажите населённый пункт');
    document.getElementById('f-city').focus();
    return;
  }
  
  if (!phone) {
    showToast('⚠️ Укажите телефон');
    document.getElementById('f-phone').focus();
    return;
  }
  
  // Проверяем наличие Telegram ID
  if (!telegramId) {
    showToast('⚠️ Ошибка: не удалось получить Telegram ID');
    console.error('telegramId отсутствует при попытке регистрации');
    return;
  }
  
  console.log('Регистрация с Telegram ID:', telegramId);
  
  const btn = document.getElementById('register-btn');
  btn.disabled = true;
  
  document.getElementById('loading').classList.add('show');
  
  try {
    const resp = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'registerClient',
        farmName: farm,
        agronome: name,
        city: city,
        phone: phone,
        telegram_id: String(telegramId)
      })
    });
    const json = await resp.json();
    
    if (json.ok && json.result.registered) {
      const clientId = json.result.clientId;
      
      sessionStorage.setItem('CLIENT_ID', clientId);
      sessionStorage.setItem('FARM_NAME', farm);
      sessionStorage.setItem('CITY', city);
      
      showToast(`✅ Регистрация успешна! ID: ${clientId}`);
      
      setTimeout(() => {
        window.location.href = `AD_agronom_cabinet.html?clientId=${clientId}`;
      }, 1000);
    } else {
      showToast('❌ ' + (json.error || 'Ошибка регистрации'));
    }
  } catch(e) {
    console.error('Ошибка регистрации:', e);
    showToast('❌ Ошибка соединения');
  } finally {
    btn.disabled = false;
    document.getElementById('loading').classList.remove('show');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Форматирование телефона при вводе — +375 фиксирован
document.getElementById('f-phone').addEventListener('input', (e) => {
  let val = e.target.value;
  
  // Убираем все символы кроме цифр
  let digits = val.replace(/\D/g, '');
  
  // Если пользователь удалил +375, возвращаем обратно
  if (!val.startsWith('+375')) {
    // Если есть цифры после 375, сохраняем их
    if (digits.startsWith('375')) {
      digits = digits.slice(3); // Убираем 375 из начала
    }
    val = '+375';
  }
  
  // Добавляем цифры после +375
  const afterPrefix = digits.replace(/^375/, ''); // Убираем 375 если есть в начале
  
  if (afterPrefix.length > 0) {
    val = '+375 ' + afterPrefix.slice(0, 2);
    if (afterPrefix.length > 2) {
      val += ' ' + afterPrefix.slice(2, 5);
    }
    if (afterPrefix.length > 5) {
      val += '-' + afterPrefix.slice(5, 7);
    }
    if (afterPrefix.length > 7) {
      val += '-' + afterPrefix.slice(7, 9);
    }
  }
  
  e.target.value = val;
});

// При фокусе на поле — если пусто, ставим +375
document.getElementById('f-phone').addEventListener('focus', (e) => {
  if (!e.target.value || e.target.value.trim() === '') {
    e.target.value = '+375 ';
  }
});

// Запрещаем удалять +375
document.getElementById('f-phone').addEventListener('keydown', (e) => {
  const val = e.target.value;
  const cursorPos = e.target.selectionStart;
  
  // Если пытаются удалить что-то из +375 (позиция курсора <= 4)
  if ((e.key === 'Backspace' || e.key === 'Delete') && cursorPos <= 4) {
    e.preventDefault();
  }
});

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
