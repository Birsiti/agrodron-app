<!DOCTYPE html>
<!--
  AgroDrone.BY · Статистика
  v2.0 · 2026-05-27
  Данные: ОБРАБОТКИ, КОМАНДИРОВКИ, РАСХОДЫ, ОПЕРАТОРЫ
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AgroDrone.BY · Статистика</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f5;--card:#fff;--green:#1b5935;--gm:#2a7a4a;--gl:#e8f4ed;--ga:#3aaa5e;
  --border:#e2e6ef;--t1:#1a1f2e;--t2:#5a6476;--t3:#9aa3b2;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);
  --r:14px;--rs:10px;--f:'Manrope',sans-serif;
  --amber:#d97706;--amber-light:#fef3c7;
  --red:#dc2626;--blue:#2563eb;--blue-light:#eff6ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--t1);max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}

.sub-hdr{background:var(--card);padding:12px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.back-btn{font-size:24px;cursor:pointer;color:var(--green);line-height:1;padding-right:4px;font-weight:300}
.hdr-title{font-size:16px;font-weight:800;color:var(--t1);flex:1}
.hdr-sub{font-size:11px;color:var(--t3)}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{padding:12px 12px 40px;display:flex;flex-direction:column;gap:10px}

/* HERO */
.hero{background:linear-gradient(135deg,var(--green),var(--gm));border-radius:var(--r);padding:18px;color:#fff}
.hero-title{font-size:10px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero-item .val{font-size:28px;font-weight:900;line-height:1;letter-spacing:-1px}
.hero-item .unit{font-size:11px;font-weight:500;opacity:.55;margin-left:2px}
.hero-item .lbl{font-size:10px;opacity:.5;margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.hero-divider{border:none;border-top:1px solid rgba(255,255,255,.15);margin:12px 0}
.hero-bottom{font-size:12px;color:rgba(255,255,255,.6)}
.hero-bottom b{color:#fff}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px}

/* METRICS GRID */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--card);border-radius:var(--rs);padding:14px;box-shadow:var(--sh)}
.metric-ico{font-size:20px;margin-bottom:6px}
.metric-val{font-size:22px;font-weight:900;color:var(--t1);letter-spacing:-1px;line-height:1}
.metric-val span{font-size:11px;font-weight:500;color:var(--t3);margin-left:2px}
.metric-lbl{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}

/* ROWS */
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.rl{font-size:13px;color:var(--t2)}
.rv{font-size:13px;font-weight:700;color:var(--t1)}
.rv.green{color:var(--green)}.rv.red{color:var(--red)}.rv.amber{color:var(--amber)}.rv.blue{color:var(--blue)}

/* BAR ROWS */
.bar-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.bar-row:last-child{border-bottom:none}
.bar-av{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;color:#fff}
.bar-info{flex:1;min-width:0}
.bar-name{font-size:13px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sub{font-size:10px;color:var(--t3);margin-top:2px}
.bar-right{text-align:right;flex-shrink:0}
.bar-val{font-size:14px;font-weight:800;color:var(--t1)}
.bar-bg{height:4px;background:#f0f4f8;border-radius:2px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:2px}

/* FINANCE CARD */
.fin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.fin-item{text-align:center;padding:10px 6px;background:#f8fafc;border-radius:var(--rs)}
.fin-val{font-size:16px;font-weight:800}
.fin-lbl{font-size:10px;color:var(--t3);font-weight:600;margin-top:3px;text-transform:uppercase}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10px;color:var(--t3);font-size:13px;font-weight:600}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--ga);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.empty{text-align:center;padding:20px;color:var(--t3);font-size:13px}
</style>
</head>
<body>

<div class="sub-hdr">
  <div class="back-btn" onclick="goBack()">‹</div>
  <div class="hdr-title">Статистика сезона</div>
  <div class="hdr-sub" id="upd-time"></div>
</div>

<div id="loading" class="loading">
  <div class="spinner"></div>
  Загружаю данные...
</div>

<div class="scroll" id="content" style="display:none">
<div class="wrap" id="root"></div>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
function goBack(){window.history.back();}

const OP_COLORS=['#3aaa5e','#2563eb','#d97706','#8b5cf6','#dc2626','#0891b2'];
const OP_NAMES={
  'Бруй Д.А.':'БД','Грибов К.М.':'ГК','Борисенок Л.И.':'БЛ',
  'Уманец А.И.':'УА','Бич Иван':'БИ','Ленский Александр':'ЛА'
};

function fmt(n,d=0){
  const v=Number(n||0);
  return isNaN(v)?'0':v.toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}

async function loadSheet(sheet){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheet)}`;
  const res=await fetch(url);
  const txt=await res.text();
  const json=JSON.parse(txt.replace(/^[^(]+\(/,'').replace(/\);?$/,''));
  const headers=json.table.cols.map(c=>c.label||'');
  const rows=json.table.rows.map(r=>r.c.map(c=>c?.v??''));
  return{headers,rows};
}

async function init(){
  try{
    const [obr,trips,expenses,operators]=await Promise.all([
      loadSheet('ОБРАБОТКИ'),
      loadSheet('КОМАНДИРОВКИ'),
      loadSheet('РАСХОДЫ')
    ]);

    // ── ОБРАБОТКИ ────────────────────────────────────────
    // A=ID B=Дата C=ID_заявки D=НП E=Культура F=Препарат G=Норма H=Га факт I=Борт J=Операторы
    let totalHa=0, obrCount=0;
    const opHa={}, droneHa={}, regionHa={}, cultureHa={};

    obr.rows.filter(r=>r[0]).forEach(r=>{
      const ha=parseFloat(r[7])||0;
      const ops=String(r[9]||'').trim();
      const drone=String(r[8]||'').trim();
      const region=String(r[3]||'').trim();
      const culture=String(r[4]||'').trim();
      totalHa+=ha; obrCount++;
      if(region) regionHa[region]=(regionHa[region]||0)+ha;
      if(culture&&culture!=='Другое') cultureHa[culture]=(cultureHa[culture]||0)+ha;
      if(ops){
        const list=ops.split(/[,;]+/).map(s=>s.trim()).filter(Boolean);
        list.forEach(op=>{ opHa[op]=(opHa[op]||0)+ha/list.length; });
      }
      if(drone){
        const list=drone.split(/[,+]+/).map(s=>s.trim()).filter(Boolean);
        list.forEach(d=>{ droneHa[d]=(droneHa[d]||0)+ha; });
      }
    });

    // ── КОМАНДИРОВКИ ─────────────────────────────────────
    // A=ID B=Дата откр C=Дата закр D=Район E=Состав F=Техника G=Аванс H=Потрачено I=Остаток J=Га N=Нал O=Безнал P=Аренда Q=Перенос
    let tripCount=0, totalSpent=0, totalNal=0, totalBeznal=0, totalRent=0, totalCarry=0;
    trips.rows.filter(r=>r[0]&&String(r[10]).includes('закрыта')).forEach(r=>{
      tripCount++;
      totalSpent+=(parseFloat(r[7])||0);
      totalNal+=(parseFloat(r[13])||0);
      totalBeznal+=(parseFloat(r[14])||0);
      totalRent+=(parseFloat(r[15])||0);
      totalCarry+=(parseFloat(r[16])||0);
    });

    // ── РАСХОДЫ ──────────────────────────────────────────
    // A=ID B=Командировка C=День D=Дата E=Тип оплаты F=Категория G=Сумма
    const catTotals={};
    expenses.rows.filter(r=>r[0]).forEach(r=>{
      const cat=String(r[5]||'').replace(/[🍽⛽🏨🪣🔧📦🚐]/g,'').trim();
      const sum=parseFloat(r[6])||0;
      if(cat) catTotals[cat]=(catTotals[cat]||0)+sum;
    });
    const totalExpenses=Object.values(catTotals).reduce((s,v)=>s+v,0);

    // ── Сортировки ───────────────────────────────────────
    const topOps=Object.entries(opHa).sort((a,b)=>b[1]-a[1]);
    const topDrones=Object.entries(droneHa).sort((a,b)=>b[1]-a[1]);
    const topRegions=Object.entries(regionHa).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const topCats=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const avgHa=obrCount>0?totalHa/obrCount:0;

    render({totalHa,obrCount,avgHa,tripCount,totalSpent,totalNal,totalBeznal,totalRent,totalCarry,totalExpenses,topOps,topDrones,topRegions,topCats,tripsData:trips.rows.filter(r=>r[0]&&String(r[10]).includes('закрыта'))});
    document.getElementById('upd-time').textContent=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});

  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML='<div style="color:var(--red);font-size:13px">❌ Ошибка загрузки</div>';
  }
}

function fmtD(v){
  if(!v)return'—';
  if(typeof v==='number'){
    const d=new Date(Math.round((v-25569)*86400*1000));
    return d.getDate().toString().padStart(2,'0')+'.'+(d.getMonth()+1).toString().padStart(2,'0')+'.'+d.getFullYear().toString().slice(2)+' ';
  }
  const s=String(v).trim();
  const m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  if(m)return m[1]+'.'+m[2]+'.'+m[3].slice(2)+' ';
  return s+' ';
}

function render(d){
  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='flex';

  const maxOp=d.topOps[0]?.[1]||1;
  const maxDrone=d.topDrones[0]?.[1]||1;
  const maxReg=d.topRegions[0]?.[1]||1;

  document.getElementById('root').innerHTML=`

    <!-- HERO -->
    <div class="hero">
      <div class="hero-title">Сезон 2026 — итого</div>
      <div class="hero-grid">
        <div class="hero-item">
          <div class="val">${fmt(d.totalHa)}<span class="unit">га</span></div>
          <div class="lbl">Обработано</div>
        </div>
        <div class="hero-item">
          <div class="val">${d.obrCount}<span class="unit">шт</span></div>
          <div class="lbl">Обработок</div>
        </div>
        <div class="hero-item">
          <div class="val">${d.tripCount}<span class="unit">вып</span></div>
          <div class="lbl">Командировок</div>
        </div>
      </div>
      <hr class="hero-divider">
      <div class="hero-bottom">Среднее поле: <b>${fmt(d.avgHa,1)} га</b> · Расходы: <b>${fmt(d.totalSpent)} BYN</b></div>
    </div>

    <!-- МЕТРИКИ -->
    <div class="metrics">
      <div class="metric">
        <div class="metric-ico">💵</div>
        <div class="metric-val">${fmt(d.totalNal)}<span>BYN</span></div>
        <div class="metric-lbl">Нал расходы</div>
      </div>
      <div class="metric">
        <div class="metric-ico">💳</div>
        <div class="metric-val">${fmt(d.totalBeznal)}<span>BYN</span></div>
        <div class="metric-lbl">Безнал АТК</div>
      </div>
      <div class="metric">
        <div class="metric-ico">🚐</div>
        <div class="metric-val">${fmt(d.totalRent)}<span>BYN</span></div>
        <div class="metric-lbl">Аренда авто</div>
      </div>
      <div class="metric">
        <div class="metric-ico">➡️</div>
        <div class="metric-val">${fmt(d.totalCarry)}<span>BYN</span></div>
        <div class="metric-lbl">Перенос нала</div>
      </div>
    </div>

    <!-- ОПЕРАТОРЫ -->
    <div class="card">
      <div class="card-title">👥 Га по операторам</div>
      ${d.topOps.length?d.topOps.map(([op,ha],i)=>{
        const initials=OP_NAMES[op]||(op.split(' ').map(s=>s[0]).join('').slice(0,2));
        const color=OP_COLORS[i%OP_COLORS.length];
        const pct=Math.round(ha/maxOp*100);
        return `<div class="bar-row">
          <div class="bar-av" style="background:${color}">${initials}</div>
          <div class="bar-info">
            <div class="bar-name">${op}</div>
            <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
          </div>
          <div class="bar-right"><div class="bar-val">${fmt(ha,1)} га</div></div>
        </div>`;
      }).join(''):`<div class="empty">Нет данных</div>`}
    </div>

    <!-- БОРТЫ -->
    <div class="card">
      <div class="card-title">🚁 Борты</div>
      ${d.topDrones.length?d.topDrones.map(([drone,ha],i)=>{
        const color=OP_COLORS[i%OP_COLORS.length];
        const pct=Math.round(ha/maxDrone*100);
        return `<div class="bar-row">
          <div class="bar-av" style="background:${color};font-size:9px">${drone.replace('А','A').slice(0,4)}</div>
          <div class="bar-info">
            <div class="bar-name">${drone}</div>
            <div class="bar-sub">~${fmt(ha/12,0)} ч налёта</div>
            <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
          </div>
          <div class="bar-right"><div class="bar-val">${fmt(ha,1)} га</div></div>
        </div>`;
      }).join(''):`<div class="empty">Нет данных</div>`}
    </div>

    <!-- РАЙОНЫ -->
    <div class="card">
      <div class="card-title">📍 Топ районов</div>
      ${d.topRegions.length?d.topRegions.map(([reg,ha],i)=>{
        const pct=Math.round(ha/maxReg*100);
        return `<div class="bar-row">
          <div class="bar-av" style="background:var(--green);font-size:12px;font-weight:900">${i+1}</div>
          <div class="bar-info">
            <div class="bar-name">${reg}</div>
            <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:var(--ga)"></div></div>
          </div>
          <div class="bar-right"><div class="bar-val">${fmt(ha,1)} га</div></div>
        </div>`;
      }).join(''):`<div class="empty">Нет данных</div>`}
    </div>

    <!-- РАСХОДЫ ПО КАТЕГОРИЯМ -->
    <div class="card">
      <div class="card-title">💸 Расходы по категориям</div>
      ${d.topCats.length?d.topCats.map(([cat,sum])=>`
        <div class="row">
          <span class="rl">${cat||'Прочее'}</span>
          <span class="rv">${fmt(sum)} BYN</span>
        </div>`).join(''):`<div class="empty">Нет данных</div>`}
      <div class="row" style="border-top:2px solid var(--border);margin-top:4px;padding-top:8px">
        <span class="rl" style="font-weight:700">Итого расходов</span>
        <span class="rv red">${fmt(d.totalExpenses)} BYN</span>
      </div>
    </div>

    <!-- ИСТОРИЯ КОМАНДИРОВОК -->
    <div class="card">
      <div class="card-title">🚐 История командировок</div>
      ${d.tripsData.length?[...d.tripsData].reverse().map(r=>{
        const id=String(r[0]);
        const district=String(r[3]||'—');
        const dateStart=fmtD(r[1]);
        const dateEnd=fmtD(r[2]);
        const ha=parseFloat(r[9])||0;
        const spent=parseFloat(r[7])||0;
        const advance=parseFloat(r[6])||0;
        const balance=advance-spent;
        return `<div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div>
              <div style="font-size:12px;font-weight:800;color:var(--t1)">${district}</div>
              <div style="font-size:10px;color:var(--t3)">${id} · ${dateStart}→${dateEnd}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:14px;font-weight:800;color:var(--green)">${fmt(ha,1)} га</div>
              <div style="font-size:10px;color:${balance>=0?'var(--green)':'var(--red)'};font-weight:700">${balance>=0?'+':''}${fmt(balance)} BYN</div>
            </div>
          </div>
          <div style="display:flex;gap:12px;font-size:10px;color:var(--t3)">
            <span>💰 Аванс: ${fmt(advance)}</span>
            <span>💸 Расходы: ${fmt(spent)}</span>
          </div>
        </div>`;
      }).join(''):`<div class="empty">Нет закрытых командировок</div>`}
    </div>

  `;
}

init();
</script>
</body>
</html>
