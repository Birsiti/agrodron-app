<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крафтер — Учёт</title>
<style>
  /* ── Tokens ── */
  :root {
    --bg:        #F7F8FA;
    --surface:   #FFFFFF;
    --border:    #E4E7EC;
    --text:      #1A1D23;
    --muted:     #6B7280;
    --accent:    #2563EB;
    --green:     #16A34A;
    --red:       #DC2626;
    --orange:    #EA580C;
    --radius:    10px;
    --font:      'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-icon {
    width: 32px; height: 32px;
    background: #1A1D23;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .header h1 { font-size: 15px; font-weight: 600; }
  .header small { font-size: 11px; color: var(--muted); display: block; }

  /* ── Main ── */
  .main { padding: 14px 12px; max-width: 600px; margin: 0 auto; }

  /* ── Summary cards ── */
  .summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  .card.wide { grid-column: 1 / -1; }
  .card-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-bottom: 4px;
  }
  .card-value {
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
  }
  .card-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .positive { color: var(--green); }
  .negative { color: var(--red); }

  /* Баланс-карточка */
  .balance-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .balance-label { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .balance-value { font-size: 28px; font-weight: 800; }
  .balance-breakdown { font-size: 11px; color: var(--muted); text-align: right; line-height: 1.6; }

  /* ── Section title ── */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ── Table ── */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .tbl td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    vertical-align: middle;
  }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr:hover td { background: #F9FAFB; }

  /* Тип-бейдж */
  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge-trip    { background: #EFF6FF; color: #1D4ED8; }
  .badge-mileage { background: #F0FDF4; color: #15803D; }
  .badge-repair  { background: #FEF2F2; color: #B91C1C; }
  .badge-fuel    { background: #FFF7ED; color: #C2410C; }

  .amount-pos { color: var(--green); font-weight: 600; }
  .amount-neg { color: var(--red);   font-weight: 600; }
  .source-auto { font-size: 10px; color: var(--muted); }

  .empty-row td { text-align: center; color: var(--muted); padding: 24px; font-size: 13px; }

  /* ── Form ── */
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
  }
  .form-row { margin-bottom: 10px; }
  .form-row label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .form-row input,
  .form-row select,
  .form-row textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 11px;
    font-size: 14px;
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color .15s;
  }
  .form-row input:focus,
  .form-row select:focus,
  .form-row textarea:focus { border-color: var(--accent); background: #fff; }
  .form-row textarea { resize: vertical; min-height: 60px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* Динамические поля */
  .extra-fields { display: none; }
  .extra-fields.visible { display: block; }

  /* ── Btn ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: opacity .15s;
  }
  .btn:active { opacity: .8; }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; justify-content: center; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1A1D23; color: #fff;
    padding: 10px 18px; border-radius: 8px;
    font-size: 13px; font-weight: 500;
    opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ── Loader ── */
  .loader { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; }
  .spin {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    display: inline-block; vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Фильтры */
  .filters {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;
  }
  .filter-btn {
    padding: 4px 10px; border-radius: 20px; font-size: 12px;
    border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; color: var(--muted); font-weight: 500;
    transition: all .15s;
  }
  .filter-btn.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🚐</div>
  <div>
    <h1>VW Crafter — Учёт</h1>
    <small>AP 4246-7 | Передан АТК в безвозмездное пользование</small>
  </div>
</div>

<div class="main">

  <!-- Сводка -->
  <div id="summaryBlock">
    <div class="loader"><span class="spin"></span>Загружаю данные…</div>
  </div>

  <!-- Записи -->
  <div class="section-title">
    <span>Все записи</span>
    <span id="recordCount" style="font-weight:400"></span>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="trip">Командировки</button>
    <button class="filter-btn" data-filter="mileage">Выезды</button>
    <button class="filter-btn" data-filter="repair">Ремонт</button>
    <button class="filter-btn" data-filter="fuel">Заправки</button>
  </div>

  <div class="table-wrap">
    <table class="tbl">
      <thead>
        <tr>
          <th>Дата</th>
          <th>Тип</th>
          <th>Описание</th>
          <th>Км</th>
          <th>Сумма</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="empty-row"><td colspan="5"><span class="spin"></span></td></tr>
      </tbody>
    </table>
  </div>

  <!-- Форма добавления -->
  <div class="section-title" style="margin-top:4px">Добавить запись</div>
  <div class="form-card">
    <div class="form-row">
      <label>Тип</label>
      <select id="fType" onchange="onTypeChange()">
        <option value="mileage">🟢 Выезд (пробег)</option>
        <option value="repair">🔴 Ремонт</option>
        <option value="fuel">🟠 Заправка</option>
      </select>
    </div>

    <div class="form-grid">
      <div class="form-row">
        <label>Дата</label>
        <input type="date" id="fDate">
      </div>
      <div class="form-row" id="fKmRow">
        <label>Пробег (км)</label>
        <input type="number" id="fKm" placeholder="100" min="0">
      </div>
    </div>

    <div class="form-row" id="fDescRow">
      <label>Маршрут / описание</label>
      <input type="text" id="fDesc" placeholder="Боровляны → Камень → Боровляны">
    </div>

    <div class="form-row extra-fields" id="fAmountRow">
      <label>Сумма (BYN)</label>
      <input type="number" id="fAmount" placeholder="0.00" step="0.01" min="0">
    </div>

    <div class="form-row extra-fields" id="fLitersRow">
      <label>Литры</label>
      <input type="number" id="fLiters" placeholder="60" step="0.1" min="0">
    </div>

    <div class="form-row">
      <label>Примечание (необязательно)</label>
      <textarea id="fNote" placeholder=""></textarea>
    </div>

    <button class="btn btn-primary" onclick="saveRecord()">
      <span>💾</span> Сохранить
    </button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ──
const SCRIPT_URL  = 'https://agrodrone-proxy.birsiti.workers.dev';
const SHEET_ID    = '1NzeC5jdm5osCHFQVSHKpUGMkWT2xI6xTjwl7LMRLHWU';
const SHEETS_KEY  = 'AIzaSyAxiaO9KgDN277ibcLCfXHAc2VpSSeQMDg';
const RATE_PER_DAY = 150; // BYN/сутки

// ── State ──
let allRecords = [];
let currentFilter = 'all';

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  setDefaultDate();
  loadAll();
  initFilters();
});

function setDefaultDate() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('fDate').value = today;
}

function initFilters() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderTable();
    });
  });
}

// ── Load all data ──
async function loadAll() {
  try {
    const [trips, manual] = await Promise.all([
      loadTrips(),
      loadManual()
    ]);

    // Объединяем и сортируем по дате
    allRecords = [...trips, ...manual].sort((a, b) => new Date(b.dateSort) - new Date(a.dateSort));
    renderSummary();
    renderTable();
  } catch(e) {
    document.getElementById('summaryBlock').innerHTML =
      `<div class="loader" style="color:var(--red)">Ошибка загрузки: ${e.message}</div>`;
  }
}

// Командировки где авто = Crafter
async function loadTrips() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/КОМАНДИРОВКИ?key=${SHEETS_KEY}`;
  const r = await fetch(url);
  const d = await r.json();
  const rows = d.values || [];
  if (!rows.length) return [];

  const h = rows[0];
  const IDX = {
    id:       h.indexOf('ID'),
    dateFrom: h.indexOf('Дата откр.'),
    dateTo:   h.indexOf('Дата закр.'),
    district: h.indexOf('Район'),
    car:      h.indexOf('Авто'),
  };

  const results = [];
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row[IDX.id]) continue;
    let carData = {};
    try { carData = JSON.parse(row[IDX.car] || '{}'); } catch(e) {}
    const carStr = (carData.car || '').toLowerCase();
    const plate=String(carData.plate||'').replace(/\s/g,'');if(!plate.includes('AP 4246-7')&&!plate.includes('AP4246-7')) continue;
    const dFrom = parseDate(row[IDX.dateFrom]);
    const dTo   = parseDate(row[IDX.dateTo]);
    if (!dFrom) continue;

    const days = daysBetween(dFrom, dTo || dFrom);
    results.push({
      type:     'trip',
      dateSort: dFrom.toISOString(),
      dateDisp: formatDateDisp(dFrom),
      desc:     `${row[IDX.district]} | ${row[IDX.id]}`,
      km:       '',
      amount:   days * RATE_PER_DAY,
      days,
      source:   'авто',
      id:       row[IDX.id],
    });
  }
  return results;
}

// Ручные записи из листа КРАФТЕР
async function loadManual() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/КРАФТЕР?key=${SHEETS_KEY}`;
  try {
    const r = await fetch(url);
    const d = await r.json();
    const rows = d.values || [];
    if (rows.length < 2) return [];

    const h = rows[0];
    const IDX = {
      id:     h.indexOf('ID'),
      date:   h.indexOf('Дата'),
      type:   h.indexOf('Тип'),
      desc:   h.indexOf('Описание'),
      km:     h.indexOf('Км'),
      amount: h.indexOf('Сумма'),
      liters: h.indexOf('Литры'),
      note:   h.indexOf('Примечание'),
    };

    return rows.slice(1).filter(r => r[IDX.date]).map(row => {
      const d = parseDate(row[IDX.date]);
      const type = row[IDX.type] || 'mileage';
      const amount = parseFloat(row[IDX.amount]) || 0;
      return {
        type,
        dateSort: d ? d.toISOString() : row[IDX.date],
        dateDisp: d ? formatDateDisp(d) : row[IDX.date],
        desc:     row[IDX.desc] || '',
        km:       row[IDX.km] || '',
        amount:   type === 'mileage' ? 0 : amount,
        expense:  (type === 'repair' || type === 'fuel') ? amount : 0,
        liters:   row[IDX.liters] || '',
        note:     row[IDX.note] || '',
        source:   'ручной',
        id:       row[IDX.id] || '',
      };
    });
  } catch(e) {
    return []; // Лист ещё не создан — ок
  }
}

// ── Render Summary ──
function renderSummary() {
  const trips   = allRecords.filter(r => r.type === 'trip');
  const repairs = allRecords.filter(r => r.type === 'repair');
  const fuels   = allRecords.filter(r => r.type === 'fuel');
  const mileage = allRecords.filter(r => r.type === 'mileage');

  const totalDays    = trips.reduce((s, r) => s + (r.days || 0), 0);
  const accrued      = totalDays * RATE_PER_DAY;
  const repairCost   = repairs.reduce((s, r) => s + (r.expense || r.amount || 0), 0);
  const fuelCost     = fuels.reduce((s, r) => s + (r.expense || r.amount || 0), 0);
  const totalExpense = repairCost + fuelCost;
  const balance      = accrued - totalExpense;
  const totalKm      = mileage.reduce((s, r) => s + (parseFloat(r.km) || 0), 0);

  const balClass = balance >= 0 ? 'positive' : 'negative';
  const balSign  = balance >= 0 ? '+' : '';

  document.getElementById('summaryBlock').innerHTML = `
    <div class="balance-card">
      <div>
        <div class="balance-label">Баланс по крафтеру</div>
        <div class="balance-value ${balClass}">${balSign}${fmt(balance)} BYN</div>
      </div>
      <div class="balance-breakdown">
        Начислено: ${fmt(accrued)} BYN<br>
        Ремонт: −${fmt(repairCost)} BYN<br>
        Топливо: −${fmt(fuelCost)} BYN
      </div>
    </div>

    <div class="summary">
      <div class="card">
        <div class="card-label">Суток у АТК</div>
        <div class="card-value">${totalDays}</div>
        <div class="card-sub">${trips.length} командировок × 150 BYN</div>
      </div>
      <div class="card">
        <div class="card-label">Начислено</div>
        <div class="card-value positive">${fmt(accrued)}</div>
        <div class="card-sub">BYN</div>
      </div>
      <div class="card">
        <div class="card-label">Ремонт</div>
        <div class="card-value ${repairCost > 0 ? 'negative' : ''}">${fmt(repairCost)}</div>
        <div class="card-sub">BYN · ${repairs.length} записей</div>
      </div>
      <div class="card">
        <div class="card-label">Доп. пробег</div>
        <div class="card-value">${totalKm}</div>
        <div class="card-sub">км · ${mileage.length} выездов</div>
      </div>
    </div>
  `;
}

// ── Render Table ──
function renderTable() {
  const filtered = currentFilter === 'all'
    ? allRecords
    : allRecords.filter(r => r.type === currentFilter);

  document.getElementById('recordCount').textContent =
    `${filtered.length} из ${allRecords.length}`;

  const tbody = document.getElementById('tableBody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="5">Записей нет</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(r => {
    const badge = badgeHtml(r.type);
    const km    = r.km ? `${r.km} км` : '—';
    const amt   = (r.type === 'repair' || r.type === 'fuel')
      ? `<span class="amount-neg">−${fmt(r.expense || r.amount)}</span>`
      : r.type === 'trip'
        ? `<span class="amount-pos">+${fmt(r.amount)}</span>`
        : '—';
    const src = r.source === 'авто'
      ? `<br><span class="source-auto">из таблицы</span>` : '';

    return `<tr>
      <td>${r.dateDisp}${src}</td>
      <td>${badge}</td>
      <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.desc}">${r.desc}</td>
      <td>${km}</td>
      <td>${amt}</td>
    </tr>`;
  }).join('');
}

function badgeHtml(type) {
  const map = {
    trip:    ['badge-trip',    'Команд.'],
    mileage: ['badge-mileage', 'Выезд'],
    repair:  ['badge-repair',  'Ремонт'],
    fuel:    ['badge-fuel',    'Заправка'],
  };
  const [cls, label] = map[type] || ['', type];
  return `<span class="badge ${cls}">${label}</span>`;
}

// ── Form ──
function onTypeChange() {
  const type = document.getElementById('fType').value;
  const amountRow = document.getElementById('fAmountRow');
  const litersRow = document.getElementById('fLitersRow');
  const kmRow     = document.getElementById('fKmRow');
  const descEl    = document.getElementById('fDesc');

  amountRow.classList.toggle('visible', type === 'repair' || type === 'fuel');
  litersRow.classList.toggle('visible', type === 'fuel');
  kmRow.style.display = type === 'mileage' ? '' : 'none';

  if (type === 'mileage') descEl.placeholder = 'Боровляны → Камень → Боровляны';
  else if (type === 'repair') descEl.placeholder = 'Замена колодок';
  else descEl.placeholder = 'ДТ, АЗС Белоруснефть';
}

async function saveRecord() {
  const type   = document.getElementById('fType').value;
  const date   = document.getElementById('fDate').value;
  const desc   = document.getElementById('fDesc').value.trim();
  const km     = document.getElementById('fKm').value;
  const amount = document.getElementById('fAmount').value;
  const liters = document.getElementById('fLiters').value;
  const note   = document.getElementById('fNote').value.trim();

  if (!date || !desc) { showToast('Заполни дату и описание', true); return; }

  const payload = {
    action: 'addCrafterRecord',
    data: { type, date, desc, km, amount, liters, note }
  };

  const btn = document.querySelector('.btn-primary');
  btn.disabled = true; btn.textContent = 'Сохраняю…';

  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    const d = await r.json();
    const res = d.result?.result || d.result || d;
    if (res.ok) {
      showToast('Сохранено ✓');
      clearForm();
      await loadAll();
    } else {
      showToast(res.error || 'Ошибка', true);
    }
  } catch(e) {
    showToast('Ошибка сети', true);
  } finally {
    btn.disabled = false; btn.textContent = '💾 Сохранить';
  }
}

function clearForm() {
  document.getElementById('fDesc').value   = '';
  document.getElementById('fKm').value     = '';
  document.getElementById('fAmount').value = '';
  document.getElementById('fLiters').value = '';
  document.getElementById('fNote').value   = '';
  setDefaultDate();
}

// ── Helpers ──
function parseDate(val) {
  if (!val) return null;
  if (val instanceof Date) return val;
  // DD.MM.YYYY
  const m = String(val).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  const d = new Date(val);
  return isNaN(d) ? null : d;
}

function daysBetween(d1, d2) {
  return Math.round(Math.abs(d2 - d1) / 86400000) + 1;
}

function formatDateDisp(d) {
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'2-digit' });
}

function fmt(n) {
  return Number(n).toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isErr ? 'var(--red)' : '#1A1D23';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
