<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AgroDrone.BY · Менеджер</title>
<!-- AD_manager.html | май 2026 | v4.0 — дашборд + табы + карта -->
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f5;--card:#fff;--acc:#1a3a6b;--acm:#15306a;--acl:#e8eef8;--aca:#3a6aee;
  --green:#1b5935;--gl:#e8f4ed;--ga:#3aaa5e;
  --border:#e2e6ef;--t1:#1a1f2e;--t2:#5a6476;--t3:#9aa3b2;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);
  --r:14px;--rs:10px;--f:'Manrope',sans-serif;
  --amber:#d97706;--red:#dc2626;--purple:#8b5cf6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--t1);max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}

/* Header */
.app-hdr{background:linear-gradient(135deg,var(--acc),var(--acm));padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand-ico{width:40px;height:40px;background:rgba(255,255,255,.2);border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-ico svg{width:24px;height:24px}
.brand-name{font-size:18px;font-weight:800;color:#fff;line-height:1.1}
.brand-name em{font-style:normal;color:#a5c8ff}
.brand-sub{font-size:11px;color:rgba(255,255,255,.8);margin-top:2px}
.mgr-chip{font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.25);color:#fff}

/* Dashboard */
.dash{padding:12px;background:var(--card);border-bottom:1px solid var(--border)}
.dash-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.dash-row:last-child{margin-bottom:0}
.dbox{background:linear-gradient(135deg,#f8fafc,#fff);border:1.5px solid var(--border);border-radius:var(--rs);padding:12px 10px;text-align:center}
.dbox-num{font-size:22px;font-weight:800;color:var(--acc);line-height:1}
.dbox-lbl{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-top:5px}
.dbox-sub{font-size:10px;color:var(--t2);margin-top:2px}
.dbox.rev .dbox-num{color:var(--green)}

/* Tabs */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:0 12px;gap:4px}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--t3);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.tab:active{transform:scale(.96)}

/* Scroll */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px}

/* Filter */
.filter-bar{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.filter-bar::-webkit-scrollbar{display:none}
.fbtn{padding:8px 14px;border-radius:20px;background:var(--card);border:1.5px solid var(--border);font-size:11px;font-weight:700;color:var(--t2);white-space:nowrap;cursor:pointer;transition:all .2s;flex-shrink:0}
.fbtn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.fbtn:active{transform:scale(.96)}

/* Field card */
.field-card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:8px;border-left:4px solid var(--border);cursor:pointer;transition:all .2s}
.field-card:active{transform:scale(.99)}
.field-card.st-new{border-left-color:var(--amber)}
.field-card.st-ok{border-left-color:var(--aca)}
.field-card.st-done{border-left-color:var(--ga)}
.field-card.st-work{border-left-color:var(--purple)}
.fc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.fc-name{font-size:15px;font-weight:800;color:var(--t1);flex:1;min-width:0}
.fc-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;flex-shrink:0;margin-left:8px}
.b-new{background:#fef3c7;color:#92400e}
.b-ok{background:var(--acl);color:var(--acc)}
.b-done{background:var(--gl);color:var(--green)}
.b-work{background:#f5f3ff;color:#6d28d9}
.fc-meta{font-size:12px;color:var(--t3);margin-bottom:8px}
.fc-data{display:flex;gap:14px;font-size:12px;color:var(--t3)}
.fc-data span{font-weight:700;color:var(--t2)}

/* Operator card */
.op-card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:8px;cursor:pointer;transition:all .2s}
.op-card:active{transform:scale(.99)}
.op-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.op-name{font-size:15px;font-weight:800;color:var(--t1)}
.op-id{font-size:11px;font-weight:700;color:var(--t3);background:var(--bg);padding:3px 10px;border-radius:20px}
.op-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.op-stat{text-align:center}
.op-stat-num{font-size:18px;font-weight:800;color:var(--acc)}
.op-stat-lbl{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.op-type{font-size:11px;color:var(--t2);margin-top:6px}
.op-type.wr{color:var(--amber);font-weight:700}

/* Map */
#map{width:100%;height:400px;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}

/* Loading/Empty */
.loading{text-align:center;padding:30px;color:var(--t3);font-size:13px}
.empty{text-align:center;padding:40px 20px}
.empty-ico{font-size:40px;margin-bottom:10px;opacity:.4}
.empty-t{font-size:14px;font-weight:700;color:var(--t2);margin-bottom:4px}
.empty-s{font-size:12px;color:var(--t3)}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(26,31,46,.95);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:999;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;max-width:90%}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="app-hdr">
  <div class="brand">
    <div class="brand-ico"><svg fill="#fff" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/><path d="M7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/></svg></div>
    <div><div class="brand-name">Agro<em>Drone</em>.BY</div><div class="brand-sub">Менеджер АТК</div></div>
  </div>
  <div class="mgr-chip">v4.0</div>
</div>

<!-- Dashboard -->
<div class="dash">
  <div class="dash-row">
    <div class="dbox"><div class="dbox-num" id="d-today-ha">—</div><div class="dbox-lbl">Сегодня</div><div class="dbox-sub">га</div></div>
    <div class="dbox"><div class="dbox-num" id="d-today-fields">—</div><div class="dbox-lbl">Сегодня</div><div class="dbox-sub">полей</div></div>
    <div class="dbox"><div class="dbox-num" id="d-today-ops">—</div><div class="dbox-lbl">Сегодня</div><div class="dbox-sub">операторов</div></div>
  </div>
  <div class="dash-row">
    <div class="dbox"><div class="dbox-num" id="d-week-ha">—</div><div class="dbox-lbl">Неделя</div><div class="dbox-sub">га</div></div>
    <div class="dbox rev"><div class="dbox-num" id="d-week-rev">—</div><div class="dbox-lbl">Неделя</div><div class="dbox-sub">BYN</div></div>
    <div class="dbox"><div class="dbox-num" id="d-week-fields">—</div><div class="dbox-lbl">Неделя</div><div class="dbox-sub">полей</div></div>
  </div>
  <div class="dash-row">
    <div class="dbox"><div class="dbox-num" id="d-season-ha">—</div><div class="dbox-lbl">Сезон</div><div class="dbox-sub">га</div></div>
    <div class="dbox"><div class="dbox-num" id="d-season-flights">—</div><div class="dbox-lbl">Сезон</div><div class="dbox-sub">полётов</div></div>
    <div class="dbox"><div class="dbox-num" id="d-season-clients">—</div><div class="dbox-lbl">Сезон</div><div class="dbox-sub">клиентов</div></div>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('fields')">Поля</div>
  <div class="tab" onclick="switchTab('operators')">Операторы</div>
  <div class="tab" onclick="switchTab('map')">🗺 Карта</div>
</div>

<!-- Scroll container -->
<div class="scroll" id="content">
  
  <!-- Tab: Fields -->
  <div id="tab-fields">
    <div class="filter-bar">
      <div class="fbtn active" onclick="filterFields('all')">Все</div>
      <div class="fbtn" onclick="filterFields('новое')">🔵 Новые</div>
      <div class="fbtn" onclick="filterFields('подтверждено')">🟠 Подтверждено</div>
      <div class="fbtn" onclick="filterFields('в работе')">🟣 В работе</div>
      <div class="fbtn" onclick="filterFields('готово')">🟢 Готово</div>
    </div>
    <div id="fields-list"></div>
  </div>

  <!-- Tab: Operators -->
  <div id="tab-operators" style="display:none">
    <div id="operators-list"></div>
  </div>

  <!-- Tab: Map -->
  <div id="tab-map" style="display:none">
    <div style="font-size:11px;color:var(--t3);margin-bottom:8px;text-align:center">
      🔵 Новое · 🟠 Подтверждено · 🟣 В работе · 🟢 Готово
    </div>
    <div id="map"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://maps.googleapis.com/maps/api/js?key=${MAPS_KEY}&libraries=geometry"></script>
<script>
let allFields = [];
let allObrabotki = [];
let allOperators = [];
let currentFilter = 'all';
let map, markers = [];

// API
async function api(action, data) {
  const r = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, data })
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

// Load all data
async function loadAllData() {
  try {
    // Fields
    const fRes = await api('get_fields_list', {});
    allFields = fRes.fields || [];
    
    // Obrabotki
    const oRes = await api('get_obrabotki', {});
    allObrabotki = oRes.obrabotki || [];
    
    // Operators
    const opRes = await api('get_operators', { status: 'Активен' });
    allOperators = opRes.operators || [];
    
    calculateDashboard();
    renderFields();
    renderOperators();
    initMap();
  } catch(e) {
    showToast('❌ Ошибка загрузки: ' + e.message);
  }
}

// Calculate dashboard stats
function calculateDashboard() {
  const now = new Date();
  const today = now.toISOString().split('T')[0].split('-').reverse().join('.');
  
  // Today
  const todayOb = allObrabotki.filter(o => o['Дата закрытия'] === today);
  const todayHa = todayOb.reduce((s,o) => s + parseNum(o['Га факт']), 0);
  const todayFields = todayOb.length;
  const todayOps = new Set(todayOb.map(o => o['Операторы'])).size;
  
  document.getElementById('d-today-ha').textContent = todayHa.toFixed(1);
  document.getElementById('d-today-fields').textContent = todayFields;
  document.getElementById('d-today-ops').textContent = todayOps;
  
  // Week (last 7 days)
  const weekAgo = new Date(now - 7*24*60*60*1000);
  const weekOb = allObrabotki.filter(o => {
    if (!o['Дата закрытия']) return false;
    const parts = o['Дата закрытия'].split('.');
    if (parts.length !== 3) return false;
    const d = new Date(parts[2], parts[1]-1, parts[0]);
    return d >= weekAgo;
  });
  const weekHa = weekOb.reduce((s,o) => s + parseNum(o['Га факт']), 0);
  const weekRev = Math.round(weekHa * 28);
  const weekFields = weekOb.length;
  
  document.getElementById('d-week-ha').textContent = weekHa.toFixed(1);
  document.getElementById('d-week-rev').textContent = weekRev.toLocaleString();
  document.getElementById('d-week-fields').textContent = weekFields;
  
  // Season
  const seasonHa = allObrabotki.reduce((s,o) => s + parseNum(o['Га факт']), 0);
  const seasonFlights = allObrabotki.length;
  const seasonClients = new Set(allFields.map(f => f['ID клиента'])).size;
  
  document.getElementById('d-season-ha').textContent = seasonHa.toFixed(1);
  document.getElementById('d-season-flights').textContent = seasonFlights;
  document.getElementById('d-season-clients').textContent = seasonClients;
}

// Parse number (handle comma as decimal separator)
function parseNum(val) {
  if (!val) return 0;
  const str = String(val).replace(',', '.');
  const num = parseFloat(str);
  return isNaN(num) ? 0 : num;
}

// Tab switch
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  
  document.getElementById('tab-fields').style.display = 'none';
  document.getElementById('tab-operators').style.display = 'none';
  document.getElementById('tab-map').style.display = 'none';
  
  if (tab === 'fields') {
    document.getElementById('tab-fields').style.display = 'block';
  } else if (tab === 'operators') {
    document.getElementById('tab-operators').style.display = 'block';
  } else if (tab === 'map') {
    document.getElementById('tab-map').style.display = 'block';
    setTimeout(() => { if (map) google.maps.event.trigger(map, 'resize'); }, 100);
  }
}

// Filter fields
function filterFields(f) {
  currentFilter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderFields();
}

// Render fields
function renderFields() {
  const wrap = document.getElementById('fields-list');
  let filtered = allFields;
  
  if (currentFilter !== 'all') {
    filtered = allFields.filter(f => f['Статус'] === currentFilter);
  }
  
  if (!filtered.length) {
    wrap.innerHTML = '<div class="empty"><div class="empty-ico">🌾</div><div class="empty-t">Нет полей</div><div class="empty-s">В этом статусе пусто</div></div>';
    return;
  }
  
  wrap.innerHTML = filtered.map(f => {
    const statusMap = {
      'новое': { cls:'st-new', badge:'b-new', label:'Новое' },
      'подтверждено': { cls:'st-ok', badge:'b-ok', label:'Подтверждено' },
      'в работе': { cls:'st-work', badge:'b-work', label:'В работе' },
      'готово': { cls:'st-done', badge:'b-done', label:'Готово' }
    };
    const st = statusMap[f['Статус']] || statusMap['новое'];
    
    return `<div class="field-card ${st.cls}">
      <div class="fc-head">
        <div class="fc-name">${f['Название поля'] || '—'}</div>
        <span class="fc-badge ${st.badge}">${st.label}</span>
      </div>
      <div class="fc-meta">${f['Районный центр'] || '—'} · ${f['Культура'] || '—'}${f['Препарат'] ? ' · ' + f['Препарат'] : ''}</div>
      <div class="fc-data">
        <div>📐 <span>${parseNum(f['Площадь га'])} га</span></div>
        <div>💧 <span>${f['Норма л/га'] || '—'} л/га</span></div>
        ${f['Дата закрытия'] ? `<div>✅ <span>${f['Дата закрытия']}</span></div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// Render operators
function renderOperators() {
  const wrap = document.getElementById('operators-list');
  
  if (!allOperators.length) {
    wrap.innerHTML = '<div class="empty"><div class="empty-ico">👥</div><div class="empty-t">Нет операторов</div></div>';
    return;
  }
  
  wrap.innerHTML = allOperators.map(o => {
    const isWR = String(o['Тип'] || '').includes('WR');
    return `<div class="op-card">
      <div class="op-head">
        <div class="op-name">${o['ФИО']}</div>
        <div class="op-id">${o['ID']}</div>
      </div>
      ${isWR ? '<div class="op-type wr">🟠 Подрядчик (WR)</div>' : '<div class="op-type">🟢 АТК</div>'}
      <div class="op-stats">
        <div class="op-stat"><div class="op-stat-num">${parseNum(o['Га за сезон'])}</div><div class="op-stat-lbl">га</div></div>
        <div class="op-stat"><div class="op-stat-num">${o['Выездов'] || 0}</div><div class="op-stat-lbl">выездов</div></div>
        <div class="op-stat"><div class="op-stat-num">${o['Часов налёта'] || 0}</div><div class="op-stat-lbl">часов</div></div>
      </div>
      <div style="font-size:11px;color:var(--t3);margin-top:8px;text-align:center">Район: ${o['Район РБ'] || '—'}${o['Роль'] ? ' · ' + o['Роль'] : ''}</div>
    </div>`;
  }).join('');
}

// Init map
function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 53.9, lng: 27.56 },
    zoom: 7,
    disableDefaultUI: false,
    zoomControl: true,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false
  });
  
  allFields.forEach(f => {
    if (!f['Ссылка Maps']) return;
    
    // Координаты формат: "52,5276925, 26,6100870" (запятая как разделитель!)
    const coords = f['Ссылка Maps'].split(',').map(c => c.trim());
    if (coords.length < 2) return;
    
    const lat = parseNum(coords[0]);
    const lng = parseNum(coords[1]);
    if (isNaN(lat) || isNaN(lng)) return;
    
    let color = '#d97706'; // новое
    if (f['Статус'] === 'подтверждено') color = '#3a6aee';
    if (f['Статус'] === 'в работе') color = '#8b5cf6';
    if (f['Статус'] === 'готово') color = '#3aaa5e';
    
    const marker = new google.maps.Marker({
      position: { lat, lng },
      map: map,
      title: f['Название поля'],
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        fillColor: color,
        fillOpacity: 0.9,
        strokeColor: '#fff',
        strokeWeight: 2,
        scale: 8
      }
    });
    
    const info = new google.maps.InfoWindow({
      content: `<div style="font-family:var(--f);padding:4px">
        <div style="font-weight:800;font-size:13px;margin-bottom:4px">${f['Название поля']}</div>
        <div style="font-size:11px;color:#666">${f['Районный центр'] || '—'} · ${f['Культура'] || '—'}</div>
        <div style="font-size:11px;margin-top:4px">${parseNum(f['Площадь га'])} га · ${f['Статус']}</div>
      </div>`
    });
    
    marker.addListener('click', () => info.open(map, marker));
    markers.push(marker);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

window.addEventListener('DOMContentLoaded', loadAllData);
</script>
</body>
</html>
