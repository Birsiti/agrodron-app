<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ | AgroDron.BY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f2847;--navy2:#1a3a6b;--navy3:#0a1e35;
  --green:#1a6b4a;--gl:#e8f4ee;--gm:#3dbf8a;
  --bg:#f0f3f7;--card:#fff;--border:#e2e8f0;
  --text:#1a1a2e;--muted:#64748b;
  --amber:#b45309;--amber-bg:#fef3c7;
  --red:#dc2626;--red-bg:#fef2f2;
  --changed:#fff7ed;--changed-border:#fb923c;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}

/* ── HEADER ── */
.hdr{background:var(--navy);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;border-bottom:2px solid var(--navy2)}
.hlogo{display:flex;align-items:center;gap:10px}
.hlm{width:32px;height:32px;background:var(--gm);border-radius:8px;display:grid;place-items:center}
.hlm svg{width:16px;height:16px;fill:#fff}
.hln{font-size:15px;font-weight:700;color:#fff}
.hln span{color:var(--gm)}
.hls{font-size:10px;color:rgba(255,255,255,.4);margin-top:1px}
.adm-badge{background:rgba(251,191,36,.2);color:#fbbf24;font-size:10px;font-weight:700;padding:4px 10px;border-radius:5px;border:1px solid rgba(251,191,36,.3)}

/* ── PIN ── */
.pin-screen{position:fixed;inset:0;background:var(--navy3);display:flex;align-items:center;justify-content:center;z-index:100}
.pin-box{background:var(--navy);border:1px solid var(--navy2);border-radius:20px;padding:40px 36px;width:320px;text-align:center;box-shadow:0 40px 80px rgba(0,0,0,.5)}
.pin-icon{width:56px;height:56px;background:rgba(251,191,36,.15);border:2px solid rgba(251,191,36,.3);border-radius:14px;display:grid;place-items:center;margin:0 auto 20px;font-size:24px}
.pin-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}
.pin-sub{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:24px}
.pin-input{width:100%;padding:14px;text-align:center;font-size:24px;letter-spacing:8px;border:2px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.05);color:#fff;font-family:monospace;margin-bottom:14px;transition:.2s}
.pin-input:focus{outline:none;border-color:#fbbf24;background:rgba(251,191,36,.05)}
.pin-btn{width:100%;padding:13px;background:#fbbf24;color:var(--navy);border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.pin-btn:hover{background:#f59e0b}
.pin-err{color:#f87171;font-size:12px;margin-top:10px;display:none}

/* ── LAYOUT ── */
.wrap{max-width:960px;margin:0 auto;padding:20px 16px}

/* ── TABS ── */
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:20px}
.tab{flex:1;padding:10px;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);background:transparent;transition:.15s}
.tab.active{background:var(--navy);color:#fff}
.tab:hover:not(.active){background:#f5f8fc}

/* ── TOP BAR ── */
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.top-title{font-size:16px;font-weight:700;color:var(--navy)}
.top-actions{display:flex;gap:8px;align-items:center}
.changes-badge{background:var(--amber-bg);color:var(--amber);font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;display:none}
.changes-badge.show{display:inline-block}
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.btn-save{background:var(--green);color:#fff}
.btn-save:hover{background:#145a3d}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.btn-reset{background:#f5f8fc;color:var(--muted);border:1.5px solid var(--border)}
.btn-reset:hover{border-color:var(--red);color:var(--red)}
.btn-reload{background:#f5f8fc;color:var(--navy);border:1.5px solid var(--border);font-size:12px}
.btn-reload:hover{border-color:var(--navy);color:var(--navy)}

/* ── SECTION ── */
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
.section-hdr{padding:12px 16px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.section-hdr .sec-count{background:var(--border);color:var(--muted);font-size:9px;padding:1px 6px;border-radius:10px}
.section-body{padding:4px 0}

/* ── ROW ── */
.vrow{display:grid;grid-template-columns:1fr 120px 100px;gap:0;align-items:center;padding:8px 16px;border-bottom:1px solid #f5f8fc;transition:.15s}
.vrow:last-child{border-bottom:none}
.vrow:hover{background:#fafbfd}
.vrow.changed{background:var(--changed);border-left:3px solid var(--changed-border)}
.vrow.changed .vrow-key{color:var(--amber)}
.vrow-label{font-size:13px;color:var(--text);font-weight:500}
.vrow-note{font-size:10px;color:var(--muted);margin-top:2px}
.vrow-key{font-size:9px;color:var(--muted);font-family:monospace;margin-top:1px}
.vrow-orig{font-size:10px;color:var(--muted);text-align:right;padding-right:12px}
.vrow-orig.was-changed{color:var(--amber);text-decoration:line-through}
.vrow-input{width:100%;padding:6px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-weight:600;color:var(--text);background:#fafbfd;text-align:right;transition:.15s}
.vrow-input:focus{outline:none;border-color:var(--green);background:#fff}
.vrow-input.changed{border-color:var(--changed-border);background:var(--changed)}

/* ── SAVE BAR ── */
.save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--navy);padding:14px 20px;display:flex;gap:12px;align-items:center;z-index:40;transform:translateY(100%);transition:.3s;border-top:2px solid var(--navy2)}
.save-bar.show{transform:translateY(0)}
.save-bar-msg{color:rgba(255,255,255,.7);font-size:13px;flex:1}
.save-bar-count{background:rgba(251,191,36,.2);color:#fbbf24;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px}
.btn-save-bar{padding:11px 20px;background:var(--gm);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer}
.btn-save-bar:hover{background:#2ea877}
.btn-cancel-bar{padding:11px 16px;background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:8px;font-size:12px;cursor:pointer}

/* ── TOAST ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:500;z-index:200;transition:.3s;opacity:0;white-space:nowrap;border:1px solid var(--navy2)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{border-color:var(--gm)}
.toast.err{border-color:#f87171}

/* ── LOADING ── */
.loading{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── STATUS ── */
.status-bar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding:8px 16px;background:#f8fafc;border-top:1px solid var(--border)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--gm)}
.status-dot.loading{background:#fbbf24;animation:pulse 1s infinite}
.status-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.hidden{display:none}
@media(max-width:600px){
  .wrap{padding:12px 10px}
  .tabs{flex-direction:column;gap:3px}
  .tab{text-align:left;padding:9px 12px}
  .top-bar{flex-direction:column;align-items:flex-start}
  .top-actions{width:100%;justify-content:flex-end}
  .vrow{grid-template-columns:1fr 80px 90px;gap:0;padding:8px 12px}
  .vrow-input{font-size:14px;padding:7px 6px}
  .save-bar{padding:10px 12px;gap:8px}
  .save-bar-msg{font-size:11px}
  .btn-save-bar{padding:10px 14px;font-size:12px}
}
</style>
</head>
<body>

<!-- PIN -->
<div class="pin-screen" id="pinScreen">
  <div class="pin-box">
    <div class="pin-icon">🔐</div>
    <div class="pin-title">Панель администратора</div>
    <div class="pin-sub">AgroDron.BY · ЗАО «АТК»</div>
    <input class="pin-input" type="password" id="pinIn" maxlength="8" placeholder="••••" autocomplete="off">
    <button class="pin-btn" onclick="checkPin()">Войти</button>
    <div class="pin-err" id="pinErr">Неверный PIN-код</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- HEADER -->
<div class="hdr">
  <div class="hlogo">
    <div class="hlm"><svg viewBox="0 0 24 24"><path d="M12 2L4 7v6c0 5 3.5 9.74 8 11 4.5-1.26 8-6 8-11V7L12 2z"/></svg></div>
    <div><div class="hln">Agro<span>Dron</span>.BY</div><div class="hls">Панель администратора</div></div>
  </div>
  <span class="adm-badge">ADMIN</span>
</div>

<div class="wrap hidden" id="mainWrap">

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" id="tab_coef" onclick="switchTab('coef')">📐 Коэффициенты (КЭФ)</button>
    <button class="tab" id="tab_vars" onclick="switchTab('vars')">⚙️ Переменные</button>
  </div>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div>
      <div class="top-title" id="topTitle">Коэффициенты расчёта</div>
    </div>
    <div class="top-actions">
      <span class="changes-badge" id="changesBadge">● 0 изменений</span>
      <button class="btn btn-reload" onclick="reloadData()">🔄 Обновить</button>
      <button class="btn btn-reset" onclick="resetChanges()">Сбросить</button>
      <button class="btn btn-save" id="btnSave" onclick="saveChanges()" disabled>Сохранить</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="content">
    <div class="loading"><div class="spinner"></div>Загрузка данных...</div>
  </div>

  <!-- STATUS -->
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Загрузка...</span>
  </div>

</div>

<!-- SAVE BAR -->
<div class="save-bar" id="saveBar">
  <span class="save-bar-msg">Есть несохранённые изменения</span>
  <span class="save-bar-count" id="saveBarCount">0</span>
  <button class="btn-cancel-bar" onclick="resetChanges()">Отменить</button>
  <button class="btn-save-bar" onclick="saveChanges()">💾 Сохранить в таблицу</button>
</div>

<script>
const ADMIN_PIN='9999'; // поменяй!
const SHEETS_ID='1NzeC5jdm5osCHFQVSHKpUGMkWT2xI6xTjwl7LMRLHWU';
const WEBHOOK_URL='https://hook.eu2.make.com/nvgwuuo4vf50clenoyojkn9lll6cy0eg';

const $=id=>document.getElementById(id);

// Данные
let currentTab='coef';
let sheetData={coef:[],vars:[]}; // [{rowIndex, key, label, value, note}]
let changes={}; // {rowIndex_sheet: newValue}

/* ── PIN ── */
function checkPin(){
  if($('pinIn').value===ADMIN_PIN){
    $('pinScreen').style.display='none';
    $('mainWrap').classList.remove('hidden');
    loadAll();
  } else {
    $('pinErr').style.display='block';
    $('pinIn').value='';
    $('pinIn').focus();
    setTimeout(()=>$('pinErr').style.display='none',2000);
  }
}
$('pinIn').addEventListener('keydown',e=>{if(e.key==='Enter')checkPin();});
setTimeout(()=>$('pinIn').focus(),100);

/* ── TABS ── */
function switchTab(t){
  currentTab=t;
  ['coef','vars'].forEach(x=>{
    $('tab_'+x).classList.toggle('active',x===t);
  });
  $('topTitle').textContent=t==='coef'?'Коэффициенты расчёта':'Производственные переменные';
  renderTable();
}

/* ── LOAD ── */
async function loadSheet(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEETS_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
  const res=await fetch(url);
  const txt=await res.text();
  const json=JSON.parse(txt.replace(/^[^(]+\(/,'').replace(/\);?$/,''));
  const colType=(json.table.cols[2]?.type||'number');
  const isDateCol=colType==='date';
  const rows=[];
  json.table.rows.forEach((r,i)=>{
    const key=(r.c[0]?.v||'').toString().trim();
    if(!key) return;
    const label=(r.c[1]?.v||'').toString().trim();
    const cell=r.c[2];
    const note=(r.c[3]?.v||'').toString().trim();
    if(!cell||cell.v===null||cell.v===undefined) return;
    let val=null;
    const v=cell.v;
    if(isDateCol){
      if(typeof v==='string'&&v.startsWith('Date(')){
        const parts=v.replace('Date(','').replace(')','').split(',').map(Number);
        const day=parts[2],month=parts[1]+1;
        val=parseFloat(`${day}.${(day===1&&month<10)?'0'+month:month}`);
      } else if(typeof v==='number'){
        // Серийный номер даты — конвертируем через JS Date
        const d=new Date(Math.round((v-25569)*86400000));
        const day=d.getUTCDate(),month=d.getUTCMonth()+1;
        val=parseFloat(`${day}.${(day===1&&month<10)?'0'+month:month}`);
      }
    } else if(typeof v==='number'){
      val=v;
    } else if(typeof v==='string'&&v.startsWith('Date(')){
      const parts=v.replace('Date(','').replace(')','').split(',').map(Number);
      val=parseFloat((parts[2]+((parts[1]+1)/100)).toFixed(4));
    } else {
      const n=parseFloat(v.toString().replace(',','.'));
      if(!isNaN(n)) val=n;
    }
    if(val!==null) rows.push({rowIndex:i+2,key,label,value:val,origValue:val,note,sheet:name,dateCol:isDateCol});
  });
  return{rows,isDateCol};
}

async function loadAll(){
  setStatus('loading','Загрузка данных...');
  try{
    const [res1,res2]=await Promise.all([
      loadSheet('КЭФ'),
      loadSheet('ПЕРЕМЕННЫЕ')
    ]);
    sheetData.coef=res1.rows;
    sheetData.vars=res2.rows;
    // Предупреждение если колонка C — дата
    if(res1.isDateCol||res2.isDateCol){
      showToast('⚠️ Колонка С в Sheets — формат Дата. Проверьте значения!','err');
    }
    changes={};
    renderTable();
    updateChangeBadge();
    setStatus('ok',`Загружено: ${coef.length} коэф. · ${vars.length} переменных · ${new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}`);
  }catch(e){
    console.error(e);
    setStatus('err','Ошибка загрузки. Проверьте доступ к таблице.');
    $('content').innerHTML='<div class="loading" style="color:var(--red)">❌ Не удалось загрузить данные</div>';
  }
}

function reloadData(){
  changes={};
  loadAll();
}

/* ── RENDER ── */
// Группировка — ищем строки-разделители (key пустой) как заголовки секций
async function renderTable(){
  const tab=currentTab;
  const url=`https://docs.google.com/spreadsheets/d/${SHEETS_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab==='coef'?'КЭФ':'ПЕРЕМЕННЫЕ')}`;

  // Перестраиваем с разделителями — читаем raw снова из sheetData + добавляем секции
  const items=sheetData[tab];
  if(!items||!items.length){
    $('content').innerHTML='<div class="loading">Нет данных</div>';
    return;
  }

  // Группируем по секциям (по порядку строк)
  // Определяем секции эвристически — ищем разрывы в rowIndex
  const sections=[];
  let curSection={title:'Общие', rows:[]};
  const sectionTitles={
    // КЭФ
    complexity_simple:'СЛОЖНОСТЬ ПОЛЯ',
    obstacles_no:'ПРЕПЯТСТВИЯ',
    frag_1:'УЧАСТКИ',
    dist_20:'УДАЛЁННОСТЬ',
    add_night:'ДОПЛАТЫ',
    culture_grain:'КУЛЬТУРА',
    // ПЕРЕМЕННЫЕ
    transport_rate:'ТРАНСПОРТ',
    drone_a60_amort:'ДРОН А60-ХМ',
    drone_a70_amort:'ДРОН А70-X',
    drone_a99_amort:'ДРОН А99-Х',
    car_amort:'БРИГАДА',
    op_salary:'ЗАРПЛАТА',
    fsz_pct:'ЦЕНА',
  };

  sections.length=0;
  items.forEach(row=>{
    if(sectionTitles[row.key]){
      if(curSection.rows.length) sections.push({...curSection});
      curSection={title:sectionTitles[row.key], rows:[row]};
    } else {
      curSection.rows.push(row);
    }
  });
  if(curSection.rows.length) sections.push(curSection);

  let html='';
  sections.forEach(sec=>{
    html+=`<div class="section">
      <div class="section-hdr">${sec.title} <span class="sec-count">${sec.rows.length}</span></div>
      <div class="section-body">`;
    sec.rows.forEach(row=>{
      const changeKey=`${row.rowIndex}_${row.sheet}`;
      const hasChange=changes[changeKey]!==undefined;
      const dispVal=hasChange?changes[changeKey]:row.value;
      const origDisp=hasChange?`<div class="vrow-orig was-changed">${row.origValue}</div>`:`<div class="vrow-orig">${row.origValue}</div>`;
      html+=`<div class="vrow${hasChange?' changed':''}" id="row_${changeKey}">
        <div>
          <div class="vrow-label">${row.label}</div>
          ${row.note?`<div class="vrow-note">${row.note}</div>`:''}
          <div class="vrow-key">${row.key}</div>
        </div>
        ${origDisp}
        <input class="vrow-input${hasChange?' changed':''}" 
          type="number" step="0.01" 
          value="${dispVal}"
          data-key="${changeKey}"
          data-orig="${row.origValue}"
          onchange="onValueChange(this)"
          oninput="onValueChange(this)">
      </div>`;
    });
    html+='</div></div>';
  });

  $('content').innerHTML=html;
}

/* ── CHANGE TRACKING ── */
function onValueChange(el){
  const key=el.dataset.key;
  const orig=parseFloat(el.dataset.orig);
  const newVal=parseFloat(el.value);
  const row=$('row_'+key);
  const origEl=row?.querySelector('.vrow-orig');

  if(Math.abs(newVal-orig)>0.00001){
    changes[key]=newVal;
    el.classList.add('changed');
    row?.classList.add('changed');
    if(origEl){origEl.textContent=orig;origEl.classList.add('was-changed');}
  } else {
    delete changes[key];
    el.classList.remove('changed');
    row?.classList.remove('changed');
    if(origEl){origEl.classList.remove('was-changed');}
  }
  updateChangeBadge();
}

function updateChangeBadge(){
  const n=Object.keys(changes).length;
  const badge=$('changesBadge');
  const saveBtn=$('btnSave');
  const saveBar=$('saveBar');
  const saveBarCount=$('saveBarCount');

  badge.textContent=`● ${n} изменени${n===1?'е':n>1&&n<5?'я':'й'}`;
  badge.classList.toggle('show',n>0);
  saveBtn.disabled=n===0;
  saveBarCount.textContent=n;
  saveBar.classList.toggle('show',n>0);
}

function resetChanges(){
  changes={};
  renderTable();
  updateChangeBadge();
  showToast('Изменения сброшены','ok');
}

/* ── SAVE ── */
async function saveChanges(){
  const n=Object.keys(changes).length;
  if(!n) return;

  const rows=Object.entries(changes).map(([key,value])=>{
    const [rowIndex,sheet]=key.split('_',2);
    // sheet может содержать "_" поэтому берём после первого "_"
    const sheetName=key.substring(key.indexOf('_')+1);
    return{row:parseInt(rowIndex), sheet:sheetName, value};
  });

  setStatus('loading',`Сохранение ${n} значений...`);
  $('btnSave').disabled=true;

  try{
    const res=await fetch(WEBHOOK_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        action:'update_vars',
        rows,
        ts:new Date().toISOString(),
      })
    });

    if(res.ok){
      // Применяем изменения как новые оригинальные значения
      Object.entries(changes).forEach(([key,val])=>{
        const [rowIndexStr]=key.split('_');
        const rowIndex=parseInt(rowIndexStr);
        ['coef','vars'].forEach(t=>{
          const item=sheetData[t].find(r=>r.rowIndex===rowIndex);
          if(item) item.origValue=val;
        });
      });
      changes={};
      renderTable();
      updateChangeBadge();
      setStatus('ok',`Сохранено ${n} значений · ${new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}`);
      showToast(`✓ Сохранено ${n} значений`,'ok');
    } else {
      throw new Error('HTTP '+res.status);
    }
  }catch(e){
    console.error(e);
    setStatus('err','Ошибка сохранения — проверьте Make сценарий');
    showToast('❌ Ошибка. Make сценарий не ответил','err');
    $('btnSave').disabled=false;
  }
}

/* ── STATUS ── */
function setStatus(type,msg){
  const dot=$('statusDot');
  dot.className='status-dot'+(type==='loading'?' loading':type==='err'?' err':'');
  $('statusText').textContent=msg;
}

/* ── TOAST ── */
function showToast(msg,type=''){
  const t=$('toast');
  t.textContent=msg;
  t.className='toast show'+(type?' '+type:'');
  setTimeout(()=>t.className='toast',3000);
}
</script>
</body>
</html>
